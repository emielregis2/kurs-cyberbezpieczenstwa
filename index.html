LESSONS[5] = {
  lead:"Atakujący i obrońcy używają tych samych protokołów. Zrozumienie, jak pakiet przechodzi przez sieć, pozwala zobaczyć, gdzie można go podsłuchać, sfałszować lub zablokować.",
  goals:["Przypisać zagrożenia i urządzenia do warstw modelu OSI","Opisać trójstopniowe uzgodnienie TCP i rolę portów","Obliczać podsieci w notacji CIDR i rozpoznawać adresy prywatne","Zastąpić protokoły niezaszyfrowane ich bezpiecznymi odpowiednikami"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Pytania o porty, protokoły i warstwy OSI pojawiają się w niemal każdej domenie egzaminu. Kojarz każdy protokół z jego portem i bezpiecznym odpowiednikiem.</div>'+
'<h2>Model OSI z perspektywy bezpieczeństwa</h2>'+
'<div class="tablewrap"><table><tr><th>Warstwa</th><th>Funkcja</th><th>Urządzenia / protokoły</th><th>Przykładowe ataki i zabezpieczenia</th></tr>'+
'<tr><td>7 Aplikacji</td><td>Usługi dla użytkownika</td><td>HTTP, DNS, SMTP</td><td>SQLi, XSS; WAF, walidacja danych</td></tr>'+
'<tr><td>6 Prezentacji</td><td>Format, szyfrowanie</td><td>TLS (umownie)</td><td>Słabe szyfry; poprawna konfiguracja TLS</td></tr>'+
'<tr><td>5 Sesji</td><td>Zarządzanie sesjami</td><td>Sesje, tokeny</td><td>Przejęcie sesji; wygasanie sesji</td></tr>'+
'<tr><td>4 Transportu</td><td>Połączenia, porty</td><td>TCP, UDP</td><td>SYN flood, skanowanie portów; firewall stanowy</td></tr>'+
'<tr><td>3 Sieciowa</td><td>Adresacja i routing</td><td>IP, router</td><td>Spoofing IP; ACL, filtrowanie</td></tr>'+
'<tr><td>2 Łącza danych</td><td>Ramki, adresy MAC</td><td>Switch, VLAN</td><td>ARP poisoning, MAC flooding; port security</td></tr>'+
'<tr><td>1 Fizyczna</td><td>Sygnał, kable</td><td>Kable, huby, Wi-Fi</td><td>Podsłuch fizyczny, zakłócanie; kontrola fizyczna</td></tr></table></div>'+
'<p>Mnemonik: <i>Please Do Not Throw Sausage Pizza Away</i> (od warstwy 1). Model TCP/IP ma cztery warstwy (dostępu do sieci, internetu, transportowa, aplikacji) i to na nim działa praktyka.</p>'+
'<h2>TCP, UDP i trójstopniowe uzgodnienie</h2>'+
'<p><b>TCP</b> jest połączeniowy i niezawodny (potwierdzenia, retransmisje). <b>UDP</b> jest bezpołączeniowy i szybki (DNS, VoIP, strumienie). Połączenie TCP zaczyna się od <b>three-way handshake</b>:</p>'+
'<pre><code>Klient  --SYN-->      Serwer    "chcę się połączyć"\nKlient  <--SYN/ACK--  Serwer    "zgoda, jestem gotowy"\nKlient  --ACK-->      Serwer    "potwierdzam"  (połączenie ustanowione)</code></pre>'+
'<p>Atak <b>SYN flood</b> wysyła mnóstwo SYN bez finalnego ACK i zapełnia tablicę półotwartych połączeń. Skanery portów też wykorzystują ten mechanizm: brak odpowiedzi lub RST mówi im o stanie portu.</p>'+
'<h2>Porty i protokoły, które musisz znać</h2>'+
'<div class="tablewrap"><table><tr><th>Usługa</th><th>Port</th><th>Uwagi bezpieczeństwa</th></tr>'+
'<tr><td>HTTP / HTTPS</td><td>80 / 443</td><td>Preferuj HTTPS (TLS)</td></tr>'+
'<tr><td>FTP / SFTP</td><td>21 / 22</td><td>FTP przesyła hasła jawnym tekstem; użyj SFTP</td></tr>'+
'<tr><td>SSH</td><td>22</td><td>Zastępuje Telnet</td></tr>'+
'<tr><td>Telnet</td><td>23</td><td>Niezaszyfrowany, nie używać</td></tr>'+
'<tr><td>SMTP / SMTPS (submission)</td><td>25 / 587, 465</td><td>25 do przekazywania między serwerami; klienci przez 587 lub 465</td></tr>'+
'<tr><td>DNS</td><td>53 (UDP, TCP)</td><td>Podatny na spoofing i tunelowanie; DNSSEC, DoT/DoH</td></tr>'+
'<tr><td>DHCP</td><td>67, 68 (UDP)</td><td>Rogue DHCP; DHCP snooping</td></tr>'+
'<tr><td>POP3 / IMAP</td><td>110 / 143; szyfrowane 995 / 993</td><td>Używaj wersji z TLS</td></tr>'+
'<tr><td>LDAP / LDAPS</td><td>389 / 636</td><td>LDAPS dla szyfrowania</td></tr>'+
'<tr><td>SMB</td><td>445</td><td>Nigdy do internetu (por. WannaCry)</td></tr>'+
'<tr><td>RDP</td><td>3389</td><td>Częsty wektor ransomware; tylko przez VPN i z MFA</td></tr>'+
'<tr><td>SNMP</td><td>161 (UDP)</td><td>Używaj SNMPv3</td></tr>'+
'<tr><td>NTP</td><td>123 (UDP)</td><td>Spójny czas to podstawa logów; bywa nadużywany w DDoS</td></tr></table></div>'+
'<h2>Adresacja IP i CIDR</h2>'+
'<p>Notacja CIDR wskazuje, ile bitów adresu to sieć. Maska 255.255.255.0 to <code>/24</code>, czyli 256 adresów, z czego 254 użyteczne (adres sieci i rozgłoszeniowy są zarezerwowane). Wzór na liczbę hostów: <code>2<sup>32-n</sup> - 2</code>.</p>'+
'<div class="tablewrap"><table><tr><th>CIDR</th><th>Maska</th><th>Użyteczne hosty</th></tr><tr><td>/24</td><td>255.255.255.0</td><td>254</td></tr><tr><td>/25</td><td>255.255.255.128</td><td>126</td></tr><tr><td>/26</td><td>255.255.255.192</td><td>62</td></tr><tr><td>/27</td><td>255.255.255.224</td><td>30</td></tr><tr><td>/30</td><td>255.255.255.252</td><td>2</td></tr></table></div>'+
'<p><b>Adresy prywatne</b> (RFC 1918): <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code> (172.16.x.x do 172.31.x.x), <code>192.168.0.0/16</code>. Adres <code>169.254.x.x</code> (APIPA) przydziela system, gdy nie znajdzie DHCP. Pozostałe są publiczne. Podsieci pozwalają ograniczać ruch i uprawnienia, więc są podstawą segmentacji (lekcja 7).</p>'+
'<h2>DNS i poczta w skrócie</h2>'+
'<p><b>DNS</b> zamienia nazwy na adresy. Kto kontroluje odpowiedzi DNS, kontroluje, dokąd trafia użytkownik. <b>SMTP</b> wysyła pocztę i bez dodatkowych mechanizmów pozwala fałszować nadawcę, dlatego stosuje się SPF, DKIM i DMARC (omówimy je przy phishingu i bramach pocztowych).</p>',
  ex:[
  {t:"Przykład 1: dopasuj protokół do bezpiecznej wersji",
   h:'<div class="tablewrap"><table><tr><th>Ryzykowne</th><th>Bezpieczniejsze</th><th>Dlaczego</th></tr><tr><td>Telnet (23)</td><td>SSH (22)</td><td>Szyfrowanie sesji i haseł</td></tr><tr><td>HTTP (80)</td><td>HTTPS (443)</td><td>TLS chroni przed podsłuchem i podmianą treści</td></tr><tr><td>FTP (21)</td><td>SFTP (22) lub FTPS</td><td>Hasła nie idą jawnym tekstem</td></tr><tr><td>SNMPv1/v2c</td><td>SNMPv3</td><td>Uwierzytelnianie i szyfrowanie</td></tr><tr><td>LDAP (389)</td><td>LDAPS (636)</td><td>Szyfrowane zapytania do katalogu</td></tr><tr><td>POP3 / IMAP</td><td>POP3S (995) / IMAPS (993)</td><td>Szyfrowanie poczty w drodze</td></tr></table></div>'},
  {t:"Przykład 2: podsieci w Pythonie",
   h:'<pre><code>import ipaddress\n\nnet = ipaddress.ip_network("192.168.10.0/26")\nprint(net.netmask)                 # 255.255.255.192\nprint(net.num_addresses - 2)       # 62 użyteczne hosty\nprint(net.network_address, net.broadcast_address)\n\n# podział sieci /22 na cztery sieci /24\nfor s in ipaddress.ip_network("10.0.0.0/22").subnets(new_prefix=24):\n    print(s)\n\nprint(ipaddress.ip_address("172.20.1.5").is_private)   # True  (172.16-31)\nprint(ipaddress.ip_address("172.32.1.5").is_private)   # False (publiczny)</code></pre>'+
   '<p>Moduł <code>ipaddress</code> to szybki sposób, by zweryfikować plan adresacji lub sprawdzić, czy adres w logu pochodzi z sieci wewnętrznej.</p>'},
  {t:"Przykład 3: co widać w trójstopniowym uzgodnieniu",
   h:'<p>W Wireshark ustawiasz filtr <code>tcp.port == 443</code> i obserwujesz początek połączenia:</p>'+
   '<pre><code>1  10.0.0.5  -> 93.184.216.34  TCP  [SYN]      Seq=0\n2  93.184.216.34 -> 10.0.0.5   TCP  [SYN, ACK] Seq=0 Ack=1\n3  10.0.0.5  -> 93.184.216.34  TCP  [ACK]      Seq=1 Ack=1\n4  10.0.0.5  -> 93.184.216.34  TLS  Client Hello</code></pre>'+
   '<p>Zadanie: jak wyglądałby ten zapis przy skanowaniu portu zamkniętego? Odpowiedź: po pakiecie SYN serwer odpowie <code>[RST, ACK]</code> i uzgodnienie się nie zakończy. Wiele takich par do różnych portów z jednego adresu to sygnatura skanowania (lekcja 6).</p>'}
  ],
  quiz:[
  {q:"Na której warstwie modelu OSI działa router podejmujący decyzje na podstawie adresów IP?",o:["Warstwa 2","Warstwa 3","Warstwa 4","Warstwa 7"],a:1,w:"Routing na podstawie adresów IP to warstwa sieciowa (3). Switch działa na warstwie 2, a firewall stanowy głównie na 3 i 4."},
  {q:"Jaka jest kolejność pakietów w trójstopniowym uzgodnieniu TCP?",o:["ACK, SYN, SYN/ACK","SYN, SYN/ACK, ACK","SYN, ACK, FIN","SYN/ACK, SYN, ACK"],a:1,w:"Klient wysyła SYN, serwer odpowiada SYN/ACK, a klient potwierdza ACK."},
  {q:"Ile użytecznych adresów hostów ma sieć /26?",o:["30","62","64","126"],a:1,w:"/26 daje 2^6 = 64 adresy, z których 2 (adres sieci i rozgłoszeniowy) są zarezerwowane, więc 62 użyteczne."},
  {q:"Który z adresów jest adresem prywatnym?",o:["172.32.4.10","192.169.1.5","172.20.1.5","11.0.0.1"],a:2,w:"Prywatny zakres 172.16.0.0/12 obejmuje 172.16.x.x do 172.31.x.x. Pozostałe adresy są publiczne."},
  {q:"Administrator zarządza urządzeniami przez Telnet. Co zalecisz?",o:["Zmianę portu Telnet na inny","SSH zamiast Telnetu","Zablokowanie portu 22","Telnet przez HTTP"],a:1,w:"Telnet przesyła dane, w tym hasła, jawnym tekstem. SSH szyfruje sesję i jest standardowym zamiennikiem."},
  {q:"Nieoczekiwane połączenie na porcie 445 z internetu do stacji roboczej to powód do niepokoju, bo:",o:["SMB nie powinien być wystawiony do internetu i był wektorem ataków typu WannaCry","Port 445 służy tylko do poczty","Port 445 jest zarezerwowany dla DHCP","To zawsze normalny ruch WWW"],a:0,w:"SMB (445) powinien działać tylko w sieci wewnętrznej. Wystawienie go do internetu to poważna ekspozycja, wykorzystana m.in. przez WannaCry."}
  ]
};

LESSONS[6] = {
  lead:"Sieć mówi prawdę, jeśli umiesz ją czytać. Poznajesz klasyczne ataki w sieci lokalnej i internecie oraz uczysz się rozpoznawać ich ślady w ruchu.",
  goals:["Rozróżnić sniffing, spoofing, MITM, evil twin i ataki DoS","Wskazać zabezpieczenia na warstwach 2 i 3","Użyć filtrów Wireshark i tcpdump do analizy ruchu","Rozpoznać sygnatury skanowania, beaconingu i tunelowania DNS"],
  intro:
'<h2>Ataki na ruch i tożsamość w sieci</h2>'+
'<div class="tablewrap"><table><tr><th>Atak</th><th>Na czym polega</th><th>Zabezpieczenia</th></tr>'+
'<tr><td>Sniffing</td><td>Podsłuch ruchu (tryb nasłuchu, port mirror)</td><td>Szyfrowanie (TLS, SSH, VPN), switche zamiast hubów</td></tr>'+
'<tr><td>ARP spoofing / poisoning</td><td>Fałszywe odpowiedzi ARP kojarzą adres IP bramy z MAC atakującego</td><td>Dynamic ARP Inspection, statyczne wpisy dla krytycznych hostów, segmentacja</td></tr>'+
'<tr><td>MAC flooding</td><td>Zalew ramek z różnymi MAC zapełnia tablicę switcha, a ten zaczyna rozsyłać ruch na wszystkie porty</td><td>Port security (limit adresów MAC na port)</td></tr>'+
'<tr><td>IP spoofing</td><td>Fałszywy adres źródłowy (często w DDoS)</td><td>Filtrowanie wejścia i wyjścia (egress/ingress), uRPF</td></tr>'+
'<tr><td>DNS poisoning</td><td>Wstrzyknięcie fałszywych wpisów do pamięci podręcznej DNS</td><td>DNSSEC, aktualne resolvery, losowe porty i identyfikatory</td></tr>'+
'<tr><td>Rogue DHCP</td><td>Fałszywy serwer DHCP podaje złą bramę lub DNS</td><td>DHCP snooping</td></tr>'+
'<tr><td>Man-in-the-Middle</td><td>Atakujący pośredniczy w komunikacji, odczytuje lub zmienia ją</td><td>TLS z weryfikacją certyfikatu, HSTS, uwierzytelnianie wzajemne</td></tr>'+
'<tr><td>Evil twin</td><td>Fałszywy punkt dostępowy o nazwie legalnej sieci, często z wysyłaniem ramek de-autoryzacji</td><td>WPA3, 802.1X, ochrona ramek zarządzania (PMF), wykrywanie rogue AP</td></tr>'+
'<tr><td>Session hijacking / replay</td><td>Kradzież lub odtworzenie ciasteczka lub tokenu sesji</td><td>TLS, flagi ciasteczek, krótkie sesje, powiązanie z urządzeniem</td></tr></table></div>'+
'<h2>DoS i DDoS w sieci</h2>'+
'<p>SYN flood zapełnia tablicę półotwartych połączeń (obrona: SYN cookies, limity). Ataki wolumetryczne zalewają łącze (obrona: usługa ochrony DDoS u operatora lub w chmurze, anycast, CDN). Ataki aplikacyjne uderzają w kosztowne zapytania (obrona: rate limiting, WAF). Sama zapora w firmie nie rozwiąże ataku, który wypełnia łącze, bo zator powstaje przed nią.</p>'+
'<h2>Wireshark i tcpdump w praktyce</h2>'+
'<p>Wireshark pokazuje pakiety graficznie, tcpdump działa w terminalu i nadaje się do serwerów. Dwa rodzaje filtrów: <b>filtr przechwytywania</b> (BPF, ogranicza, co zapisujesz) i <b>filtr wyświetlania</b> (Wireshark, ogranicza, co oglądasz).</p>'+
'<div class="tablewrap"><table><tr><th>Cel</th><th>Filtr wyświetlania Wireshark</th></tr>'+
'<tr><td>Ruch jednego hosta</td><td><code>ip.addr == 10.0.0.5</code></td></tr>'+
'<tr><td>Tylko DNS</td><td><code>dns</code></td></tr>'+
'<tr><td>Połączenia HTTPS</td><td><code>tcp.port == 443</code></td></tr>'+
'<tr><td>Same pakiety SYN (początek połączeń)</td><td><code>tcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0</code></td></tr>'+
'<tr><td>Zerwania połączeń</td><td><code>tcp.flags.reset == 1</code></td></tr>'+
'<tr><td>Odpowiedzi ARP</td><td><code>arp.opcode == 2</code></td></tr>'+
'<tr><td>Hasła w jawnym HTTP (lab)</td><td><code>http.request.method == "POST"</code></td></tr></table></div>'+
'<h2>Jak wygląda anomalia</h2>'+
'<ul><li><b>Skanowanie portów</b>: jedno źródło wysyła SYN do wielu portów lub hostów, większość kończy RST lub bez odpowiedzi.</li>'+
'<li><b>Beaconing</b>: regularne, małe połączenia do tego samego zewnętrznego adresu (np. co 60 sekund). Typowy ślad komunikacji z serwerem C2.</li>'+
'<li><b>Tunelowanie DNS</b>: bardzo długie, losowe nazwy subdomen i duża liczba zapytań do jednej domeny.</li>'+
'<li><b>Eksfiltracja</b>: nietypowo duży ruch wychodzący, zwłaszcza nocą i do nieznanych miejsc.</li>'+
'<li><b>ARP spoofing</b>: ten sam adres IP skojarzony z dwoma różnymi MAC, lub nagłe nadmiarowe odpowiedzi ARP.</li></ul>'+
'<div class="callout warn"><strong>Etyka i prawo</strong>Przechwytuj ruch wyłącznie we własnym laboratorium albo w sieci, do której masz pisemną zgodę. Podsłuch cudzej komunikacji jest przestępstwem. W firmie ustal zasady z działem prawnym i z ochroną danych (RODO).</div>',
  ex:[
  {t:"Przykład 1: polecenia tcpdump",
   h:'<pre><code># zapis ruchu na interfejsie eth0 do pliku (tylko DNS)\nsudo tcpdump -i eth0 -w dns.pcap port 53\n\n# podgląd ruchu hosta na porcie 443 bez rozwiązywania nazw\nsudo tcpdump -i eth0 -nn host 10.0.0.5 and port 443\n\n# tylko pakiety SYN bez ACK (początki połączeń)\nsudo tcpdump -i eth0 -nn "tcp[tcpflags] &amp; (tcp-syn|tcp-ack) == tcp-syn"</code></pre>'+
   '<p>Najpierw zapisujesz ruch do pliku <code>.pcap</code>, a potem analizujesz go w Wireshark lub skryptem, bez dalszego obciążania systemu produkcyjnego.</p>'},
  {t:"Przykład 2: wykrywanie skanowania portów w pliku pcap (Python + Scapy)",
   h:'<pre><code>from collections import defaultdict\nfrom scapy.all import rdpcap, IP, TCP\n\nsyn_ports = defaultdict(set)\n\nfor pkt in rdpcap("ruch.pcap"):\n    if IP in pkt and TCP in pkt and pkt[TCP].flags == "S":\n        syn_ports[pkt[IP].src].add(pkt[TCP].dport)\n\nfor src, ports in syn_ports.items():\n    if len(ports) &gt; 50:\n        print(f"Możliwe skanowanie z {src}: {len(ports)} różnych portów")</code></pre>'+
   '<p>Próg 50 portów jest przykładowy. W środowisku produkcyjnym kalibrujesz go do normalnego ruchu, a regułę wdrażasz w IDS lub SIEM (lekcja 10).</p>'},
  {t:"Przykład 3: scenariusz ARP poisoning",
   h:'<p>Użytkownicy skarżą się na ostrzeżenia o certyfikatach. W Wireshark widzisz:</p>'+
   '<pre><code>arp.opcode == 2\n10.0.0.1 is at aa:bb:cc:00:11:22     (to była brama)\n10.0.0.1 is at de:ad:be:ef:00:99     (nowy, nieznany MAC)</code></pre>'+
   '<details><summary>Pokaż analizę i reakcję</summary><ul><li>Dwa różne adresy MAC deklarują ten sam adres IP bramy: klasyczny ARP spoofing i próba MITM.</li><li>Ostrzeżenia o certyfikatach to efekt próby przechwycenia HTTPS. TLS i weryfikacja certyfikatu zadziałały zgodnie z założeniami.</li><li>Reakcja: zlokalizuj port switcha z MAC atakującego, odizoluj go, włącz Dynamic ARP Inspection i DHCP snooping, sprawdź, czy ktoś zignorował ostrzeżenia i zalogował się.</li></ul></details>'}
  ],
  quiz:[
  {q:"Atakujący tworzy punkt dostępowy o nazwie sieci firmowej i wysyła ramki de-autoryzacji do legalnych klientów, aby połączyli się z jego urządzeniem. Co to za atak?",o:["ARP poisoning","Evil twin","MAC flooding","Session replay"],a:1,w:"To evil twin: fałszywy AP udający legalną sieć. De-autoryzacja zrywa połączenia z prawdziwym AP i popycha klientów do fałszywego."},
  {q:"Którego zabezpieczenia użyjesz przeciw ARP spoofing w sieci przełączanej?",o:["Dynamic ARP Inspection","Filtr antyspamowy","Szyfrowanie dysków","Zwiększenie rozmiaru okna TCP"],a:0,w:"Dynamic ARP Inspection weryfikuje odpowiedzi ARP względem zaufanej tabeli (np. z DHCP snooping) i odrzuca sfałszowane."},
  {q:"W logach widać ruch jednego źródła: tysiące pakietów SYN do wielu portów jednego hosta, prawie bez zakończonych połączeń. Co to najprawdopodobniej jest?",o:["Normalne pobieranie plików","Skanowanie portów","Tunelowanie DNS","Aktualizacja systemu"],a:1,w:"Wiele SYN do różnych portów z jednego źródła, bez finalizacji uzgodnienia, to sygnatura skanowania portów."},
  {q:"Która cecha ruchu najlepiej wskazuje na komunikację z serwerem C2 (beaconing)?",o:["Jednorazowy duży transfer w godzinach pracy","Regularne, krótkie połączenia do tego samego zewnętrznego adresu w stałych odstępach","Ruch DHCP przy starcie komputera","Zapytania do wewnętrznego serwera plików"],a:1,w:"Beaconing to cykliczny kontakt zainfekowanego hosta z serwerem sterującym, widoczny jako regularne małe połączenia."},
  {q:"Która ochrona jest najskuteczniejsza przeciw podsłuchowi haseł w ruchu sieciowym?",o:["Ukrycie nazwy sieci (SSID)","Szyfrowanie transmisji (TLS, SSH, VPN)","Zmiana adresów MAC","Wyłączenie ICMP"],a:1,w:"Szyfrowanie sprawia, że przechwycone pakiety nie ujawniają haseł. Ukrycie SSID czy zmiana MAC nie chronią zawartości ruchu."},
  {q:"Firma jest zalewana ruchem z zewnątrz, który wypełnia jej łącze internetowe. Co najlepiej pomoże?",o:["Antywirus na serwerach","Usługa ochrony przed DDoS u operatora lub w chmurze","Nowe hasła administratorów","System IDS w sieci wewnętrznej"],a:1,w:"Zator powstaje przed firmową infrastrukturą, więc filtrowanie musi nastąpić wyżej, u operatora lub w usłudze ochrony DDoS."}
  ]
};

LESSONS[7] = {
  lead:"Dobrze zaprojektowana sieć sprawia, że nawet udany atak zostaje uwięziony w jednym miejscu. Uczysz się dzielić sieć na strefy i stawiać między nimi kontrolowane bramy.",
  goals:["Opisać strefy LAN, screened subnet (DMZ) i WAN oraz zasady umieszczania w nich systemów","Dobrać metodę segmentacji: fizyczną, air gap, VLAN, podsieci","Wyjaśnić Zero Trust i ruch wschód-zachód","Zaprojektować prostą macierz przepływów z domyślną odmową"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Architektura bezpiecznej sieci i segmentacja to jedne z najczęstszych tematów pytań scenariuszowych (cele z domeny 3 i 4). Termin "screened subnet" zastępuje na egzaminie wcześniejsze "DMZ".</div>'+
'<h2>Strefy bezpieczeństwa</h2>'+
'<div class="tablewrap"><table><tr><th>Strefa</th><th>Charakter</th><th>Co tu umieszczamy</th></tr>'+
'<tr><td><b>LAN</b> (sieć wewnętrzna)</td><td>Najbardziej zaufana, szybka</td><td>Kontrolery domeny, serwery baz danych, intranet</td></tr>'+
'<tr><td><b>Screened subnet</b> (DMZ, sieć obwodowa)</td><td>Bufor między LAN a internetem</td><td>Serwery dostępne z internetu: WWW, poczta, odwrotny proxy</td></tr>'+
'<tr><td><b>WAN</b> / internet</td><td>Niezaufana</td><td>Cały ruch z tej strefy musi być szyfrowany i kontrolowany</td></tr></table></div>'+
'<div class="callout warn"><strong>Reguła egzaminacyjna i praktyczna</strong>Kontrolera domeny ani serwera bazy danych nie umieszcza się w screened subnet. Serwery wystawione do internetu są najbardziej narażone, więc nie mogą mieć bezpośredniego dostępu do najcenniejszych zasobów. Ruch z screened subnet do LAN ograniczamy do minimum, np. jedna reguła do jednego hosta.</div>'+
'<h2>Metody segmentacji</h2>'+
'<div class="tablewrap"><table><tr><th>Metoda</th><th>Opis</th><th>Kiedy</th></tr>'+
'<tr><td>Fizyczna</td><td>Osobne urządzenia i okablowanie</td><td>Najwyższa izolacja, wyższy koszt</td></tr>'+
'<tr><td>Air gap</td><td>Brak jakiegokolwiek połączenia sieciowego; dane tylko przez nośniki wymienne</td><td>Dział R&amp;D, systemy tajne. Ryzyko przenosi się na nośniki (por. Stuxnet)</td></tr>'+
'<tr><td>VLAN</td><td>Logiczne sieci w jednym switchu, rozdzielane tagami 802.1Q</td><td>Działy (IT, finanse), urządzenia IoT, systemy przemysłowe</td></tr>'+
'<tr><td>Podsieci i ACL / firewall</td><td>Reguły między podsieciami na routerze lub zaporze</td><td>Kontrola ruchu między VLAN-ami</td></tr>'+
'<tr><td>Mikrosegmentacja</td><td>Reguły na poziomie pojedynczej maszyny lub obciążenia</td><td>Centra danych, chmura</td></tr></table></div>'+
'<p>Sama konfiguracja VLAN nie wystarczy. Ruch między VLAN-ami przechodzi przez router lub firewall warstwy 3 i tam muszą istnieć reguły, w przeciwnym razie izolacja jest pozorna.</p>'+
'<h2>Ruch północ-południe i wschód-zachód</h2>'+
'<p>Ruch <b>północ-południe</b> przechodzi między siecią a światem zewnętrznym i jest tradycyjnie najlepiej pilnowany. Ruch <b>wschód-zachód</b> płynie między serwerami wewnątrz sieci. Atakujący, który wszedł do środka, porusza się właśnie tak (ruch boczny, lateral movement), więc segmentacja i monitoring wewnętrzny są kluczowe.</p>'+
'<h2>Zero Trust</h2>'+
'<p>Model Zero Trust zakłada brak zaufania z samego położenia w sieci. Każde żądanie dostępu jest weryfikowane: kto prosi (tożsamość), z jakiego urządzenia (stan, zgodność), do czego (zasób), w jakim kontekście (czas, lokalizacja, ryzyko). Dostęp jest minimalny i tymczasowy. Zero Trust nie jest produktem, tylko podejściem łączącym MFA, segmentację, kontrolę urządzeń i ciągły monitoring.</p>'+
'<h2>Chmura: VPC, podsieci publiczne i prywatne</h2>'+
'<p>W chmurze segmentację tworzysz przez <b>VPC</b> (izolowaną sieć wirtualną klienta), <b>podsieci publiczne</b> (z bezpośrednim dostępem do internetu, np. serwery WWW) i <b>prywatne</b> (bazy danych, serwery aplikacji, bez bezpośredniego dostępu z internetu). Ruch wychodzący z podsieci prywatnej idzie przez bramę NAT, a ruch dozwolony kontrolują grupy zabezpieczeń i listy NACL. Połączenie ze środowiskiem firmowym realizuje VPN lub łącze dedykowane. Pojęcia SD-WAN i SASE łączą sieć i usługi bezpieczeństwa dostarczane z chmury dla rozproszonych oddziałów.</p>'+
'<h2>Dostęp administracyjny: serwer przesiadkowy</h2>'+
'<p><b>Jump server</b> (bastion) to jedyna kontrolowana brama, przez którą administratorzy łączą się SSH lub RDP z wrażliwymi segmentami. Dzięki niemu wszystkie sesje są logowane, wymagają MFA i nie trzeba otwierać zarządzania na każdym serwerze.</p>',
  ex:[
  {t:"Przykład 1: macierz przepływów z domyślną odmową",
   h:'<div class="tablewrap"><table><tr><th>Z \\ Do</th><th>Internet</th><th>Screened subnet</th><th>LAN</th><th>Zarządzanie</th></tr>'+
   '<tr><td><b>Internet</b></td><td>-</td><td>443 (WWW), 25 (poczta)</td><td>zakaz</td><td>zakaz</td></tr>'+
   '<tr><td><b>Screened subnet</b></td><td>tylko aktualizacje (443)</td><td>-</td><td>jedna reguła: aplikacja do bazy (konkretny host i port)</td><td>zakaz</td></tr>'+
   '<tr><td><b>LAN</b></td><td>80/443/53 przez proxy</td><td>22/443 do administracji</td><td>wg ról</td><td>zakaz</td></tr>'+
   '<tr><td><b>Zarządzanie (jump server)</b></td><td>zakaz</td><td>22/3389</td><td>22/3389</td><td>-</td></tr></table></div>'+
   '<p>Każda komórka to pytanie: czy ten przepływ jest uzasadniony biznesowo? Jeśli nie, zakaz. Reguły dodajemy po udokumentowaniu potrzeby, a nie odwrotnie.</p>'},
  {t:"Przykład 2: VLAN na przełączniku (składnia w stylu Cisco)",
   h:'<pre><code>vlan 10\n name IT\nvlan 20\n name FINANSE\n\ninterface range gi1/0/1-4\n switchport mode access\n switchport access vlan 10\n\ninterface range gi1/0/20-24\n switchport mode access\n switchport access vlan 20\n\n! ruch między VLAN-ami kontrolowany ACL na interfejsie warstwy 3\nip access-list extended FIN-IN\n permit tcp 10.20.0.0 0.0.0.255 host 10.30.0.10 eq 1433\n deny   ip any 10.20.0.0 0.0.0.255\n permit ip any any</code></pre>'+
   '<p>Porty 1–4 trafiają do VLAN IT, a 20–24 do VLAN finansowego. Nazwy poleceń zależą od producenta, ale zasada jest wszędzie ta sama: przypisanie portów do VLAN, a potem reguły na styku.</p>'},
  {t:"Przykład 3: sprawdzanie przepływów w Pythonie",
   h:'<pre><code>ALLOWED = {\n    ("internet", "dmz"): {80, 443, 25},\n    ("dmz", "lan"): {1433},          # tylko aplikacja do bazy\n    ("lan", "dmz"): {22, 443},\n    ("lan", "internet"): {53, 80, 443},\n}\n\n\ndef is_allowed(src: str, dst: str, port: int) -&gt; bool:\n    return port in ALLOWED.get((src, dst), set())   # domyślna odmowa\n\n\nprint(is_allowed("internet", "dmz", 443))   # True\nprint(is_allowed("internet", "lan", 445))   # False\nprint(is_allowed("dmz", "lan", 3389))       # False</code></pre>'+
   '<p>Zwróć uwagę na <code>ALLOWED.get(..., set())</code>: przepływ, którego nie opisano, jest odrzucany. To implementacja zasady domyślnej odmowy. Taką macierz możesz trzymać jako kod i testować automatycznie przy każdej zmianie reguł.</p>'}
  ],
  quiz:[
  {q:"Gdzie w architekturze strefowej NIE należy umieszczać kontrolera domeny?",o:["W LAN","W screened subnet","W osobnej sieci zarządzania","W chronionym segmencie serwerowym"],a:1,w:"Screened subnet jest wystawiony na ruch z internetu, więc nie umieszcza się w nim najcenniejszych systemów, takich jak kontrolery domeny i bazy danych."},
  {q:"System SCADA zawiera podatne sterowniki PLC, których nie można wymienić ani załatać. Co najlepiej zmniejsza ryzyko?",o:["Monitorowanie wyłącznie przez SIEM","Umieszczenie PLC w osobnym VLAN z ograniczonymi regułami","Wyłączenie wszystkich zabezpieczeń","Podłączenie PLC bezpośrednio do internetu"],a:1,w:"Segmentacja jest zabezpieczeniem kompensacyjnym: izoluje podatne urządzenia i ogranicza, kto i jak może się z nimi komunikować. SIEM tylko obserwuje."},
  {q:"Dział R&D pracuje nad tajnym produktem. Które rozwiązanie daje najwyższą izolację?",o:["VLAN","Air gap","Zapora z regułą allow any","Dodatkowy punkt dostępowy Wi-Fi"],a:1,w:"Air gap oznacza brak połączenia sieciowego z innymi systemami. Dane trafiają tam wyłącznie przez nośniki wymienne, co nadal wymaga kontroli."},
  {q:"Co oznacza zasada Zero Trust?",o:["Wszystkie urządzenia w sieci wewnętrznej są zaufane","Każde żądanie dostępu jest weryfikowane niezależnie od lokalizacji w sieci","Ruch wewnętrzny nie wymaga logowania","VPN daje pełne zaufanie po połączeniu"],a:1,w:"Zero Trust odrzuca zaufanie wynikające z samego położenia w sieci i wymaga ciągłej weryfikacji tożsamości, urządzenia i kontekstu."},
  {q:"Dlaczego monitorowanie ruchu wschód-zachód jest ważne?",o:["Bo dotyczy tylko aktualizacji systemu","Bo atakujący po wejściu do sieci porusza się bocznie między serwerami","Bo ruch północ-południe nie istnieje w centrach danych","Bo jest szyfrowany z definicji"],a:1,w:"Ruch boczny (lateral movement) wewnątrz sieci to typowy etap ataku, a tradycyjne zapory brzegowe go nie widzą."},
  {q:"W chmurze serwery baz danych w podsieci prywatnej muszą pobrać aktualizacje z internetu. Jak to zrobić bezpiecznie?",o:["Przypisać im publiczne adresy IP","Skierować ruch wychodzący przez bramę NAT","Przenieść je do podsieci publicznej","Wyłączyć wszystkie reguły bezpieczeństwa"],a:1,w:"Brama NAT pozwala zasobom z podsieci prywatnej inicjować połączenia wychodzące bez przyjmowania ruchu przychodzącego z internetu."}
  ]
};

LESSONS[8] = {
  lead:"Zapora i sieć bezprzewodowa to dwie bramy do firmy: jedna kontroluje, co przechodzi, druga decyduje, kto w ogóle może dołączyć. Uczysz się pisać reguły, wybierać tryb zabezpieczenia Wi-Fi i rozumieć VPN.",
  goals:["Odróżnić typy zapór (filtrujące, stanowe, proxy, NGFW, UTM, WAF)","Zapisać listę ACL w poprawnej kolejności z domyślną odmową","Dobrać tryb zabezpieczenia Wi-Fi (WPA2/WPA3, Personal/Enterprise)","Opisać tryby IPsec, split tunneling i różnice między VPN site-to-site a zdalnym dostępem"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Reguły zapory, ACL i bezpieczeństwo sieci bezprzewodowej występują w pytaniach scenariuszowych z domen 3 i 4 (m.in. cele 4.1 i 4.5).</div>'+
'<h2>Zapory sieciowe</h2>'+
'<div class="tablewrap"><table><tr><th>Typ</th><th>Jak działa</th><th>Uwagi</th></tr>'+
'<tr><td>Filtrująca pakiety</td><td>Sprawdza nagłówki: adresy IP, porty, protokół</td><td>Szybka, ale bez wiedzy o stanie połączenia</td></tr>'+
'<tr><td>Stanowa (stateful)</td><td>Śledzi połączenia i przepuszcza ruch zwrotny na odpowiedzi do zainicjowanych sesji</td><td>Standard w zaporach brzegowych</td></tr>'+
'<tr><td>Proxy (aplikacyjna)</td><td>Zestawia połączenie w imieniu klienta i inspekcjonuje zawartość (warstwa 5 lub 7)</td><td>Większa kontrola, kosztem wydajności</td></tr>'+
'<tr><td>NGFW</td><td>Rozpoznaje aplikacje, głęboka inspekcja pakietów (DPI), wbudowany IPS, integracja z tożsamością</td><td>Ryzyko uzależnienia od jednego dostawcy</td></tr>'+
'<tr><td>UTM</td><td>Wiele funkcji w jednym urządzeniu: zapora, IPS, antywirus, filtr WWW</td><td>Wygoda i oszczędność, ale pojedynczy punkt awarii</td></tr>'+
'<tr><td>WAF</td><td>Inspekcjonuje ruch HTTP, blokuje SQL injection i XSS</td><td>Inline (blokuje na żywo) lub poza pasmem (tylko wykrywa)</td></tr></table></div>'+
'<p>Zapory dzielimy też na <b>sprzętowe</b> (dedykowane urządzenia chroniące całą sieć lub podsieć) i <b>programowe</b> (na pojedynczej stacji, np. zapora systemowa).</p>'+
'<h2>Listy ACL: jak czytać i pisać reguły</h2>'+
'<p>Reguła ACL składa się z czterech elementów: <b>typ ruchu</b> (protokół, port), <b>źródło</b>, <b>cel</b> i <b>akcja</b> (allow lub deny). Zasady, które musisz znać:</p>'+
'<ul><li>Reguły są przetwarzane <b>od góry do dołu</b>, a <b>pierwsze pasujące wygrywa</b>. Pozostałe nie są już sprawdzane.</li>'+
'<li>Najbardziej szczegółowe reguły idą na górę, ogólne na dół.</li>'+
'<li><b>Implicit deny</b>: nowa zapora lub router blokuje wszystko, dopóki nie dodasz reguł zezwalających. Część urządzeń wymaga jawnej reguły „deny all” na końcu.</li>'+
'<li>Zdarzenia, w tym odmowy, powinny być <b>logowane</b>.</li></ul>'+
'<div class="callout warn"><strong>Wskazówka egzaminacyjna</strong>Gdy zapora „nie działa”, najpierw sprawdź regułę deny, która może być zbyt szeroka lub stoi przed regułą allow, oraz czy porty TCP nie zostały oznaczone jako UDP (i odwrotnie). ACL sieciowe to nie to samo co ACL plików i folderów z lekcji 3.</div>'+
'<h2>NAT i router</h2>'+
'<p><b>NAT</b> tłumaczy prywatne adresy wewnętrzne na publiczny adres zewnętrzny i ukrywa strukturę sieci wewnętrznej przed internetem. NAT nie jest firewallem, ale na egzaminie to on „ukrywa sieć wewnętrzną”. <b>Router</b> łączy sieci i jest domyślną bramą hostów. Gdy nie zna trasy, używa trasy domyślnej <code>0.0.0.0/0</code> (zwykle do operatora).</p>'+
'<h2>Sieci bezprzewodowe</h2>'+
'<div class="tablewrap"><table><tr><th>Standard</th><th>Szyfrowanie / mechanizm</th><th>Ocena</th></tr>'+
'<tr><td>WEP</td><td>RC4, słaby IV</td><td>Złamany, nie używać (najsłabszy)</td></tr>'+
'<tr><td>WPA</td><td>TKIP</td><td>Przestarzały</td></tr>'+
'<tr><td>WPA2</td><td>AES z CCMP, kod integralności MIC. Tryby Personal (PSK) i Enterprise (802.1X)</td><td>Akceptowalny, podatny na ataki słownikowe offline w trybie PSK</td></tr>'+
'<tr><td>WPA3</td><td>AES (GCMP), uzgodnienie SAE zamiast 4-way handshake, Enhanced Open (OWE) dla sieci otwartych, ochrona ramek zarządzania (PMF)</td><td>Zalecany. SAE odpiera ataki słownikowe offline</td></tr></table></div>'+
'<ul><li><b>WPA2/WPA3-Personal</b>: jedno wspólne hasło. Gdy ktoś odchodzi z firmy, hasło trzeba zmienić dla wszystkich.</li>'+
'<li><b>WPA2/WPA3-Enterprise (802.1X)</b>: każdy użytkownik ma własne poświadczenia lub certyfikat, a uwierzytelnianie obsługuje serwer RADIUS. To właściwy wybór dla firm.</li>'+
'<li><b>WPS</b>: konfiguracja PIN-em jest podatna na brute force, więc wyłączamy ją.</li>'+
'<li><b>Ukrycie SSID i filtrowanie MAC</b> to utrudnienia, a nie zabezpieczenia: SSID i adresy MAC widać w eterze i łatwo je podszyć.</li>'+
'<li><b>Sieć gościnna</b> z portalem captive i izolacją od sieci wewnętrznej. IoT też w osobnej sieci.</li>'+
'<li><b>Site survey</b> przed instalacją: zasięg, zakłócenia, kanały. W paśmie 2,4 GHz nienakładające się kanały to 1, 6 i 11.</li>'+
'<li>Wykrywanie <b>rogue AP</b> i evil twin (lekcja 6) przez WIDS.</li></ul>'+
'<h3>AAA i uwierzytelnianie w sieci</h3>'+
'<div class="tablewrap"><table><tr><th>Element</th><th>Rola</th></tr>'+
'<tr><td>RADIUS</td><td>Uwierzytelnianie, autoryzacja i rozliczanie (AAA) dostępu do sieci. UDP 1812/1813</td></tr>'+
'<tr><td>TACACS+</td><td>Rozdziela A-A-A, szyfruje całą sesję, TCP. Częsty do administracji urządzeniami sieciowymi</td></tr>'+
'<tr><td>EAP</td><td>Framework metod uwierzytelniania</td></tr>'+
'<tr><td>PEAP, EAP-TTLS</td><td>EAP w tunelu TLS. Wymagają certyfikatu serwera</td></tr>'+
'<tr><td>EAP-TLS</td><td>Najsilniejszy: wzajemne uwierzytelnianie certyfikatami, certyfikat musi być zainstalowany także na urządzeniu klienta</td></tr></table></div>'+
'<h2>VPN</h2>'+
'<ul><li><b>Remote access VPN</b>: pojedynczy użytkownik łączy się z siecią firmową (koncentrator VPN, MFA obowiązkowe). <b>Site-to-site</b>: stały tunel między oddziałami.</li>'+
'<li><b>IPsec</b> ma dwa tryby: <b>tunelowy</b> (cały oryginalny pakiet jest enkapsulowany i szyfrowany, typowy dla VPN) i <b>transportowy</b> (szyfrowany jest tylko ładunek, nagłówek zostaje, np. komunikacja host-host w sieci wewnętrznej). Komponenty to AH (integralność) i ESP (szyfrowanie i integralność).</li>'+
'<li><b>L2TP/IPsec</b> i <b>SSL/TLS VPN</b> to popularne warianty dla zdalnego dostępu.</li>'+
'<li><b>Split tunneling</b>: tylko ruch do firmy idzie tunelem, reszta wprost do internetu. Wygodne, ale otwiera drogę atakującemu z niezabezpieczonej sesji do zaufanej. <b>Full tunnel</b> kieruje cały ruch przez firmę, co daje kontrolę kosztem wydajności.</li>'+
'<li>Najlepsza praktyka: uwierzytelnianie certyfikatem plus MFA, a uprawnienia VPN ograniczone zgodnie z zasadą need-to-know (nie pełny dostęp do całej sieci).</li></ul>',
  ex:[
  {t:"Przykład 1: kolejność reguł ACL",
   h:'<p>Zapora chroni serwer bazy danych 10.0.9.5 (port 1433). Chcesz, by łączył się z nim tylko dział aplikacji (10.0.1.0/24).</p>'+
   '<div class="tablewrap"><table><tr><th>#</th><th>Akcja</th><th>Źródło</th><th>Cel</th><th>Port</th></tr>'+
   '<tr><td>1</td><td>allow</td><td>10.0.1.0/24</td><td>10.0.9.5</td><td>1433</td></tr>'+
   '<tr><td>2</td><td>deny</td><td>any</td><td>10.0.9.5</td><td>any</td></tr>'+
   '<tr><td>3</td><td>allow</td><td>any</td><td>any</td><td>443</td></tr>'+
   '<tr><td>4</td><td>deny (domyślna)</td><td>any</td><td>any</td><td>any</td></tr></table></div>'+
   '<details><summary>Co się stanie, gdy zamienisz reguły 1 i 2?</summary><p>Reguła „deny any do 10.0.9.5” stanie na górze i zablokuje także dział aplikacji, bo pierwsze pasujące wygrywa, a reguła zezwalająca nigdy nie zostanie sprawdzona. To klasyczny błąd, który na egzaminie nazywa się nieprawidłową kolejnością reguł.</p></details>'},
  {t:"Przykład 2: zapora stanowa z domyślną odmową na Linuksie (iptables)",
   h:'<pre><code># najpierw reguły zezwalające, potem polityka DROP (inaczej odetniesz sobie SSH)\niptables -A INPUT -i lo -j ACCEPT\niptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\niptables -A INPUT -p tcp --dport 22  -s 10.0.0.0/24 -j ACCEPT   # SSH tylko z sieci admin\niptables -A INPUT -p tcp --dport 443 -j ACCEPT                  # HTTPS dla wszystkich\niptables -A INPUT -j LOG --log-prefix "ODRZUCONO: " --log-level 4\niptables -P INPUT DROP                                          # domyślna odmowa\n\niptables -L INPUT -n -v --line-numbers</code></pre>'+
   '<div class="callout warn"><strong>Uwaga</strong>Zmieniając reguły przez SSH, miej drugi dostęp (konsola) i test z automatycznym wycofaniem zmian. Błąd w kolejności może cię odciąć od serwera.</div>'},
  {t:"Przykład 3: symulator ACL w Pythonie",
   h:'<pre><code>import ipaddress\n\nRULES = [\n    ("allow", "10.0.1.0/24", "10.0.9.5/32", 1433),\n    ("deny",  "any",         "10.0.9.5/32", None),\n    ("allow", "any",         "any",         443),\n]\n\n\ndef in_net(ip: str, net: str) -&gt; bool:\n    return net == "any" or ipaddress.ip_address(ip) in ipaddress.ip_network(net)\n\n\ndef decide(src: str, dst: str, port: int) -&gt; str:\n    for action, rsrc, rdst, rport in RULES:          # pierwsze pasujące wygrywa\n        if in_net(src, rsrc) and in_net(dst, rdst) and rport in (None, port):\n            return action\n    return "deny"                                     # implicit deny\n\n\nprint(decide("10.0.1.7", "10.0.9.5", 1433))   # allow\nprint(decide("10.0.2.7", "10.0.9.5", 1433))   # deny\nprint(decide("10.0.2.7", "8.8.8.8", 443))     # allow\nprint(decide("10.0.2.7", "8.8.8.8", 25))      # deny (domyślna)</code></pre>'+
   '<p>Takie testy możesz uruchamiać przy każdej zmianie reguł, żeby upewnić się, że poprawka nie otworzyła niechcianego przepływu.</p>'},
  {t:"Przykład 4: dobór zabezpieczenia Wi-Fi",
   h:'<div class="tablewrap"><table><tr><th>Scenariusz</th><th>Rekomendacja</th><th>Uzasadnienie</th></tr>'+
   '<tr><td>Sieć pracowników w biurze</td><td>WPA3-Enterprise (lub WPA2-Enterprise) z 802.1X, RADIUS i EAP-TLS</td><td>Indywidualne poświadczenia, odwołanie dostępu jednemu użytkownikowi, brak wspólnego hasła</td></tr>'+
   '<tr><td>Goście</td><td>Osobny SSID i VLAN, captive portal, izolacja klientów, dostęp tylko do internetu</td><td>Brak ścieżki do sieci wewnętrznej</td></tr>'+
   '<tr><td>Urządzenia IoT bez 802.1X</td><td>Osobny VLAN, WPA3-Personal lub WPA2 z silnym hasłem, ograniczone ACL</td><td>Ograniczenie skutków przejęcia słabego urządzenia</td></tr>'+
   '<tr><td>Hotel, sieć otwarta</td><td>Nie wykonuj tam operacji wrażliwych bez VPN. Jeśli to Twoja sieć, użyj WPA3 Enhanced Open</td><td>OWE szyfruje ruch każdego klienta osobno</td></tr></table></div>'}
  ],
  quiz:[
  {q:"Świeżo zainstalowana zapora nie ma żadnych reguł zezwalających. Co się stanie z ruchem?",o:["Cały ruch jest przepuszczany","Cały ruch jest blokowany dzięki implicit deny","Przepuszczany jest tylko ruch HTTP","Zapora wyłącza się automatycznie"],a:1,w:"Zapory i routery domyślnie odrzucają ruch, który nie pasuje do żadnej reguły zezwalającej. To zasada implicit deny."},
  {q:"Reguła „allow dział aplikacji do bazy 1433” stoi pod regułą „deny any do bazy”. Dział aplikacji nie może się połączyć. Dlaczego?",o:["Brakuje licencji na zaporę","Reguły są przetwarzane od góry i pierwsza pasująca (deny) wygrywa","Port 1433 jest zarezerwowany dla DNS","Zapora blokuje tylko ruch UDP"],a:1,w:"Kolejność ma znaczenie: pierwsza pasująca reguła jest wykonywana, a pozostałe pomijane. Reguły szczegółowe stawiamy wyżej."},
  {q:"Firma chce blokować ataki SQL injection i XSS na swoim sklepie internetowym. Które rozwiązanie wybierzesz?",o:["Zapora filtrująca pakiety","WAF","Przełącznik zarządzalny","Serwer DHCP"],a:1,w:"WAF inspekcjonuje ruch HTTP na warstwie aplikacji i potrafi blokować typowe ataki webowe. Zapora filtrująca pakiety nie widzi zawartości żądań."},
  {q:"Który element WPA3 chroni hasło sieci przed atakiem słownikowym offline na przechwycone uzgodnienie?",o:["TKIP","SAE (Simultaneous Authentication of Equals)","WPS","Filtrowanie MAC"],a:1,w:"SAE zastępuje 4-way handshake znane z WPA2-PSK i uniemożliwia atakującemu zgadywanie hasła offline na przechwyconym uzgodnieniu."},
  {q:"Chcesz uwierzytelniać urządzenia w Wi-Fi certyfikatami. Co musi znaleźć się na urządzeniu klienta przy EAP-TLS?",o:["Tylko hasło użytkownika","Certyfikat klienta (i klucz prywatny)","Adres MAC serwera RADIUS","Nic, wystarczy nazwa sieci"],a:1,w:"EAP-TLS to wzajemne uwierzytelnianie certyfikatami, więc klient musi mieć własny certyfikat, a serwer swój."},
  {q:"Pracownik łączy się z firmową siecią przez VPN, a potem w drugim oknie przegląda internet bezpośrednio, poza tunelem. Jakie ryzyko to tworzy?",o:["Brak ryzyka","Split tunneling: niezabezpieczona sesja może posłużyć jako droga do sieci firmowej","Przerwanie licencji VPN","Zmiana adresu MAC"],a:1,w:"Przy split tunneling część ruchu omija kontrole firmy. Skompromitowany komputer pracownika staje się mostem do sieci firmowej."}
  ]

LESSONS[9] = {
  lead:"Szyfrowanie w transmisji jest dziś wszędzie, ale tylko wtedy, gdy jest poprawnie skonfigurowane. Ta lekcja pokazuje, co naprawdę dzieje się w TLS i SSH oraz jak nie zepsuć tego w konfiguracji.",
  goals:["Opisać cele TLS i uproszczony przebieg uzgodnienia","Wyjaśnić forward secrecy i walidację certyfikatu","Skonfigurować uwierzytelnianie kluczami w SSH i utwardzić serwer SSH","Zastępować niezaszyfrowane protokoły bezpiecznymi odpowiednikami"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Pytania o TLS, SSH, IPsec i certyfikaty dotyczą domen 1, 3 i 4. Szczegóły kryptografii (szyfry, skróty, PKI) rozwiniemy w lekcjach 13 i 14. Tu skupiamy się na protokołach.</div>'+
'<h2>TLS: co zapewnia</h2>'+
'<p>TLS (następca SSL) chroni dane między dwiema stronami. Zapewnia: <b>poufność</b> (szyfrowanie symetryczne, np. AES-GCM lub ChaCha20), <b>integralność</b> (kody uwierzytelniające wiadomość) i <b>uwierzytelnienie serwera</b> (certyfikat X.509, opcjonalnie też klienta, czyli mTLS). HTTPS to po prostu HTTP przez TLS na porcie 443.</p>'+
'<h3>Uproszczony przebieg (TLS 1.3)</h3>'+
'<pre><code>Klient                                   Serwer\n  | ClientHello (wersje, szyfry, udział klucza) -> |\n  | <- ServerHello + certyfikat + podpis + Finished |\n  | Finished -------------------------------------> |\n  |======= dane szyfrowane kluczem sesji ========== |</code></pre>'+
'<ol><li>Klient proponuje parametry i swoją część wymiany kluczy (ECDHE).</li>'+
'<li>Serwer odsyła certyfikat, który klient <b>weryfikuje</b>: łańcuch do zaufanego CA, zgodność nazwy hosta, ważność, status unieważnienia.</li>'+
'<li>Obie strony wyliczają ten sam klucz sesji. Dalej działa szyfrowanie symetryczne.</li></ol>'+
'<div class="callout"><strong>Forward secrecy</strong>Ponieważ klucze sesji są efemeryczne (ECDHE), przejęcie klucza prywatnego serwera w przyszłości nie pozwoli odszyfrować starego, zapisanego ruchu.</div>'+
'<h3>Wersje i typowe błędy</h3>'+
'<ul><li>SSL 2.0/3.0, TLS 1.0 i 1.1 są przestarzałe i wyłączane. Minimum to TLS 1.2, docelowo TLS 1.3.</li>'+
'<li>Wygasły lub samopodpisany certyfikat (użytkownicy uczą się klikać „ignoruj ostrzeżenie”).</li>'+
'<li>Słabe szyfry i brak forward secrecy, mixed content (zasoby HTTP na stronie HTTPS).</li>'+
'<li>Brak <b>HSTS</b>, czyli nagłówka nakazującego przeglądarce zawsze używać HTTPS dla domeny, co utrudnia ataki typu SSL stripping.</li>'+
'<li>Certyfikaty nieodnawiane automatycznie. Monitoruj daty ważności.</li></ul>'+
'<h2>SSH: bezpieczny zdalny dostęp</h2>'+
'<p>SSH (port 22) szyfruje sesję, uwierzytelnia serwer i klienta oraz umożliwia tunelowanie i przesyłanie plików (SCP, SFTP). Klucz publiczny trafia na serwer do <code>authorized_keys</code>, a prywatny zostaje u administratora i musi być chroniony hasłem (passphrase).</p>'+
'<ul><li><b>Uwierzytelnianie kluczem</b> zamiast hasła chroni przed zgadywaniem haseł.</li>'+
'<li>Przy pierwszym połączeniu <b>zweryfikuj odcisk klucza hosta</b>, bo ślepe zaakceptowanie otwiera drogę atakującemu typu man-in-the-middle. Odcisk zapisuje się w <code>known_hosts</code>, a jego zmiana to ostrzeżenie.</li>'+
'<li>Wyłącz logowanie roota, ogranicz użytkowników, zmień lub ogranicz dostęp do portu na poziomie zapory.</li>'+
'<li>Użyj <b>serwera przesiadkowego</b> (jump host), żeby SSH do wrażliwych segmentów szedł jedną kontrolowaną drogą.</li></ul>'+
'<h2>Inne bezpieczne protokoły</h2>'+
'<div class="tablewrap"><table><tr><th>Protokół</th><th>Zastosowanie</th></tr>'+
'<tr><td>IPsec (ESP/AH)</td><td>VPN, szyfrowanie ruchu na warstwie 3</td></tr>'+
'<tr><td>S/MIME, PGP</td><td>Szyfrowanie i podpisywanie wiadomości e-mail</td></tr>'+
'<tr><td>STARTTLS, SMTPS/IMAPS/POP3S</td><td>Szyfrowanie transportu poczty</td></tr>'+
'<tr><td>DNSSEC</td><td>Podpisy odpowiedzi DNS chroniące integralność (nie szyfrują)</td></tr>'+
'<tr><td>DoT / DoH</td><td>Szyfrowane zapytania DNS (porty 853 / 443)</td></tr>'+
'<tr><td>LDAPS, SNMPv3, SRTP</td><td>Katalog, zarządzanie, głos z szyfrowaniem i uwierzytelnianiem</td></tr>'+
'<tr><td>RDP z NLA, PowerShell Remoting</td><td>Zdalne zarządzanie Windows (tylko przez VPN lub serwer przesiadkowy; PowerShell bywa używany do ruchu bocznego, więc go monitoruj)</td></tr></table></div>'+
'<div class="callout warn"><strong>Pułapka</strong>Szyfrowanie nie chroni przed złośliwą treścią w środku tunelu. Ruch HTTPS z malware też jest szyfrowany, więc bezpieczeństwo wymaga także zabezpieczeń końcówek i, tam gdzie to dopuszczalne prawnie i organizacyjnie, inspekcji TLS.</div>',
  ex:[
  {t:"Przykład 1: sprawdzenie certyfikatu i wersji TLS przez OpenSSL",
   h:'<pre><code># dane certyfikatu: temat, wystawca, daty ważności\necho | openssl s_client -connect example.com:443 -servername example.com 2>/dev/null \\\n  | openssl x509 -noout -subject -issuer -dates\n\n# czy serwer akceptuje stary protokół? (zakończy się błędem, jeśli jest wyłączony)\nopenssl s_client -connect example.com:443 -servername example.com -tls1_1 &lt;/dev/null</code></pre>'+
   '<p>Narzędzie do sprawdzania konfiguracji serwerów to też testssl.sh lub zewnętrzne testy ocenianej konfiguracji. Skanuj tylko własne systemy lub takie, na które masz zgodę.</p>'},
  {t:"Przykład 2: klucze SSH i utwardzenie serwera",
   h:'<pre><code># na stacji administratora: para kluczy (Ed25519; RSA minimum 3072 bity)\nssh-keygen -t ed25519 -C "admin@firma"\n\n# skopiowanie klucza publicznego na serwer\nssh-copy-id uzytkownik@serwer\n\n# weryfikacja odcisku klucza hosta przy pierwszym połączeniu\nssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub   # uruchom na serwerze i porównaj</code></pre>'+
   '<p>Fragment <code>/etc/ssh/sshd_config</code> po utwardzeniu (po zmianie przetestuj w drugiej sesji i dopiero wtedy przeładuj usługę):</p>'+
   '<pre><code>PermitRootLogin no\nPasswordAuthentication no\nPubkeyAuthentication yes\nAllowUsers admin1 admin2\nMaxAuthTries 3\nX11Forwarding no</code></pre>'},
  {t:"Przykład 3: monitoring ważności certyfikatów (Python)",
   h:'<pre><code>import socket\nimport ssl\nimport time\n\n\ndef cert_days_left(host: str, port: int = 443):\n    ctx = ssl.create_default_context()      # weryfikuje łańcuch i nazwę hosta\n    with socket.create_connection((host, port), timeout=5) as sock:\n        with ctx.wrap_socket(sock, server_hostname=host) as tls:\n            cert = tls.getpeercert()\n            version = tls.version()\n    expires = ssl.cert_time_to_seconds(cert["notAfter"])\n    return int((expires - time.time()) // 86400), version\n\n\nfor host in ["intranet.firma.pl", "sklep.firma.pl"]:\n    try:\n        days, ver = cert_days_left(host)\n        status = "UWAGA" if days &lt; 21 else "ok"\n        print(f"{host}: {days} dni, {ver} [{status}]")\n    except ssl.SSLError as e:\n        print(f"{host}: błąd TLS: {e}")</code></pre>'+
   '<p>Domyślny kontekst odrzuci certyfikaty wygasłe, samopodpisane i niezgodne z nazwą hosta, więc skrypt wykryje też te problemy. Uruchamiaj go cyklicznie (np. w n8n) i wysyłaj alert, gdy do wygaśnięcia zostało mniej niż 21 dni.</p>'},
  {t:"Przykład 4: co naprawdę oznacza kłódka w przeglądarce",
   h:'<p>Użytkownik pyta: „strona ma kłódkę, więc jest bezpieczna?”</p>'+
   '<details><summary>Pokaż wyjaśnienie</summary><ul><li>Kłódka znaczy, że połączenie jest szyfrowane i że certyfikat pasuje do nazwy domeny.</li><li>Nie znaczy, że strona jest uczciwa: domena <code>bank-logowanie.example</code> też może mieć ważny certyfikat.</li><li>Atakujący phishingowi rutynowo uzyskują darmowe certyfikaty. Kłódka nie zastępuje sprawdzenia domeny ani szkolenia użytkowników.</li></ul></details>'}
  ],
  quiz:[
  {q:"Co zapewnia efemeryczna wymiana kluczy (np. ECDHE) w TLS?",o:["Szybsze ładowanie stron","Forward secrecy: przejęcie klucza serwera nie odszyfruje starego ruchu","Wyłączenie weryfikacji certyfikatu","Zastąpienie certyfikatów hasłem"],a:1,w:"Przy kluczach efemerycznych każda sesja ma niezależny klucz, więc późniejsze ujawnienie klucza prywatnego serwera nie pozwala odczytać wcześniej zapisanego ruchu."},
  {q:"Które z poniższych nie jest sprawdzane podczas standardowej walidacji certyfikatu serwera przez przeglądarkę?",o:["Zgodność nazwy hosta","Ważność daty","Łańcuch zaufania do CA","Czy właściciel domeny jest uczciwy"],a:3,w:"Certyfikat potwierdza tożsamość domeny i kontrolę nad nią, a nie intencje właściciela. Dlatego strony phishingowe też mogą mieć kłódkę."},
  {q:"Administrator chce, by logowanie SSH odbywało się wyłącznie kluczami. Które ustawienie sshd_config wyłącza hasła?",o:["PermitRootLogin yes","PasswordAuthentication no","X11Forwarding yes","MaxAuthTries 100"],a:1,w:"PasswordAuthentication no wyłącza logowanie hasłem, więc zgadywanie haseł przestaje być możliwe. Klucz prywatny zostaje u administratora."},
  {q:"Przy pierwszym połączeniu SSH pojawia się odcisk klucza hosta do zaakceptowania. Co powinieneś zrobić?",o:["Zawsze wpisać yes","Porównać odcisk z wartością uzyskaną innym zaufanym kanałem","Wyłączyć SSH","Zignorować komunikat"],a:1,w:"Ślepa akceptacja otwiera drogę do ataku man-in-the-middle. Odcisk należy zweryfikować z zaufanego źródła, a potem chroni nas known_hosts."},
