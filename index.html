LESSONS[23] = {
  lead:"Atakujący zaczynają od rozpoznania, więc obrońca powinien wiedzieć o własnej organizacji co najmniej tyle samo. Uczysz się widzieć firmę oczami napastnika (OSINT, skanowanie) i zamieniać wyniki w priorytety napraw.",
  goals:["Odróżnić rozpoznanie pasywne od aktywnego i wskazać źródła OSINT","Użyć Nmap do inwentaryzacji i zinterpretować stany portów","Prowadzić proces zarządzania podatnościami: skan, ocena, priorytety, naprawa, weryfikacja","Priorytetyzować podatności z użyciem CVSS, EPSS i katalogu KEV oraz znać ramy prawne skanowania"],
  intro:
'<div class="callout warn"><strong>Zasada nadrzędna: zgoda i zakres</strong>Skanuj i rozpoznawaj wyłącznie systemy własne lub takie, na które masz <b>pisemną zgodę</b> z określonym zakresem, terminem i regułami (ROE). Działanie poza zakresem lub bez zgody może naruszać przepisy karne (m.in. art. 267 i 269b Kodeksu karnego), umowy z dostawcami i regulaminy chmur. Dane osobowe zebrane w OSINT podlegają RODO. To materiał edukacyjny, a nie porada prawna.</div>'+
'<div class="callout"><strong>Powiązanie z Security+</strong>Domena 4: rozpoznanie pasywne i aktywne, skanowanie podatności (credentialed i non-credentialed, intrusive i non-intrusive), CVE i CVSS, fałszywe wyniki, raporty, zarządzanie podatnościami, ćwiczenia czerwonego i niebieskiego zespołu.</div>'+
'<h2>OSINT: wywiad z otwartych źródeł</h2>'+
'<p>OSINT (Open Source Intelligence) to zbieranie informacji z publicznie dostępnych źródeł. Rozpoznanie <b>pasywne</b> nie wchodzi w interakcję z celem (np. wyszukiwarki, rejestry), a <b>aktywne</b> wysyła ruch do systemów celu (np. skanowanie portów), więc może zostać zauważone i wymaga zgody.</p>'+
'<div class="tablewrap"><table><tr><th>Źródło</th><th>Co ujawnia</th><th>Perspektywa obrońcy</th></tr>'+
'<tr><td>WHOIS i rejestry domen</td><td>Rejestrator, daty, kontakty</td><td>Przejrzyj, kto zarządza domenami i czy kontakt nie ujawnia danych</td></tr>'+
'<tr><td>DNS i certyfikaty (Certificate Transparency, np. crt.sh)</td><td>Subdomeny, środowiska testowe, nazwy wewnętrzne</td><td>Znajdź zapomniane i nieautoryzowane subdomeny</td></tr>'+
'<tr><td>Shodan, Censys</td><td>Usługi wystawione do internetu, wersje, banery</td><td>Sprawdź, co widać z zewnątrz o Twoich adresach IP</td></tr>'+
'<tr><td>Wyszukiwarki (zaawansowane operatory)</td><td>Dokumenty, panele, pliki konfiguracyjne</td><td>Wykryj przypadkowo opublikowane dokumenty</td></tr>'+
'<tr><td>GitHub i repozytoria kodu</td><td>Klucze API, hasła, konfiguracje</td><td>Skanuj repozytoria na sekrety (także pracowników)</td></tr>'+
'<tr><td>Media społecznościowe, LinkedIn</td><td>Struktura firmy, technologie, osoby (cele socjotechniki)</td><td>Oceń, ile informacji ułatwia spear phishing</td></tr>'+
'<tr><td>Bazy wycieków</td><td>Adresy i hasła pracowników z naruszeń</td><td>Monitoruj domenę firmową, wymuś reset i MFA</td></tr>'+
'<tr><td>Archiwa (Wayback Machine)</td><td>Dawne wersje stron</td><td>Zdejmij to, co nie powinno być publiczne</td></tr></table></div>'+
'<p>Narzędzia: theHarvester, Amass, SpiderFoot, Recon-ng, Maltego. W obronie ten sam zestaw stosuje się jako <b>zarządzanie powierzchnią ataku</b> (ASM): ciągłe odkrywanie własnych zasobów widocznych z internetu, także tych, o których IT nie wiedziało (shadow IT), oraz domen łudząco podobnych (typosquatting).</p>'+
'<h2>Skanowanie sieci: Nmap</h2>'+
'<ul><li><b>Wykrywanie hostów</b>: sprawdzenie, które adresy odpowiadają.</li>'+
'<li><b>Skanowanie portów</b>: <code>-sS</code> (SYN, półotwarte, wymaga uprawnień), <code>-sT</code> (pełne połączenie TCP), <code>-sU</code> (UDP, wolne).</li>'+
'<li><b>Wersje usług i system</b>: <code>-sV</code>, <code>-O</code> (tzw. fingerprinting).</li>'+
'<li><b>Skrypty NSE</b>: <code>--script</code> automatyzuje kontrole. Skrypty kategorii intrusive mogą zakłócić pracę systemów.</li>'+
'<li><b>Wynik</b>: <code>-oA nazwa</code> zapisuje wyniki w trzech formatach (tekst, grepowalny, XML).</li></ul>'+
'<div class="tablewrap"><table><tr><th>Stan portu</th><th>Znaczenie</th></tr>'+
'<tr><td>open</td><td>Usługa przyjmuje połączenia</td></tr>'+
'<tr><td>closed</td><td>Port dostępny, ale nic nie nasłuchuje (host odpowiada RST)</td></tr>'+
'<tr><td>filtered</td><td>Brak odpowiedzi: zapora lub filtr blokuje, więc nie wiadomo, czy port jest otwarty</td></tr></table></div>'+
'<p>Skan generuje ruch, który system IDS/IPS i SOC powinny widzieć (lekcje 6 i 10). Ustal okno skanowania, powiadom zespół i dobierz tempo, by nie obciążyć produkcji.</p>'+
'<h2>Skanery podatności</h2>'+
'<p>Skanery (Nessus, OpenVAS/Greenbone, Qualys, Rapid7) porównują wykryte usługi i konfiguracje z bazą znanych podatności. Rodzaje:</p>'+
'<ul><li><b>Credentialed</b> (z poświadczeniami): logują się do hosta, dają dokładne wyniki (łatki, konfiguracje, konta). <b>Non-credentialed</b>: widok z perspektywy atakującego z zewnątrz, mniej szczegółów. Warto robić oba.</li>'+
'<li><b>Intrusive</b> (próbują wykorzystać podatność, ryzyko zakłóceń) i <b>non-intrusive</b> (tylko wykrywają). Intrusive uruchamiaj w środowisku testowym lub w kontrolowanym oknie.</li>'+
'<li><b>Zewnętrzne i wewnętrzne</b>, <b>sieciowe</b> i <b>aplikacyjne</b> (DAST), skany kontenerów i chmury (konfiguracje).</li>'+
'<li>Skaner nie wykryje podatności typu zero-day ani błędów logiki biznesowej. Dla nich potrzebne są testy manualne (lekcja 27).</li></ul>'+
'<h3>Wyniki skanu</h3>'+
'<ul><li><b>True positive</b>: wykryto i faktycznie istnieje. <b>False positive</b>: wykryto, ale podatności nie ma (kosztuje czas). <b>False negative</b>: podatność jest, a skaner jej nie zgłosił (groźniejszy). </li>'+
'<li>Raport zawiera: identyfikator i datę skanu, zakres, wynik per host, <b>CVE</b>, opis, wpływ, <b>CVSS</b>, rekomendację naprawy. Zawsze zweryfikuj istotne ustalenia ręcznie.</li></ul>'+
'<h2>CVE, CVSS, EPSS, KEV: jak oceniać</h2>'+
'<ul><li><b>CVE</b>: unikalny identyfikator publicznie znanej podatności (np. CVE-2021-44228).</li>'+
'<li><b>CVSS</b>: ocena <i>wagi</i> podatności w skali 0,0–10,0. Pasma: 0,1–3,9 niska, 4,0–6,9 średnia, 7,0–8,9 wysoka, 9,0–10,0 krytyczna. CVSS nie uwzględnia Twojego środowiska ani tego, czy ktoś naprawdę wykorzystuje błąd.</li>'+
'<li><b>EPSS</b>: szacowane prawdopodobieństwo, że podatność zostanie wykorzystana w ciągu najbliższych 30 dni.</li>'+
'<li><b>KEV</b> (Known Exploited Vulnerabilities, katalog agencji CISA): lista podatności, o których wiadomo, że są aktywnie wykorzystywane. Obecność w KEV to sygnał do pilnej reakcji.</li></ul>'+
'<div class="callout"><strong>Priorytetyzacja w praktyce</strong>Samo CVSS to za mało. Łącz: ocenę CVSS, EPSS i KEV z <b>krytycznością aktywa</b> i <b>ekspozycją</b> (internet, VPN, LAN). Krytyczna podatność na izolowanym systemie testowym bywa mniej pilna niż „wysoka”, ale aktywnie wykorzystywana, na serwerze dostępnym z internetu.</div>'+
'<h2>Proces zarządzania podatnościami</h2>'+
'<ol><li><b>Identyfikacja</b> aktywów i skanowanie cykliczne.</li><li><b>Ocena</b> i weryfikacja (odrzucenie fałszywych alarmów).</li><li><b>Priorytetyzacja</b> według ryzyka.</li><li><b>Naprawa</b> (łatka, konfiguracja, zabezpieczenie kompensacyjne, wyjątek z akceptacją ryzyka) przez proces zmian.</li><li><b>Weryfikacja</b> ponownym skanem.</li><li><b>Raportowanie</b> i miary.</li></ol>'+
'<p>Przykładowe SLA naprawy: aktywnie wykorzystywane i wystawione do internetu: do 72 godzin lub kilka dni, krytyczne: do 7–14 dni, wysokie: do 30 dni, średnie: 60–90 dni. Dopasuj do ryzyka i możliwości. Miary: pokrycie skanami, liczba otwartych podatności i ich wiek, średni czas naprawy, liczba systemów EOL.</p>'+
'<div class="callout"><strong>Jak liczy to regulator (KNF, DORA)</strong>W ankiecie KRI dla podatności wartością miernika jest liczba podatności pomnożona przez liczbę hostów, na których występują (ZPD.01, 02, 06, 09), więc ekspozycja liczy się podwójnie: ilość i zasięg. Za <b>krytyczną</b> uznaje się podatność o najwyższym poziomie ryzyka według klasyfikacji organizacji, z uwzględnieniem mechanizmów mitygujących (czyli kontekst się liczy). Osobny wskaźnik (ZPD.06) dotyczy krytycznych podatności nieusuniętych po <b>15 dniach</b>. Do liczenia wchodzą także błędy aplikacji bez numeru CVE wykryte w testach bezpieczeństwa, a także krytyczne podatności w <b>bibliotekach stron trzecich</b> (ZPD.11, ZPD.12, z identyfikatorami CVE). Mierzy się też pokrycie skanami (ZPD.03) i liczbę skanów hostów wspierających funkcje krytyczne (ZPD.10). Instrukcja dla miernika BEZ.14 zaznacza ponadto, że <b>skanowanie podatności nie jest pełnym testem bezpieczeństwa</b> nowego systemu, co dobrze podsumowuje różnicę między tą lekcją a lekcją 27.</div>'+
'<h2>Zespoły i ćwiczenia</h2>'+
'<p><b>Czerwony zespół</b> symuluje atakującego, <b>niebieski</b> broni i wykrywa, <b>fioletowy</b> łączy oba i uczy się razem (wspólna poprawa wykrywania), <b>biały</b> ustala reguły i nadzoruje ćwiczenie. Skanowanie to element zarządzania podatnościami, a nie pełny test penetracyjny (lekcja 27).</p>',
  ex:[
  {t:"Przykład 1: Nmap w laboratorium",
   h:'<pre><code># 1) wykrycie żywych hostów w sieci laboratoryjnej (bez skanowania portów)\nnmap -sn 10.0.1.0/24\n\n# 2) skan SYN najczęstszych portów z wykrywaniem wersji, wynik do plików\nsudo nmap -sS -sV --top-ports 100 -oA wynik_serwery 10.0.1.10 10.0.1.20\n\n# 3) pełny zakres portów jednego hosta (wolniej)\nsudo nmap -sS -p- -T3 -oA wynik_pelny 10.0.1.10\n\n# 4) kilka najczęstszych portów UDP\nsudo nmap -sU --top-ports 20 10.0.1.10</code></pre>'+
   '<p>Fragment przykładowego wyniku i jak go czytać:</p>'+
   '<pre><code>PORT     STATE    SERVICE  VERSION\n22/tcp   open     ssh      OpenSSH 9.2\n80/tcp   open     http     nginx 1.22\n445/tcp  filtered microsoft-ds\n3389/tcp closed   ms-wbt-server</code></pre>'+
   '<ul><li>22 i 80 są otwarte. Czy powinny być? Porównaj z konfiguracją bazową (lekcja 4) i regułami zapory (lekcja 8).</li><li>445 jest filtrowany: coś blokuje, co jest dobre, ale sprawdź, czy usługa i tak nie nasłuchuje wewnątrz.</li><li>3389 zamknięty: nic nie nasłuchuje.</li></ul>'+
   '<div class="callout">Nmap project udostępnia host <code>scanme.nmap.org</code> do testów z umiarem. Poza tym skanuj tylko własne zasoby lub z pisemną zgodą. Unikaj agresywnych ustawień czasowych (np. -T5) na produkcji.</div>'},
  {t:"Przykład 2: porównanie wyniku Nmap z listą dozwolonych portów (Python)",
   h:'<pre><code>import xml.etree.ElementTree as ET\n\nDOZWOLONE = {\n    "10.0.1.10": {22, 443},\n    "10.0.1.20": {443},\n}\n\nroot = ET.parse("wynik_serwery.xml").getroot()\nfor host in root.findall("host"):\n    addr = host.find("address").get("addr")\n    for port in host.findall("ports/port"):\n        if port.find("state").get("state") != "open":\n            continue\n        numer = int(port.get("portid"))\n        svc = port.find("service")\n        nazwa = svc.get("name") if svc is not None else "?"\n        if numer not in DOZWOLONE.get(addr, set()):\n            print(f"NIEOCZEKIWANY: {addr}:{numer} ({nazwa})")</code></pre>'+
   '<p>Wynik „nieoczekiwany port” to alert o odchyleniu od bazy: albo pojawiła się nowa usługa (może nieautoryzowana), albo zmieniła się konfiguracja bez aktualizacji dokumentacji. Skrypt możesz uruchamiać w harmonogramie i wysyłać alert (np. w n8n).</p>'},
  {t:"Przykład 3: priorytetyzacja podatności z CVSS, EPSS, KEV i kontekstem (Python)",
   h:'<pre><code>def priorytet(cvss: float, epss: float, kev: bool, krytycznosc: int, internet: bool) -&gt; int:\n    """Punkty 0-114. Wagi przykładowe: skalibruj do swojego środowiska."""\n    pkt = cvss * 4 + epss * 30 + (25 if kev else 0) + krytycznosc * 3 + (10 if internet else 0)\n    return round(pkt)\n\n\nVULNS = [\n    ("CVE-A, VPN brzegowy",   9.8, 0.92, True,  3, True),\n    ("CVE-B, serwer plików",  8.1, 0.04, False, 3, False),\n    ("CVE-C, drukarka biura", 9.1, 0.01, False, 1, False),\n]\n\nfor nazwa, cvss, epss, kev, kryt, net in sorted(\n        VULNS, key=lambda v: priorytet(*v[1:]), reverse=True):\n    p = priorytet(cvss, epss, kev, kryt, net)\n    sla = "pilne (kilka dni)" if p &gt;= 90 else "30 dni" if p &gt;= 60 else "plan"\n    print(f"{p:3d}  {sla:18s} {nazwa}")</code></pre>'+
   '<p>Wynik pokazuje, że krytyczna ocena CVSS drukarki (9,1) bywa mniej pilna niż aktywnie wykorzystywana podatność w VPN brzegowym. W praktyce dane EPSS i KEV pobierasz z oficjalnych źródeł (API EPSS, katalog CISA), a skaner łączysz z CMDB, żeby znać krytyczność aktywów.</p>'},
  {t:"Przykład 4: kontrola własnej powierzchni ataku przez Certificate Transparency (Python)",
   h:'<p>Publiczne rejestry certyfikatów ujawniają nazwy, dla których wystawiono certyfikaty. Dla <b>własnej</b> domeny to szybki sposób znalezienia zapomnianych subdomen.</p>'+
   '<pre><code>import json\nimport urllib.request\n\n\ndef subdomeny(domena: str):\n    url = f"https://crt.sh/?q=%25.{domena}&amp;output=json"\n    with urllib.request.urlopen(url, timeout=30) as r:\n        dane = json.load(r)\n    nazwy = set()\n    for rekord in dane:\n        for n in rekord["name_value"].split("\\n"):\n            nazwy.add(n.strip().lower().lstrip("*."))\n    return sorted(nazwy)\n\n\nfor nazwa in subdomeny("twoja-domena.pl"):      # użyj własnej domeny\n    print(nazwa)</code></pre>'+
   '<p>Porównaj listę z inwentarzem aktywów. Każda subdomena, której nikt nie zna, to kandydat do wyjaśnienia lub wyłączenia (ryzyko przejęcia subdomeny, zapomniane środowiska testowe).</p>'},
  {t:"Przykład 5: Greenbone/OpenVAS i skan z poświadczeniami (opis przebiegu)",
   h:'<p>OpenVAS (Greenbone Community Edition) to otwartoźródłowy skaner z bazą testów aktualizowaną w kanałach publikowanych przez Greenbone. Sposób instalacji (zwykle kontenery) zmienia się między wersjami, więc postępuj według bieżącej dokumentacji projektu.</p>'+
   '<ol><li>Zdefiniuj <b>cele</b> (adresy lub zakresy) i uzyskaj zgodę oraz okno czasowe.</li><li>Utwórz <b>poświadczenia</b> (konto o ograniczonych uprawnieniach tylko do odczytu, np. SSH lub konto domenowe do skanowania) i przypisz je do celu.</li><li>Wybierz profil skanu (np. pełny, ale bez testów niszczących) i uruchom zadanie, najpierw na grupie testowej.</li><li>Przejrzyj raport: CVE, CVSS, hosty. Odrzuć fałszywe alarmy po weryfikacji.</li><li>Przekaż ustalenia właścicielom z priorytetami i terminami, a po naprawie wykonaj <b>skan weryfikacyjny</b>.</li></ol>'+
   '<div class="callout warn"><strong>Konto skanujące</strong>Konto z poświadczeniami skanera jest cennym celem, więc chroń je jak konto uprzywilejowane: unikalne hasło lub klucz, ograniczenie źródłowego adresu, monitoring użycia.</div>'},
  {t:"Ćwiczenie: który wynik naprawiasz pierwszy?",
   h:'<p>Skan wewnętrzny i zewnętrzny zwrócił pięć ustaleń: (1) krytyczna podatność w oprogramowaniu VPN dostępnym z internetu, figuruje w KEV, (2) wysoka podatność w serwerze ERP w sieci wewnętrznej, EPSS niski, (3) krytyczna podatność w oprogramowaniu starej drukarki w segmencie biurowym, (4) średnia podatność: słaby szyfr TLS na serwerze WWW, (5) zgłoszony przez skaner błąd w serwisie, który po sprawdzeniu nie istnieje. Ułóż kolejność działań i wskaż, co jest czym w ujęciu wyników skanu.</p>'+
   '<details><summary>Pokaż rozwiązanie</summary><ul><li><b>Najpierw (1)</b>: aktywnie wykorzystywana, wystawiona do internetu, na kluczowym wejściu. Łatka lub zabezpieczenie natychmiast, a przy braku łatki ograniczenie dostępu i zwiększony monitoring. Sprawdź też, czy nie doszło już do włamania.</li><li><b>Dalej (2)</b>: serwer o dużej krytyczności, ale EPSS niski i dostęp wewnętrzny. Naprawa w terminie SLA dla wysokich.</li><li><b>(4)</b> w standardowym terminie (utwardzenie TLS).</li><li><b>(3)</b>: oceń izolację segmentu, kompensacyjnie zablokuj dostęp, zaplanuj wymianę lub aktualizację.</li><li><b>(5)</b> to fałszywy alarm (false positive): udokumentuj i wyłącz regułę dla tego hosta, a nie ignoruj całej kategorii.</li></ul></details>'}
  ],
  quiz:[
  {q:"Które działanie jest rozpoznaniem pasywnym?",o:["Skanowanie portów hosta celu","Sprawdzenie certyfikatów celu w publicznym rejestrze Certificate Transparency","Próba logowania do serwera SSH","Wysłanie pakietów SYN do celu"],a:1,w:"Pasywne rozpoznanie wykorzystuje publiczne źródła i nie wchodzi w interakcję z systemami celu. Skanowanie i próby połączeń to rozpoznanie aktywne."},
  {q:"Nmap zwraca dla portu stan „filtered”. Co to oznacza?",o:["Port jest otwarty i szyfrowany","Zapora lub filtr uniemożliwia ustalenie, czy port jest otwarty","Port jest zamknięty i host odpowiada RST","Usługa jest uszkodzona"],a:1,w:"Stan filtered oznacza brak odpowiedzi (lub odpowiedź blokującą), więc skaner nie może stwierdzić, czy port jest otwarty."},
  {q:"Jaka jest główna zaleta skanu z poświadczeniami (credentialed)?",o:["Jest szybszy","Daje dokładniejsze wyniki o łatkach, konfiguracji i kontach wewnątrz hosta","Nie wymaga zgody","Nie generuje ruchu"],a:1,w:"Skan z poświadczeniami loguje się do hosta i sprawdza stan od środka, dlatego zwykle ma mniej fałszywych alarmów i więcej szczegółów."},
  {q:"Skaner nie zgłosił podatności, która faktycznie istnieje w systemie. Jak nazywa się taki wynik?",o:["True positive","False positive","False negative","True negative"],a:2,w:"To false negative: podatność istnieje, a skaner jej nie wykrył. Jest groźniejszy niż fałszywy alarm, bo daje fałszywe poczucie bezpieczeństwa."},
  {q:"Podatność ma CVSS 9,1, ale dotyczy izolowanej drukarki, bez znanych wykorzystań. Druga ma CVSS 8,0, jest w katalogu KEV i dotyczy VPN dostępnego z internetu. Którą naprawisz w pierwszej kolejności?",o:["Pierwszą, bo CVSS jest wyższe","Drugą, bo jest aktywnie wykorzystywana i wystawiona na zewnątrz","Obie równocześnie bez analizy","Żadnej"],a:1,w:"Priorytet zależy od ryzyka, a nie tylko od oceny wagi. Aktywne wykorzystanie i ekspozycja do internetu podnoszą pilność."},
  {q:"Co jest warunkiem legalnego i bezpiecznego skanowania cudzych systemów w ramach audytu?",o:["Dobre narzędzie","Pisemna zgoda ze wskazanym zakresem, terminem i regułami (ROE)","Ukrycie adresu IP","Skanowanie nocą"],a:1,w:"Bez pisemnej zgody i jasnego zakresu skanowanie może naruszać prawo i umowy. ROE określają, co wolno, kiedy i jak."}
  ]
};

LESSONS[24] = {
  lead:"Incydentu nie da się wykluczyć, ale da się sprawić, że będzie krótki, kontrolowany i dobrze udokumentowany. Ta lekcja układa cały cykl: od przygotowania i wykrycia, przez powstrzymanie i zabezpieczenie dowodów, po komunikację i wnioski.",
  goals:["Opisać cykl reagowania na incydenty (NIST i model siedmiu faz Security+)","Zaklasyfikować incydent, przypisać role i uruchomić odpowiedni playbook","Zabezpieczać dowody zgodnie z kolejnością ulotności i łańcuchem dowodowym","Mierzyć skuteczność IR (MTTD, MTTA, MTTR) i prowadzić ćwiczenia"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Cele 4.8 (działania w odpowiedzi na incydent) i 4.9 (źródła danych do śledztwa): proces IR, analiza przyczyn źródłowych, ćwiczenia (tabletop, symulacje), threat hunting oraz procedury forensyczne.</div>'+
'<h2>Zdarzenie, incydent, incydent poważny</h2>'+
'<ul><li><b>Zdarzenie</b>: każde odnotowane zjawisko, np. logowanie czy alert.</li>'+
'<li><b>Incydent</b>: zdarzenie lub seria powiązanych zdarzeń naruszających politykę bezpieczeństwa lub bezpieczeństwo informacji. W DORA incydent związany z ICT to nieplanowane zdarzenie lub seria zdarzeń, które naruszają bezpieczeństwo sieci i systemów oraz negatywnie wpływają na dostępność, autentyczność, integralność lub poufność danych albo na świadczone usługi.</li>'+
'<li><b>Incydent poważny</b>: przekracza progi z przepisów (KSC, DORA) lub z Twojej klasyfikacji i uruchamia zgłoszenia do organów (lekcje 18 i 19).</li></ul>'+
'<h2>Cykl reagowania na incydenty</h2>'+
'<p>NIST opisywał klasycznie cztery fazy (przygotowanie, wykrycie i analiza, powstrzymanie, usunięcie i odtworzenie, działania po incydencie). Security+ rozbija je na siedem. Nowsza wersja NIST SP 800-61 (rev. 3, 2025) osadza reagowanie w funkcjach CSF 2.0, czyli w całym programie ryzyka, a nie tylko w osobnym procesie. Sprawdź aktualną wersję dokumentu.</p>'+
'<div class="tablewrap"><table><tr><th>Faza</th><th>Cel</th><th>Typowe działania</th></tr>'+
'<tr><td><b>1. Przygotowanie</b></td><td>Być gotowym, zanim coś się stanie</td><td>Plan IR i playbooki, role, kontakty, narzędzia, logowanie, kopie, szkolenia, retainer (forensyka, prawnik), ćwiczenia</td></tr>'+
'<tr><td><b>2. Wykrycie</b></td><td>Ustalić, że doszło do incydentu</td><td>Alerty SIEM/EDR, zgłoszenia użytkowników, informacje zewnętrzne, triage</td></tr>'+
'<tr><td><b>3. Analiza</b></td><td>Zrozumieć zakres i skutek</td><td>Klasyfikacja, ustalenie systemów i danych, oś czasu, powiadomienie interesariuszy</td></tr>'+
'<tr><td><b>4. Powstrzymanie</b></td><td>Ograniczyć rozprzestrzenianie</td><td>Izolacja hostów i segmentów, blokada kont i adresów, zachowanie dowodów</td></tr>'+
'<tr><td><b>5. Usunięcie przyczyny</b></td><td>Wyeliminować źródło</td><td>Usunięcie malware i mechanizmów utrwalenia, łatki, reset poświadczeń, ponowne budowanie systemów</td></tr>'+
'<tr><td><b>6. Odtworzenie</b></td><td>Wrócić do pracy w bezpiecznym stanie</td><td>Odtwarzanie z czystych kopii wg priorytetów BIA, monitoring wzmożony</td></tr>'+
'<tr><td><b>7. Wnioski</b></td><td>Nie powtórzyć błędu</td><td>Analiza przyczyn źródłowych (RCA), raport poincydentalny, aktualizacja ryzyk, polityk i detekcji</td></tr></table></div>'+
'<div class="callout"><strong>Kolejność ma znaczenie</strong>Na egzaminie i w praktyce: najpierw powstrzymaj (np. odłącz zainfekowany kontroler domeny od sieci), potem usuń przyczynę, a na końcu odtwórz. Odtwarzanie przed usunięciem przyczyny zwykle oznacza powtórne zainfekowanie.</div>'+
'<h2>Zespół i role</h2>'+
'<div class="tablewrap"><table><tr><th>Rola</th><th>Zadanie</th></tr>'+
'<tr><td>Kierownik incydentu (incident commander)</td><td>Koordynuje, decyduje o priorytetach, pilnuje czasu i zegarów zgłoszeń</td></tr>'+
'<tr><td>Analitycy SOC (poziomy 1–3), analitycy IR</td><td>Triage, analiza, detekcja, powstrzymywanie</td></tr>'+
'<tr><td>Forensyka</td><td>Zabezpieczanie i analiza dowodów (często zewnętrzny partner na retainer, pod NDA)</td></tr>'+
'<tr><td>IT i właściciele systemów</td><td>Wykonują izolację, odtwarzanie, zmiany</td></tr>'+
'<tr><td>Prawnik, IOD</td><td>Obowiązki zgłoszeniowe, ocena naruszenia danych, komunikaty</td></tr>'+
'<tr><td>Komunikacja i zarząd</td><td>Komunikaty do pracowników, klientów, mediów, decyzje biznesowe (np. o okupie)</td></tr>'+
'<tr><td>HR</td><td>Przy incydentach z udziałem pracowników (insider)</td></tr></table></div>'+
'<h2>Klasyfikacja incydentów</h2>'+
'<ul><li><b>Poziomy ważności</b> (np. SEV1–SEV4): kryteria to wpływ na usługi i procesy krytyczne, dane osobowe lub poufne, liczba systemów, skutki prawne i finansowe, widoczność publiczna.</li>'+
'<li><b>Kryteria z DORA</b> (RTS 2024/1772) dla poważnych incydentów ICT: liczba dotkniętych klientów, czas trwania, zasięg geograficzny, utrata danych, krytyczność usług i skutki gospodarcze. Konkretne progi sprawdzaj w rozporządzeniu.</li>'+
'<li><b>Kategorie rodzajowe</b> (ankieta KRI KNF, lekcja 22): złośliwe oprogramowanie, włamanie do środowiska ICT, niedostępność (w tym DoS i awarie), naruszenie bezpieczeństwa treści informacji (poufność i integralność). Każdy incydent liczy się w <b>jednej</b> kategorii, co ułatwia statystyki i trendy.</li></ul>'+
'<h2>Powstrzymywanie, usuwanie, odtwarzanie</h2>'+
'<ul><li><b>Powstrzymanie krótkoterminowe</b>: izolacja hosta (EDR, VLAN, odłączenie od sieci), wyłączenie kont, blokada adresów i domen. Zwykle <b>nie wyłączaj zasilania</b> bez decyzji, bo tracisz dane z pamięci. Przy szybkim ransomware izolacja sieciowa bywa pilniejsza niż zabezpieczanie pamięci.</li>'+
'<li><b>Powstrzymanie długoterminowe</b>: tymczasowe poprawki, dodatkowa segmentacja, wzmożony monitoring, aby systemy mogły działać do czasu naprawy.</li>'+
'<li><b>Usunięcie przyczyny</b>: usunięcie malware i trwałych mechanizmów (zadania harmonogramu, konta, klucze), łatanie luki wejścia, reset poświadczeń (w AD także konta usługowe i krbtgt), reimaging zamiast czyszczenia.</li>'+
'<li><b>Odtworzenie</b>: z czystych kopii, w odizolowanym środowisku, w kolejności z BIA, z weryfikacją integralności i obserwacją nawrotów.</li></ul>'+
'<h2>Forensyka: dowody i łańcuch dowodowy</h2>'+
'<ul><li><b>Kolejność ulotności</b> (order of volatility): zbieraj najpierw to, co znika najszybciej: rejestry i pamięć podręczna procesora, pamięć RAM, stan sieci i procesów, dysk, logi zdalne i monitoring, konfiguracja i topologia, kopie archiwalne.</li>'+
'<li><b>Obraz dysku</b> (bit po bicie) i analiza na kopii, nigdy na oryginale. Użyj blokady zapisu. Pracując na oryginale zmieniasz znaczniki czasu i niszczysz ślady.</li>'+
'<li><b>Skróty (SHA-256)</b> oryginału i kopii dowodzą, że kopia jest identyczna.</li>'+
'<li><b>Łańcuch dowodowy</b> (chain of custody): dokumentujesz, kto, kiedy i po co miał dowód w rękach, jak jest przechowywany i kto go przekazał. Brak ciągłości osłabia wartość dowodową.</li>'+
'<li>Logi powinny być <b>niezmienne i kopiowane centralnie</b> (lekcja 10). Zachowaj też metadane (nagłówki e-mail, znaczniki plików). Rozważ <i>legal hold</i>, czyli wstrzymanie usuwania danych objętych sprawą.</li></ul>'+
'<h2>Komunikacja</h2>'+
'<ul><li>Zasada: <b>kto wie, co wie i kiedy</b> ustala prawnik razem z komunikacją i zarządem. Dla mediów i klientów przygotuj komunikat zatwierdzony przez dział prawny (holding statement).</li>'+
'<li>Gdy poczta lub komunikatory firmowe mogą być skompromitowane, używaj <b>kanału awaryjnego</b> (telefony, osobne narzędzie) i drukowanej listy kontaktów.</li>'+
'<li>Zegary zgłoszeń (KSC, RODO, DORA) i obowiązki wobec klientów, ubezpieczyciela oraz organów ścigania zestawiasz w jednym miejscu (lekcja 19).</li></ul>'+
'<h2>Playbooki i ćwiczenia</h2>'+
'<ul><li><b>Playbook</b> opisuje dla typowego scenariusza (ransomware, przejęcie konta, BEC, wyciek danych, DDoS, insider, awaria dostawcy) kroki, decyzje, role i komunikaty. Aktualizuj go po każdym incydencie i nowych informacjach o zagrożeniach.</li>'+
'<li><b>Ćwiczenia</b>: tabletop (dyskusja nad scenariuszem), symulacje, drille i ćwiczenia na żywo. Wykonuj co najmniej raz w roku i po istotnych zmianach. Sprawdzaj nie tylko technikę, ale i decyzje oraz komunikację.</li>'+
'<li><b>Wskaźniki</b>: MTTD (średni czas od początku do wykrycia), MTTA (od wykrycia do potwierdzenia), MTTR (od wykrycia do zamknięcia), czas przebywania atakującego (dwell time), odsetek incydentów z kompletną oś czasu.</li></ul>'+
'<h2>Po incydencie</h2>'+
'<p><b>Analiza przyczyn źródłowych (RCA)</b>: zdefiniuj zakres, ustal związki przyczynowe, wskaż skuteczne rozwiązanie, wdroż i śledź. <b>Raport poincydentalny</b> (after-action report) bez szukania winnych: co się stało, co zadziałało, co nie, co zmieniamy, kto i do kiedy. Wyniki wracają do rejestru ryzyk, polityk, szkoleń i reguł detekcji.</p>',
  ex:[
  {t:"Przykład 1: ćwiczenie decyzyjne, ransomware w piątek wieczorem",
   h:'<p>Przeczytaj kolejne wątki scenariusza i zdecyduj, zanim otworzysz odpowiedź.</p>'+
   '<div class="tablewrap"><table><tr><th>Czas</th><th>Wątek</th><th>Pytanie do zespołu</th></tr>'+
   '<tr><td>21:10</td><td>EDR zgłasza masowe szyfrowanie plików na serwerze plików i dwóch stacjach działu finansów.</td><td>Jaki poziom ważności i kto jest kierownikiem incydentu?</td></tr>'+
   '<tr><td>21:25</td><td>Okazuje się, że serwer kopii zapasowych jest w tej samej domenie i konto administratora kopii używano kilka godzin wcześniej z nietypowego adresu.</td><td>Jak chronisz kopie i konta?</td></tr>'+
   '<tr><td>22:00</td><td>Komunikat o okupie zawiera groźbę publikacji danych klientów.</td><td>Jakie zegary zgłoszeń uruchamiasz i kogo zawiadamiasz?</td></tr>'+
   '<tr><td>23:30</td><td>Dyrektor sprzedaży prosi o przywrócenie sklepu na jutro rano.</td><td>Jak decydujesz o kolejności odtwarzania i kto zatwierdza?</td></tr>'+
   '<tr><td>Sobota 08:00</td><td>Dziennikarz pyta o wyciek.</td><td>Kto odpowiada i na jakiej podstawie?</td></tr></table></div>'+
   '<details><summary>Pokaż rekomendowane odpowiedzi</summary><ul><li><b>21:10</b>: SEV1 (wpływ na procesy krytyczne, ryzyko danych osobowych). Uruchom playbook, wyznacz kierownika, otwórz oś czasu i dziennik decyzji.</li><li><b>21:25</b>: odizoluj serwer kopii i zablokuj konta administracyjne, zabezpiecz migawki i kopie offline. Załóż, że przejęto kontroler domeny, więc plan dotyczy też resetu poświadczeń.</li><li><b>22:00</b>: zegary KSC (wczesne ostrzeżenie do 24 h, jeśli podmiot podlega), RODO (72 h od stwierdzenia naruszenia), ewentualnie DORA i zawiadomienie organów ścigania. Zaangażuj prawnika, IOD, ubezpieczyciela. Decyzję o kontakcie ze sprawcami i okupie podejmuje zarząd po opinii prawnej.</li><li><b>23:30</b>: kolejność wg BIA (RTO), odtwarzanie z czystych kopii do odizolowanego środowiska. Decyzję o uruchomieniu zatwierdza kierownik incydentu razem z właścicielem procesu. Nie uruchamiaj sklepu bez usunięcia przyczyny.</li><li><b>Sobota</b>: wypowiada się tylko wyznaczona osoba, wg komunikatu zatwierdzonego przez prawnika. Bez spekulacji.</li></ul></details>'},
  {t:"Przykład 2: playbook DDoS",
   h:'<div class="tablewrap"><table><tr><th>Etap</th><th>Działania</th></tr>'+
   '<tr><td>Wykrycie</td><td>Alert o nietypowym ruchu i opóźnieniach, potwierdzenie na łączu, w CDN i w logach (lekcja 6: SYN flood, amplifikacja, atak aplikacyjny)</td></tr>'+
   '<tr><td>Klasyfikacja</td><td>Wolumetryczny, protokołowy czy aplikacyjny? Jakie usługi biznesowe są dotknięte? Czy to zasłona dla innego ataku?</td></tr>'+
   '<tr><td>Powstrzymanie</td><td>Kontakt z operatorem i dostawcą ochrony DDoS (scrubbing), przekierowanie ruchu, ograniczanie zapytań (rate limiting), reguły WAF, ostrożne blokowanie według kraju lub sieci, wyłączenie kosztownych funkcji</td></tr>'+
   '<tr><td>Komunikacja</td><td>Status dla klientów i zarządu, kanały awaryjne, informacja dla obsługi klienta</td></tr>'+
   '<tr><td>Odtworzenie i wnioski</td><td>Stopniowe zdejmowanie ograniczeń, przegląd architektury (CDN, anycast, pojemność), aktualizacja umowy z operatorem i testy</td></tr></table></div>'},
  {t:"Przykład 3: zabezpieczenie danych ulotnych i obrazu dysku (laboratorium Linux)",
   h:'<pre><code># nośnik na dowody zamontowany w /mnt/dowody (nie zapisuj na badany dysk!)\ndate -u | tee /mnt/dowody/00_kontekst.txt; hostname; uname -a\n\n# dane ulotne, od najbardziej ulotnych\nss -tupan        &gt; /mnt/dowody/01_polaczenia.txt\nps auxwwf        &gt; /mnt/dowody/02_procesy.txt\nlsof -nP         &gt; /mnt/dowody/03_otwarte_pliki.txt\nip addr; ip route; arp -an &gt; /mnt/dowody/04_siec.txt\nwho -a; last -a | head -50 &gt; /mnt/dowody/05_sesje.txt\n\n# skróty zebranych dowodów\nsha256sum /mnt/dowody/* &gt; /mnt/dowody/SHA256SUMS\n\n# obraz dysku (najlepiej z blokadą zapisu); skrót do dokumentacji\nsudo dd if=/dev/sdb of=/mnt/dowody/dysk.img bs=4M conv=noerror,sync status=progress\nsha256sum /mnt/dowody/dysk.img</code></pre>'+
   '<ul><li>Używaj zaufanych narzędzi z osobnego nośnika, bo na skompromitowanym hoście polecenia mogły zostać podmienione.</li><li>Zapisz, kto wykonał czynności, kiedy i na jakim sprzęcie. To początek łańcucha dowodowego.</li><li>Pamięć RAM zbiera się dedykowanymi narzędziami (np. AVML, LiME), a analizuje m.in. Volatility. W incydencie realnym zlecaj to doświadczonym specjalistom.</li></ul>'},
  {t:"Przykład 4: wskaźniki MTTD, MTTA, MTTR w Pythonie",
   h:'<pre><code>from datetime import datetime\nfrom statistics import mean\n\n\ndef t(s):\n    return datetime.fromisoformat(s)\n\n\nINC = [\n    {"id": "INC-101", "poczatek": t("2026-09-02T01:10"), "wykryto": t("2026-09-02T09:40"),\n     "potwierdzono": t("2026-09-02T09:55"), "zamknieto": t("2026-09-03T16:00")},\n    {"id": "INC-102", "poczatek": t("2026-09-10T22:00"), "wykryto": t("2026-09-10T22:30"),\n     "potwierdzono": t("2026-09-10T22:40"), "zamknieto": t("2026-09-11T02:30")},\n    {"id": "INC-103", "poczatek": t("2026-09-20T08:00"), "wykryto": t("2026-09-20T12:00"),\n     "potwierdzono": t("2026-09-20T12:30"), "zamknieto": t("2026-09-20T20:00")},\n]\n\n\ndef godz(a, b):\n    return (b - a).total_seconds() / 3600\n\n\nmttd = mean(godz(i["poczatek"], i["wykryto"]) for i in INC)\nmtta = mean(godz(i["wykryto"], i["potwierdzono"]) for i in INC)\nmttr = mean(godz(i["wykryto"], i["zamknieto"]) for i in INC)\nprint(f"MTTD {mttd:.1f} h | MTTA {mtta:.1f} h | MTTR {mttr:.1f} h")</code></pre>'+
   '<p>Zwróć uwagę, że MTTD wymaga ustalenia rzeczywistego początku incydentu, co bywa możliwe dopiero po analizie. Śledź trendy, a nie pojedyncze wartości, i nie porównuj incydentów o zupełnie różnej skali bez ważenia.</p>'},
  {t:"Przykład 5: szkielet raportu poincydentalnego",
   h:'<div class="tablewrap"><table><tr><th>Sekcja</th><th>Zawartość</th></tr>'+
   '<tr><td>Podsumowanie</td><td>Co się stało, kiedy, jaki skutek, aktualny status (2–3 zdania dla zarządu)</td></tr>'+
   '<tr><td>Oś czasu</td><td>Początek, wykrycie, kluczowe decyzje i działania z godzinami (UTC lub czas lokalny, spójnie)</td></tr>'+
   '<tr><td>Zakres i skutki</td><td>Systemy, dane, liczba osób, przestój, straty finansowe, wpływ na klientów</td></tr>'+
   '<tr><td>Przyczyna źródłowa</td><td>Wektor wejścia, podatność lub błąd, dlaczego nie wykryliśmy wcześniej</td></tr>'+
   '<tr><td>Co zadziałało, co nie</td><td>Bez szukania winnych: procesy, narzędzia, komunikacja</td></tr>'+
   '<tr><td>Zgłoszenia i komunikacja</td><td>CSIRT, UODO, KNF, klienci, ubezpieczyciel, daty i treść</td></tr>'+
   '<tr><td>Działania naprawcze</td><td>Zadanie, właściciel, termin, sposób weryfikacji, wpływ na ryzyka</td></tr></table></div>'}
  ],
  quiz:[
  {q:"Kontroler domeny jest zainfekowany. Jakie działanie wykonasz pierwsze?",o:["Odtworzenie z kopii","Powstrzymanie: odłączenie od sieci i zabezpieczenie dowodów","Wnioski i raport","Zakup nowego serwera"],a:1,w:"Kolejność to powstrzymanie, usunięcie przyczyny, odtworzenie i wnioski. Odtwarzanie bez wcześniejszego powstrzymania i usunięcia przyczyny grozi powtórnym zakażeniem."},
  {q:"Który element dowodu należy zebrać jako pierwszy według kolejności ulotności?",o:["Obraz dysku","Zawartość pamięci RAM i stan połączeń","Kopie archiwalne","Dokumentacja topologii"],a:1,w:"Dane najbardziej ulotne (rejestry, pamięć, stan sieci i procesów) znikają po restarcie lub wyłączeniu, dlatego zbiera się je przed dyskiem i archiwami."},
  {q:"Po co prowadzi się łańcuch dowodowy (chain of custody)?",o:["Aby przyspieszyć odtwarzanie","Aby udokumentować, kto, kiedy i po co miał dowód, i wykazać brak nieuprawnionych zmian","Aby zmniejszyć koszty","Aby zaszyfrować dowody"],a:1,w:"Ciągłość udokumentowanej opieki nad dowodem jest warunkiem jego wiarygodności w postępowaniach i przy sporach."},
  {q:"Które działanie najlepiej opisuje fazę „wnioski po incydencie”?",o:["Odłączenie hosta od sieci","Analiza przyczyn źródłowych i aktualizacja polityk, ryzyk i detekcji","Skanowanie portów","Wymiana wszystkich haseł bez analizy"],a:1,w:"Ostatnia faza zamienia incydent w naukę: RCA, raport poincydentalny, plan działań i zmiany w programie bezpieczeństwa."},
  {q:"Zespół obserwuje, że średni czas od początku incydentu do jego wykrycia rośnie. Który wskaźnik to opisuje?",o:["MTTR","MTTD","RPO","SLA"],a:1,w:"MTTD (mean time to detect) to średni czas od początku incydentu do jego wykrycia. MTTR dotyczy czasu reakcji lub zamknięcia."},
  {q:"W incydencie serwer poczty może być skompromitowany. Jak zespół powinien komunikować się o bieżących działaniach?",o:["Wyłącznie przez firmową pocztę","Przez kanał awaryjny poza potencjalnie skompromitowaną infrastrukturą (telefony, osobne narzędzie, lista kontaktów)","Publicznie w mediach społecznościowych","Nie komunikować się do końca incydentu"],a:1,w:"Atakujący może czytać wiadomości. Komunikacja kryzysowa powinna używać niezależnych kanałów i wcześniej przygotowanych kontaktów."}
  ]
};

LESSONS[25] = {
  lead:"Zaawansowana obrona to nie jedno urządzenie, lecz zestaw uzupełniających się technik: wykrywanie na końcówkach, korelacja zdarzeń, wywiad o zagrożeniach, polowanie na zagrożenia, pułapki i ochrona poczty. Uczysz się, co każda z nich robi i gdzie zawodzi.",
  goals:["Rozróżnić AV, EDR, XDR, MDR, NDR, SIEM i SOAR oraz wskazać ich zastosowania","Zaprojektować prostą detekcję (reguła Sigma, korelacja) i ocenić jej jakość","Zastosować threat intelligence i threat hunting w praktyce","Skonfigurować SPF, DKIM i DMARC oraz wdrożyć pułapki (honeypot, honeytoken)"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Cele 4.4 i 4.5 (monitoring, alerty, narzędzia: EDR, XDR, SIEM, SOAR, UEBA, DLP) oraz 4.9. Pojawiają się także threat intelligence i polowanie na zagrożenia.</div>'+
'<h2>Ochrona końcówek: od antywirusa do XDR</h2>'+
'<div class="tablewrap"><table><tr><th>Rozwiązanie</th><th>Co robi</th><th>Uwagi</th></tr>'+
'<tr><td>Antywirus (AV)</td><td>Wykrywa znane złośliwe pliki sygnaturami i heurystyką</td><td>Słaby wobec nowych i bezplikowych ataków</td></tr>'+
'<tr><td><b>EDR</b></td><td>Stale zbiera telemetrię z końcówki (procesy, pliki, sieć, rejestr), wykrywa zachowania, pozwala izolować host i badać incydent</td><td>Wymaga ludzi do obsługi alertów</td></tr>'+
'<tr><td><b>XDR</b></td><td>Łączy dane z wielu domen: końcówki, e-mail, tożsamość, chmura, sieć</td><td>Korelacja między domenami, ale często zależność od jednego dostawcy</td></tr>'+
'<tr><td><b>MDR</b></td><td>Usługa zarządzana: zewnętrzny zespół monitoruje i reaguje</td><td>Ważne SLA, zakres uprawnień, odpowiedzialność</td></tr>'+
'<tr><td><b>NDR</b></td><td>Wykrywa zagrożenia w ruchu sieciowym (anomalie, ruch boczny)</td><td>Uzupełnienie EDR, szczególnie dla urządzeń bez agenta</td></tr>'+
'<tr><td>Listy dozwolonych aplikacji, ASR, zapora hosta</td><td>Ograniczają, co może się uruchomić</td><td>Skuteczne, ale wymagają utrzymania (lekcja 4)</td></tr></table></div>'+
'<h2>SIEM, SOAR, UEBA: korelacja i automatyzacja</h2>'+
'<ul><li><b>SIEM</b> (lekcja 10) łączy logi i koreluje zdarzenia. Jakość zależy od źródeł, parsowania, czasu (NTP) i reguł.</li>'+
'<li><b>SOAR</b> orkiestruje i automatyzuje reakcje: wzbogacanie alertów o dane (reputacja IP, właściciel aktywa), zakładanie zgłoszeń, izolacja hosta, blokada adresu. Automatyzuj najpierw działania bezpieczne i odwracalne, a destrukcyjne (usunięcie, wyłączenie produkcji) zostaw człowiekowi.</li>'+
'<li><b>UEBA</b> uczy się zwykłego zachowania użytkowników i urządzeń i zgłasza odchylenia (np. logowania w nietypowych godzinach, masowe pobieranie danych). Wymaga dostrojenia, bo generuje fałszywe alarmy.</li></ul>'+
'<h2>Inżynieria detekcji</h2>'+
'<ol><li><b>Hipoteza</b>: jaką technikę ataku chcemy wykryć (np. technika z ATT&amp;CK)?</li><li><b>Dane</b>: czy mamy odpowiednie logi?</li><li><b>Reguła</b>: zapis w formacie przenośnym (Sigma) lub języku platformy.</li><li><b>Test</b>: czy reguła wykrywa symulację (np. test w laboratorium, zespół fioletowy)?</li><li><b>Dostrojenie</b>: ograniczenie fałszywych alarmów, wyjątki z uzasadnieniem.</li><li><b>Dokumentacja i przegląd</b>: właściciel, powiązanie z ATT&amp;CK, procedura reakcji.</li></ol>'+
'<p>Mierz pokrycie ATT&amp;CK dla najważniejszych technik dla Twojego sektora, odsetek fałszywych alarmów i czas triage, a nie samą liczbę reguł. Zestaw zawsze zawiera luki, więc je świadomie opisz.</p>'+
'<h2>Threat intelligence i polowanie na zagrożenia</h2>'+
'<ul><li><b>IOC</b> (wskaźniki kompromitacji: adresy, domeny, skróty plików) szybko się starzeją. <b>TTP</b> (taktyki, techniki, procedury) są trwalsze i trudniejsze do zmiany przez atakującego. Dlatego wykrywanie zachowań jest cenniejsze niż same listy adresów.</li>'+
'<li>Źródła: CSIRT-y i ISAC-i, dostawcy komercyjni, OSINT, wymiana informacji w zaufanych społecznościach (w finansach także formularz SPR-PF-22), własne incydenty. Formaty wymiany: STIX/TAXII. Oznaczenia poufności: TLP (np. TLP:CLEAR, TLP:GREEN).</li>'+
'<li><b>Threat hunting</b> to aktywne, oparte na hipotezie poszukiwanie zagrożeń, które ominęły automatyczne detekcje (np. „atakujący używa legalnych narzędzi administracyjnych do ruchu bocznego”). Efektem są nowe detekcje, poprawki konfiguracji i wnioski dla architektury.</li></ul>'+
'<h2>Pułapki (deception)</h2>'+
'<ul><li><b>Honeypot</b>: system-przynęta bez rzeczywistej funkcji biznesowej. Każde połączenie jest podejrzane, więc daje alert o niskim poziomie fałszywych alarmów. <b>Honeynet</b>: sieć przynęt. <b>Honeyfile</b> i <b>honeytoken</b>: fałszywe pliki lub poświadczenia, których użycie sygnalizuje włamanie.</li>'+
'<li>Zasady: izolacja od produkcji, przejrzysta rola (źródło alertów, nie „odpowiedź atakiem”), zgodność z prawem i umowami, integracja z SIEM, monitorowanie samej pułapki.</li></ul>'+
'<h2>Ochrona poczty i phishingu</h2>'+
'<div class="tablewrap"><table><tr><th>Mechanizm</th><th>Funkcja</th></tr>'+
'<tr><td>SPF</td><td>Lista serwerów uprawnionych do wysyłania poczty dla domeny</td></tr>'+
'<tr><td>DKIM</td><td>Podpis kryptograficzny wiadomości weryfikowany kluczem publicznym z DNS</td></tr>'+
'<tr><td>DMARC</td><td>Polityka dla wiadomości niespełniających SPF/DKIM i zgodności nadawcy: <i>none</i> (tylko raporty), <i>quarantine</i>, <i>reject</i>, oraz raporty zbiorcze</td></tr>'+
'<tr><td>Brama pocztowa, sandbox, przepisywanie linków</td><td>Analiza załączników i adresów URL, blokada złośliwych treści</td></tr>'+
'<tr><td>Oznaczanie poczty zewnętrznej, przycisk „Zgłoś phishing”</td><td>Wsparcie użytkowników i szybki obieg zgłoszeń</td></tr>'+
'<tr><td>MFA odporne na phishing (FIDO2)</td><td>Neutralizuje kradzież haseł (lekcja 12)</td></tr></table></div>'+
'<h2>Inne warstwy</h2>'+
'<ul><li><b>DLP</b>: zapobieganie wyciekom z poczty, urządzeń, chmury i sieci (lekcja 15).</li><li><b>CASB</b> i kontrola usług chmurowych, <b>ZTNA</b> (dostęp do aplikacji według tożsamości i stanu urządzenia), filtrowanie DNS i WWW.</li></ul>'+
'<h2>AI w SOC: korzyści i ryzyka</h2>'+
'<ul><li>Pomaga w streszczaniu alertów, wstępnym triage, tworzeniu zapytań i opisów incydentów, tłumaczeniu raportów na język biznesu.</li>'+
'<li>Ryzyka: błędne wnioski i zmyślenia, <b>prompt injection</b> w danych analizowanych przez model (treść maila, logu, strony), wyciek danych wrażliwych do zewnętrznego narzędzia, nadmierna autonomia.</li>'+
'<li>Zasady: człowiek decyduje o działaniach nieodwracalnych, model ma najmniejsze uprawnienia, dane są zanonimizowane lub przetwarzane w zatwierdzonym środowisku, jakość ocenia się na danych historycznych, a wszystkie wywołania są logowane (lekcje 17 i 20).</li></ul>',
  ex:[
  {t:"Przykład 1: SPF, DKIM i DMARC w DNS",
   h:'<pre><code>; SPF: kto może wysyłać pocztę dla domeny\nfirma.pl.                 IN TXT "v=spf1 include:_spf.dostawca-poczty.example -all"\n\n; DKIM: klucz publiczny do weryfikacji podpisu (selektor s1)\ns1._domainkey.firma.pl.   IN TXT "v=DKIM1; k=rsa; p=MIIBIjANBgkq...(skrócone)"\n\n; DMARC: polityka i adres raportów zbiorczych\n_dmarc.firma.pl.          IN TXT "v=DMARC1; p=quarantine; rua=mailto:dmarc@firma.pl; adkim=s; aspf=s; pct=100"</code></pre>'+
   '<p>Wdrożenie krokami: najpierw <code>p=none</code> i analiza raportów (które systemy wysyłają pocztę w imieniu domeny), potem <code>quarantine</code>, a docelowo <code>reject</code>. Zmieniaj po uporządkowaniu wszystkich legalnych nadawców (systemy marketingowe, CRM, drukarki).</p>'+
   '<pre><code># pip install dnspython; sprawdzenie własnej domeny\nimport dns.resolver\n\n\ndef txt(nazwa):\n    try:\n        return [r.to_text() for r in dns.resolver.resolve(nazwa, "TXT")]\n    except Exception:\n        return []\n\n\ndomena = "twoja-domena.pl"\nprint("SPF  :", [x for x in txt(domena) if "v=spf1" in x])\nprint("DMARC:", txt("_dmarc." + domena))</code></pre>'},
  {t:"Przykład 2: reguła detekcji w formacie Sigma",
   h:'<pre><code>title: Podejrzane uruchomienie PowerShell z zakodowanym poleceniem\nstatus: experimental\ndescription: Wykrywa uruchomienie PowerShell z parametrem poleceń zakodowanych w Base64\nlogsource:\n  category: process_creation\n  product: windows\ndetection:\n  selection:\n    Image|endswith: powershell.exe\n    CommandLine|contains:\n      - -enc\n      - -EncodedCommand\n  condition: selection\nfalsepositives:\n  - Narzędzia administracyjne i skrypty wdrożeniowe\nlevel: medium\ntags:\n  - attack.execution\n  - attack.t1059.001</code></pre>'+
   '<p>Reguła jest przenośna: konwertery (np. sigma-cli) tłumaczą ją na zapytania Splunk, Elastic, Sentinel i inne. Zwróć uwagę na <code>falsepositives</code> i <code>tags</code>: dobra detekcja ma udokumentowane wyjątki i powiązanie z techniką ATT&amp;CK.</p>'},
  {t:"Przykład 3: korelacja „niemożliwa podróż” (Python)",
   h:'<pre><code>from datetime import datetime, timedelta\n\nLOGOWANIA = [\n    ("jkowalski", "2026-10-08T08:02", "PL"),\n    ("jkowalski", "2026-10-08T08:40", "BR"),\n    ("anowak",    "2026-10-08T09:00", "PL"),\n]\n\n\ndef niemozliwa_podroz(logowania, okno=timedelta(hours=2)):\n    ostatnie = {}\n    for user, ts, kraj in sorted(logowania, key=lambda x: x[1]):\n        t = datetime.fromisoformat(ts)\n        if user in ostatnie:\n            t0, k0 = ostatnie[user]\n            if kraj != k0 and t - t0 &lt; okno:\n                yield user, k0, kraj, t - t0\n        ostatnie[user] = (t, kraj)\n\n\nfor user, k0, k1, dt in niemozliwa_podroz(LOGOWANIA):\n    print(f"ALERT: {user}: {k0} potem {k1} po {dt}")</code></pre>'+
   '<p>Prosta reguła daje fałszywe alarmy przy VPN i serwerach proxy, więc w produkcji uwzględnia się adresy zaufane, znane lokalizacje urządzeń i ocenę ryzyka sesji.</p>'},
  {t:"Przykład 4: polowanie na beaconing (Python)",
   h:'<p>Hipoteza: zainfekowany host kontaktuje się z serwerem C2 w regularnych odstępach.</p>'+
   '<pre><code>from statistics import mean, pstdev\n\n# czasy połączeń (sekundy) z jednego hosta do jednego adresu zewnętrznego\nPOLACZENIA = [0, 60, 121, 180, 240, 301, 360, 421, 480]\n\n\ndef beaconing(czasy, max_cv=0.1, min_polaczen=6):\n    if len(czasy) &lt; min_polaczen:\n        return False\n    odstepy = [b - a for a, b in zip(czasy, czasy[1:])]\n    cv = pstdev(odstepy) / mean(odstepy)       # współczynnik zmienności odstępów\n    return cv &lt; max_cv\n\n\nprint(beaconing(POLACZENIA))     # True</code></pre>'+
   '<p>Atakujący stosują „jitter” (losowe opóźnienia), więc próg trzeba kalibrować i łączyć z innymi cechami: mała ilość danych, rzadko odwiedzana domena, młody wiek domeny, nietypowy proces. Wynik polowania ma zakończyć się detekcją lub poprawką, a nie tylko notatką.</p>'},
  {t:"Przykład 5: prosty honeypot w laboratorium (Python)",
   h:'<pre><code>import socket\nfrom datetime import datetime, timezone\n\nPORT = 2222      # nieużywany port, w odizolowanym segmencie laboratoryjnym\n\nwith socket.socket(socket.AF_INET, socket.SOCK_STREAM) as srv:\n    srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    srv.bind(("0.0.0.0", PORT))\n    srv.listen(5)\n    while True:\n        conn, (ip, port) = srv.accept()\n        with conn:\n            conn.settimeout(3)\n            try:\n                dane = conn.recv(128)\n            except OSError:\n                dane = b""\n            ts = datetime.now(timezone.utc).isoformat(timespec="seconds")\n            print(f"{ts} ALERT połączenie z {ip}:{port}, bajty: {dane[:32]!r}")</code></pre>'+
   '<div class="callout warn"><strong>Zasady użycia</strong>Uruchamiaj tylko w odizolowanym laboratorium lub w segmencie z jasną zgodą właściciela sieci. Nie wystawiaj do internetu, nie podejmuj działań odwetowych. W produkcji alert z pułapki wysyłaj do SIEM i traktuj jako sygnał wysokiego zaufania: nikt legalny nie ma powodu łączyć się z takim portem.</div>'}
  ],

  {q:"Dlaczego wykrywanie oparte na TTP jest trwalsze niż oparte wyłącznie na IOC?",o:["Bo adresy IP nigdy się nie zmieniają","Bo techniki działania są trudniejsze do zmiany dla atakującego niż adresy, domeny czy skróty plików","Bo TTP są zawsze płatne","Bo IOC są nielegalne"],a:1,w:"Atakujący łatwo zmieniają infrastrukturę (IOC), ale zachowania i narzędzia zmieniają znacznie trudniej."},

LESSONS[26] = {
  lead:"Bezpieczeństwo oprogramowania buduje się przez cały cykl wytwarzania, a nie na końcu. Uczysz się praktyk kodowania, narzędzi automatycznych kontroli w pipeline oraz zabezpieczania samego łańcucha dostarczania oprogramowania.",
  goals:["Opisać bezpieczny cykl życia oprogramowania (SDLC) i zasadę „shift left”","Dobrać narzędzia SAST, DAST, SCA, skanowanie sekretów, IaC i kontenerów","Zabezpieczyć pipeline CI/CD, sekrety i łańcuch dostaw (SBOM, podpisy)","Stosować wzorce bezpiecznego kodu w Pythonie"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Domeny 2 i 4: SDLC, testowanie (SAST, DAST, fuzzing, SCA), zarządzanie zmianą, ochrona sekretów, bezpieczeństwo środowisk (staging, produkcja), kontenery i IaC.</div>'+
'<h2>Bezpieczny cykl życia oprogramowania</h2>'+
'<div class="tablewrap"><table><tr><th>Etap</th><th>Praktyki bezpieczeństwa</th></tr>'+
'<tr><td>Wymagania i projekt</td><td>Wymagania bezpieczeństwa, klasyfikacja danych, modelowanie zagrożeń (lekcja 21), wzorce bezpiecznego projektowania (A06)</td></tr>'+
'<tr><td>Kodowanie</td><td>Standardy kodowania, bezpieczne biblioteki, przegląd kodu, IDE z analizą, brak sekretów w repozytorium</td></tr>'+
'<tr><td>Budowanie i testy</td><td>SAST, SCA, skanowanie sekretów, testy jednostkowe i regresji, testy bezpieczeństwa, DAST na stagingu, fuzzing</td></tr>'+
'<tr><td>Wydanie</td><td>Zatwierdzenie zmiany, podpisane artefakty, SBOM, rozdział środowisk i obowiązków</td></tr>'+
'<tr><td>Eksploatacja</td><td>Monitoring, zarządzanie podatnościami, obsługa zgłoszeń, plan wycofania</td></tr></table></div>'+
'<p><b>Shift left</b> oznacza przesuwanie testów bezpieczeństwa jak najbliżej momentu napisania kodu, bo wczesna poprawka kosztuje najmniej. <b>DevSecOps</b> dodaje do tego automatyzację i wspólną odpowiedzialność deweloperów, operacji i bezpieczeństwa. Skuteczny model to „sprawdzone ścieżki” (golden paths) i <b>security champions</b> w zespołach, a nie jeden dział blokujący wydania.</p>'+
'<h2>Rodzaje testów bezpieczeństwa aplikacji</h2>'+
'<div class="tablewrap"><table><tr><th>Technika</th><th>Co bada</th><th>Mocne i słabe strony</th></tr>'+
'<tr><td><b>SAST</b> (statyczna)</td><td>Kod źródłowy bez uruchamiania</td><td>Wcześnie, wskazuje linię kodu. Daje fałszywe alarmy, nie widzi błędów środowiska</td></tr>'+
'<tr><td><b>DAST</b> (dynamiczna)</td><td>Uruchomioną aplikację z zewnątrz</td><td>Widzi realne zachowanie i konfigurację. Później w cyklu, słabsze pokrycie</td></tr>'+
'<tr><td><b>IAST</b></td><td>Aplikację od środka podczas testów</td><td>Precyzyjniejsza, wymaga instrumentacji</td></tr>'+
'<tr><td><b>SCA</b></td><td>Zależności i biblioteki (znane podatności, licencje)</td><td>Kluczowe dla A03 (łańcuch dostaw)</td></tr>'+
'<tr><td>Skanowanie sekretów</td><td>Klucze, hasła, tokeny w kodzie i historii</td><td>Szybkie i wysokiego zysku</td></tr>'+
'<tr><td>IaC i kontenery</td><td>Szablony Terraform/Kubernetes, obrazy Docker</td><td>Konfiguracje i podatności w obrazach</td></tr>'+
'<tr><td><b>Fuzzing</b></td><td>Losowe i zniekształcone dane na wejściu</td><td>Znajduje awarie i nieoczekiwane stany</td></tr>'+
'<tr><td>Testy regresji i bezpieczeństwa zmian</td><td>Czy zmiana nie zepsuła istniejących funkcji i czy została sprawdzona pod kątem bezpieczeństwa</td><td>Ankieta KRI KNF liczy zmiany objęte takimi testami (ROZ.06, ROZ.07)</td></tr></table></div>'+
'<h2>Bezpieczeństwo pipeline CI/CD i łańcucha dostaw</h2>'+
'<ul><li><b>Pipeline to cel</b>: kto zmienia pipeline, może wprowadzić kod do produkcji (A03 i A08). Chroń repozytorium (obowiązkowe przeglądy, ochrona gałęzi), konta (MFA), runnery (izolowane, bez trwałych sekretów).</li>'+
'<li><b>Najmniejsze uprawnienia</b> dla zadań pipeline (np. tokeny tylko do odczytu, krótkotrwałe poświadczenia OIDC zamiast stałych kluczy).</li>'+
'<li><b>Zależności</b>: przypinanie wersji i skrótów, własne lustro repozytoriów, automatyczne aktualizacje z przeglądem, ochrona przed atakami typu dependency confusion i typosquatting.</li>'+
'<li><b>SBOM</b> (CycloneDX, SPDX) to inwentarz składników. Pozwala szybko odpowiedzieć na pytanie „czy używamy podatnej biblioteki”, jak w przypadku Log4Shell.</li>'+
'<li><b>Podpisywanie i pochodzenie artefaktów</b> (np. Sigstore, ramy SLSA): można zweryfikować, że wdrażany obraz pochodzi z zaufanego pipeline.</li>'+
'<li><b>Środowiska</b>: rozdział deweloperskiego, testowego (staging) i produkcyjnego, dane produkcyjne nie trafiają do testów bez maskowania, zmiany awaryjne mają szybką ścieżkę, ale z późniejszą kontrolą.</li></ul>'+
'<h2>Sekrety</h2>'+
'<p>Hasła, klucze API i certyfikaty trzymaj w menedżerze sekretów (np. Vault lub usługa chmurowa), nie w kodzie, plikach konfiguracyjnych w repozytorium ani w zmiennych w obrazach. Skanuj historię repozytoriów, bo sekret skasowany z bieżącego kodu pozostaje w historii. Znaleziony sekret należy <b>unieważnić i wymienić</b>, a nie tylko usunąć z repozytorium.</p>'+
'<h2>Przegląd kodu i zasady kodowania</h2>'+
'<ul><li>Przegląd przez drugą osobę dla zmian krytycznych (zasada czterech oczu), lista kontrolna: walidacja danych, kontrola dostępu, obsługa błędów, logowanie bez danych wrażliwych, sekrety, zależności.</li>'+
'<li>Unikaj funkcji niebezpiecznych, używaj bezpiecznych bibliotek kryptograficznych (lekcja 13) i nie wymyślaj własnych.</li>'+
'<li><b>Dead code</b> i nieużywane zależności usuwaj, bo zwiększają powierzchnię ataku.</li>'+
'<li>Pamiętaj o <b>oprogramowaniu użytkowników końcowych</b> (arkusze i bazy w Excelu lub Accessie): w sektorze finansowym ankieta KRI KNF pyta o ich rejestr (EUT.01), bo „kod” powstaje też poza działem IT.</li></ul>',
  ex:[
  {t:"Przykład 1: pipeline z kontrolami bezpieczeństwa (GitHub Actions)",
   h:'<pre><code>name: security-checks\non: [pull_request]\npermissions:\n  contents: read            # najmniejsze uprawnienia dla tokenu pipeline\njobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@&lt;PELNY_SHA_COMMITU&gt;   # przypnij do SHA, nie do ruchomego taga\n        with:\n          fetch-depth: 0\n      - name: Sekrety w kodzie i historii\n        run: gitleaks detect --source . --no-banner\n      - name: SAST\n        run: semgrep scan --config auto --error\n      - name: SCA (zależności Pythona)\n        run: pip-audit -r requirements.txt\n      - name: Obraz kontenera\n        run: |\n          docker build -t app:ci .\n          trivy image --exit-code 1 --severity HIGH,CRITICAL app:ci</code></pre>'+
   '<p>Narzędzia przed uruchomieniem instaluj z przypiętych, zweryfikowanych źródeł (pominąłem tu kroki instalacji). Zadania uruchamiaj na każdym żądaniu scalenia i blokuj scalenie przy wynikach krytycznych. Zacznij od trybu raportowania, a potem zaostrzaj progi, żeby nie zablokować zespołów lawiną starych ustaleń.</p>'},
  {t:"Przykład 2: wzorce bezpiecznego kodu w Pythonie",
   h:'<pre><code>import hmac\nimport json\nimport os\nimport secrets\nimport subprocess\nfrom pathlib import Path\n\nimport yaml   # pip install pyyaml\n\n# 1) sekret z menedżera sekretów lub środowiska, nigdy z kodu\nAPI_KEY = os.environ["API_KEY"]\n\n# 2) losowość kryptograficzna do tokenów\ntoken = secrets.token_urlsafe(32)\n\n# 3) polecenia systemowe bez powłoki i bez sklejania tekstu\nsubprocess.run(["tar", "-tf", nazwa_archiwum], check=True, shell=False)\n\n# 4) ochrona przed wyjściem poza katalog (path traversal)\nBAZA = Path("/srv/uploady").resolve()\n\n\ndef bezpieczna_sciezka(nazwa: str) -&gt; Path:\n    p = (BAZA / nazwa).resolve()\n    if BAZA not in p.parents:\n        raise ValueError("niedozwolona ścieżka")\n    return p\n\n\n# 5) deserializacja: dane z zewnątrz tylko przez JSON lub safe_load, nigdy pickle\ndane = json.loads(tekst)\nkonfiguracja = yaml.safe_load(tekst_yaml)\n\n# 6) porównanie sekretów w stałym czasie\nprawidlowy = hmac.compare_digest(podany_token, oczekiwany_token)</code></pre>'+
   '<ul><li>Zapytania do bazy zawsze parametryzowane (lekcja 20).</li><li>Błędy: nie ujawniaj użytkownikowi stosu wywołań, zapisuj szczegóły w logach, system przy awarii ma odmawiać dostępu (fail closed).</li><li>Logi bez haseł, tokenów i pełnych danych osobowych.</li></ul>'},
  {t:"Przykład 3: utwardzony obraz kontenera i kontrola przed zatwierdzeniem",
   h:'<pre><code># Dockerfile\nFROM python:3.12-slim@sha256:&lt;SKROT_OBRAZU&gt;   # przypięcie do skrótu\nRUN useradd -r -u 10001 app                    # proces nie działa jako root\nWORKDIR /app\nCOPY --chown=app requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY --chown=app . .\nUSER app\nCMD ["python", "-m", "aplikacja"]</code></pre>'+
   '<pre><code># .pre-commit-config.yaml: lokalna kontrola przed zatwierdzeniem zmian\nrepos:\n  - repo: https://github.com/gitleaks/gitleaks\n    rev: &lt;TAG_WERSJI&gt;\n    hooks:\n      - id: gitleaks</code></pre>'+
   '<p>Kontrola przed zatwierdzeniem (pre-commit) zatrzymuje sekrety, zanim trafią do wspólnego repozytorium. To tańsze niż usuwanie ich z historii i unieważnianie kluczy.</p>'},
  {t:"Przykład 4: SBOM i skan zależności",
   h:'<pre><code># przykładowe narzędzia (wersje i polecenia sprawdź w dokumentacji)\nsyft dir:. -o cyclonedx-json &gt; sbom.json       # inwentarz składników\ngrype sbom:sbom.json --fail-on high             # znane podatności w składnikach\npip-audit -r requirements.txt                   # zależności Pythona\nnpm audit --audit-level=high                    # zależności Node.js</code></pre>'+
   '<p>Gdy ogłoszona zostanie nowa krytyczna podatność w popularnej bibliotece, SBOM pozwala w kilka minut ustalić, które aplikacje jej używają, a skan zależności wskazuje wersje do aktualizacji.</p>'},
  {t:"Ćwiczenie: lista kontrolna przeglądu zmiany",
   h:'<p>Dostajesz zmianę dodającą endpoint do pobierania faktur. Jakie pytania zadasz w przeglądzie?</p>'+

LESSONS[27] = {
  lead:"Test penetracyjny to kontrolowany, autoryzowany atak na własne zabezpieczenia, który odpowiada na pytanie: co naprawdę uda się atakującemu? Uczysz się, jak się go planuje, jakie ma fazy i granice oraz jak czytać raport, żeby z niego korzystać.",
  goals:["Odróżnić skan podatności, test penetracyjny, red teaming i TLPT","Zaplanować test: zakres, zasady (ROE), zgody i ograniczenia prawne","Opisać fazy testu i dobre praktyki raportowania","Włączyć wyniki testów do zarządzania ryzykiem i podatnościami"],
  intro:
'<div class="callout warn"><strong>Etyka i prawo przed technikami</strong>Test penetracyjny wolno wykonywać wyłącznie na podstawie <b>pisemnej zgody właściciela systemu</b> i uzgodnionego zakresu. Działanie bez zgody lub poza zakresem może wypełniać znamiona przestępstw (m.in. art. 267, 268a i 269b Kodeksu karnego) i naruszać umowy (np. z dostawcą chmury). Ta lekcja nie zawiera instrukcji ataków: pokazuje, jak zlecać, nadzorować i rozumieć testy. To materiał edukacyjny, nie porada prawna.</div>'+
'<div class="callout"><strong>Powiązanie z Security+</strong>Domena 4: testy penetracyjne (rodzaje, zasady zaangażowania, rozpoznanie pasywne i aktywne, eskalacja, ruch boczny, utrzymanie dostępu, sprzątanie), zespoły ćwiczeń oraz porównanie ze skanowaniem podatności.</div>'+
'<h2>Skan, test, red teaming: czym się różnią</h2>'+
'<div class="tablewrap"><table><tr><th></th><th>Skan podatności</th><th>Test penetracyjny</th><th>Red teaming</th><th>TLPT (DORA)</th></tr>'+
'<tr><td>Cel</td><td>Znaleźć znane podatności szeroko</td><td>Sprawdzić, czy da się je wykorzystać i do czego prowadzą</td><td>Przetestować ludzi, procesy i detekcję w scenariuszu atakującego</td><td>Test odporności oparty na wywiadzie o zagrożeniach w sektorze finansowym</td></tr>'+
'<tr><td>Metoda</td><td>Automatyczna</td><td>Manualna z narzędziami</td><td>Skryptowane scenariusze długoterminowe, zwykle bez wiedzy zespołu obrony</td><td>Wg ram TIBER-EU, z udziałem zewnętrznych testerów i dostawców wywiadu</td></tr>'+
'<tr><td>Zakres</td><td>Szeroki</td><td>Wybrany, z głębią</td><td>Cały łańcuch ataku</td><td>Krytyczne lub istotne funkcje (KLIF) i systemy produkcyjne</td></tr>'+
'<tr><td>Częstotliwość</td><td>Ciągle</td><td>Cyklicznie i po zmianach</td><td>Rzadziej</td><td>Wg wymogów DORA i nadzorcy</td></tr></table></div>'+
'<p>Zasady dotyczące TLPT i zakres podmiotów, które je wykonują, wynikają z DORA i aktów delegowanych. Sprawdź aktualne wymogi dla swojej organizacji. Skan podatności nie wyczerpuje znamion testu bezpieczeństwa (lekcja 23).</p>'+
'<h2>Rodzaje testów według wiedzy testera</h2>'+
'<ul><li><b>Black box</b> (nieznane środowisko): tester działa jak zewnętrzny atakujący. <b>Gray box</b>: częściowa wiedza, np. konto użytkownika. <b>White box</b>: pełna wiedza (dokumentacja, kod). Im więcej wiedzy, tym zwykle szersze pokrycie przy tym samym budżecie, a mniej realizmu.</li>'+
'<li>Rodzaje według celu: sieć zewnętrzna i wewnętrzna, aplikacje WWW i API, aplikacje mobilne, Wi-Fi, chmura, socjotechnika, bezpieczeństwo fizyczne, urządzenia IoT i systemy przemysłowe (tylko ze szczególną ostrożnością).</li></ul>'+
'<h2>Fazy testu</h2>'+
'<div class="tablewrap"><table><tr><th>Faza</th><th>Co się dzieje</th><th>Efekt</th></tr>'+
'<tr><td>1. Planowanie i zakres</td><td>Cele, zakres, zgody, ROE, terminy, kontakty awaryjne, dane</td><td>Umowa i zasady zaangażowania</td></tr>'+
'<tr><td>2. Rozpoznanie</td><td>Pasywne (OSINT) i aktywne (skanowanie), ustalenie powierzchni ataku</td><td>Mapa celów i usług</td></tr>'+
'<tr><td>3. Enumeracja i analiza podatności</td><td>Identyfikacja usług, wersji, kont, potencjalnych luk</td><td>Lista kandydatów do weryfikacji</td></tr>'+
'<tr><td>4. Wykorzystanie</td><td>Kontrolowana próba użycia luk w ramach zakresu</td><td>Dowód realnego wpływu</td></tr>'+
'<tr><td>5. Po wykorzystaniu</td><td>Eskalacja uprawnień, ruch boczny, dostęp do danych w uzgodnionych granicach, ocena skutku</td><td>Ścieżki ataku i skutki biznesowe</td></tr>'+
'<tr><td>6. Sprzątanie</td><td>Usunięcie narzędzi, kont i zmian wprowadzonych przez test, przywrócenie stanu</td><td>Brak pozostałości</td></tr>'+
'<tr><td>7. Raport i retest</td><td>Ustalenia, ryzyko, rekomendacje, spotkanie, ponowna weryfikacja poprawek</td><td>Plan naprawy i potwierdzenie</td></tr></table></div>'+
'<p>Standardy i metodyki: PTES, NIST SP 800-115 (przewodnik po testach bezpieczeństwa), OWASP WSTG (aplikacje WWW), OSSTMM. Wykorzystuj je, aby wymagać od zleceniobiorcy powtarzalnej metody.</p>'+
'<h2>Zasady zaangażowania (ROE) i aspekty prawne</h2>'+
'<ul><li><b>Zakres</b>: konkretne adresy, aplikacje, konta, okresy. Co jest wyłączone (np. systemy produkcyjne krytyczne, dane klientów, ataki DoS, socjotechnika wobec wybranych osób).</li>'+
'<li><b>Zgody</b>: pisemna autoryzacja osoby uprawnionej. Dla infrastruktury stron trzecich (hosting, SaaS, chmura) zgoda dostawcy i zgodność z jego regulaminem testów.</li>'+
'<li><b>Dane</b>: umowa powierzenia lub inne podstawy, jeśli tester może uzyskać dostęp do danych osobowych (RODO), NDA, zasady przechowywania i usuwania danych z testu, szyfrowanie raportów.</li>'+
'<li><b>Bezpieczeństwo testu</b>: okna czasowe, kontakty awaryjne po obu stronach, zasady wstrzymania, kopie zapasowe przed testem, zgłaszanie ustaleń krytycznych natychmiast, a nie dopiero w raporcie końcowym.</li>'+
'<li><b>Powiadomienia</b>: kto w organizacji wie o teście (zespół SOC zwykle jest informowany, w red teamingu częściowo nie), aby test nie uruchomił niepotrzebnie reagowania na incydent z udziałem organów.</li>'+
'<li><b>Ubezpieczenie</b> i odpowiedzialność wykonawcy, kwalifikacje i niekaralność testerów, jawność podwykonawców.</li></ul>'+
'<h2>Raport i ustalenia</h2>'+
'<ul><li><b>Streszczenie dla zarządu</b>: cel, zakres, kluczowe wnioski i wpływ na biznes, ocena ogólna.</li>'+
'<li><b>Ustalenia</b>: opis, dowód (zrzut, kroki odtworzenia), wpływ, prawdopodobieństwo, ocena (np. CVSS i kontekst), rekomendacja, odnośniki (CWE, OWASP).</li>'+
'<li><b>Ścieżki ataku</b>: jak połączone słabości prowadzą do skutku (np. słaby punkt w aplikacji, następnie dostęp do bazy).</li>'+
'<li>Dobry raport ma wyniki dostępne do dalszej pracy (lista w formacie przetwarzalnym), plan retestu i rozróżnia ustalenia potwierdzone od teoretycznych.</li></ul>'+
'<h2>Skoordynowane ujawnianie podatności</h2>'+
'<p>Osoba, która znalazła podatność w cudzym systemie, powinna zgłosić ją właścicielowi lub koordynatorowi (CSIRT), nie publikując szczegółów, i dać czas na naprawę. Organizacje powinny mieć <b>politykę zgłaszania podatności</b> (kontakt, zakres, zasady bezpiecznego działania) oraz proces obsługi zgłoszeń. W Polsce koordynacją zajmują się zespoły CSIRT (m.in. CERT Polska), a ustawa o KSC i DORA kładą nacisk na obsługę i ujawnianie podatności. Programy bug bounty to dobrowolny model nagradzania zgłoszeń według jasnych reguł.</p>'+
'<h2>Jak wykorzystać wyniki</h2>'+
'<ol><li>Wprowadź ustalenia do rejestru podatności i ryzyk (lekcje 16 i 23) z właścicielem i terminem.</li><li>Zlikwiduj przyczyny źródłowe (wzorzec błędu), a nie pojedyncze objawy.</li><li>Dodaj detekcje dla ścieżek, które test pokazał jako niewidoczne dla SOC (lekcja 25).</li><li>Wykonaj retest i zaktualizuj mierniki.</li></ol>',
  ex:[
  {t:"Przykład 1: szablon zasad zaangażowania (ROE)",
   h:'<div class="tablewrap"><table><tr><th>Element</th><th>Treść (do uzupełnienia)</th></tr>'+
   '<tr><td>Cel testu</td><td>Np. ocena odporności aplikacji sklepu i sieci zewnętrznej przed audytem</td></tr>'+
   '<tr><td>Zakres wejściowy</td><td>Adresy i domeny, aplikacje, wersje, konta testowe, środowisko (staging czy produkcja)</td></tr>'+

   '<tr><td>Zgody</td><td>Podpis osoby uprawnionej, zgody dostawców (chmura, SaaS), data i godziny</td></tr>'+
   '<tr><td>Okno testu</td><td>Dni i godziny, ograniczenia obciążenia, tempo skanowania</td></tr>'+
   '<tr><td>Kontakty awaryjne</td><td>Osoby po stronie zamawiającego i wykonawcy, numer 24/7, zasada natychmiastowego wstrzymania</td></tr>'+
   '<tr><td>Dane i poufność</td><td>NDA, umowa powierzenia, szyfrowanie, retencja i usunięcie danych z testu</td></tr>'+
   '<tr><td>Raportowanie</td><td>Ustalenia krytyczne zgłaszane od razu, raport w terminie, spotkanie omówienia, retest</td></tr>'+
   '<tr><td>Odpowiedzialność</td><td>Ubezpieczenie, zasady postępowania w razie zakłócenia usług</td></tr></table></div>'},
  {t:"Przykład 2: opis ustalenia w raporcie",
   h:'<div class="tablewrap"><table><tr><th>Pole</th><th>Przykład</th></tr>'+
   '<tr><td>Tytuł i identyfikator</td><td>PT-07: brak kontroli dostępu do obiektów w API zamówień (IDOR)</td></tr>'+
   '<tr><td>Kategoria</td><td>OWASP A01 Broken Access Control, CWE-639</td></tr>'+
   '<tr><td>Opis</td><td>Użytkownik uwierzytelniony może pobrać zamówienia innych klientów po zmianie identyfikatora w żądaniu</td></tr>'+
   '<tr><td>Dowód</td><td>Kroki odtworzenia dla konta testowego i zrzuty odpowiedzi, z zamaskowanymi danymi osobowymi</td></tr>'+

   '<tr><td>Ocena</td><td>Wysoka (CVSS wg wektora oraz kontekst: aplikacja dostępna z internetu, wiele rekordów)</td></tr>'+

  {t:"Przykład 3: podsumowanie ustaleń w Pythonie",
   h:'<pre><code>from collections import Counter\n\nFINDINGS = [\n    {"id": "PT-07", "sev": "Wysoka",   "status": "otwarte"},\n    {"id": "PT-08", "sev": "Krytyczna", "status": "naprawione"},\n    {"id": "PT-09", "sev": "Średnia",  "status": "otwarte"},\n    {"id": "PT-10", "sev": "Niska",    "status": "retest OK"},\n]\n\nKOLEJNOSC = ["Krytyczna", "Wysoka", "Średnia", "Niska"]\notwarte = Counter(f["sev"] for f in FINDINGS if f["status"] == "otwarte")\nfor poziom in KOLEJNOSC:\n    print(f"{poziom:10s} otwarte: {otwarte.get(poziom, 0)}")\n\nprint("Do retestu:", [f["id"] for f in FINDINGS if f["status"] == "naprawione"])</code></pre>'+

  {t:"Ćwiczenie: oceń zlecenie testu",
   h:'<p>Firma zamawia „test penetracyjny” sklepu internetowego u wykonawcy, który proponuje: zakres „wszystko pod domeną firma.pl”, brak szczegółów kontaktów awaryjnych, przechowywanie wyników na prywatnym dysku testera i brak planu retestu. Co poprawisz?</p>'+

LESSONS[28] = {
  lead:"Najlepszy plan ochrony nic nie zmieni, jeśli zarząd go nie zatwierdzi, a zespół nie zrozumie. Ta lekcja jest o prezentowaniu wyników projektu, rozmawianiu o ryzyku językiem biznesu, zarządzaniu czasem i pewności w kontaktach z klientem i zarządem. Zakładka „Warsztat” pomoże Ci przygotować własną prezentację.",
  goals:["Zbudować krótką prezentację zorientowaną na decyzje (sytuacja, ryzyko, rekomendacja, koszt, decyzje)","Tłumaczyć pojęcia techniczne na język biznesu i odpowiadać na trudne pytania","Przekazywać złe wiadomości i udzielać oraz przyjmować informację zwrotną","Zarządzać czasem i priorytetami oraz budować pewność siebie"],
  intro:
'<div class="callout"><strong>Kompetencje miękkie w programie kursu</strong>Komunikacja, praca z klientem, organizacja pracy, zarządzanie czasem i pewność w środowisku zawodowym to osobna część efektów kursu. Ta lekcja zbiera je w jednym miejscu i łączy z prezentacją projektu końcowego z lekcji 21 i 22.</div>'+
'<h2>Prezentacja projektu: struktura na 10 minut</h2>'+
'<div class="tablewrap"><table><tr><th>Czas</th><th>Część</th><th>Pytanie, na które odpowiadasz</th></tr>'+
'<tr><td>1 min</td><td>Kontekst i cel</td><td>Dlaczego rozmawiamy i co chcemy ustalić?</td></tr>'+
'<tr><td>2 min</td><td>Najważniejsze ryzyka</td><td>Co może pójść źle i ile to kosztuje?</td></tr>'+
'<tr><td>3 min</td><td>Rekomendacja i mapa drogowa</td><td>Co proponujesz zrobić, w jakiej kolejności i z kim?</td></tr>'+
'<tr><td>1 min</td><td>Koszt i efekt</td><td>Ile to kosztuje i co zyskujemy?</td></tr>'+
'<tr><td>1 min</td><td>Decyzje</td><td>Czego dokładnie potrzebujesz od słuchaczy?</td></tr>'+
'<tr><td>2 min</td><td>Rezerwa i pytania</td><td>Co jeszcze warto wyjaśnić?</td></tr></table></div>'+
'<ul><li><b>Jedna teza</b> na początku: „Bez trzech działań w ciągu 90 dni ryzyko przestoju ERP pozostaje na poziomie niedopuszczalnym”. Reszta prezentacji ją uzasadnia.</li>'+
'<li><b>Slajdy to pomoc, nie skrypt</b>: jedna myśl na slajd, liczby z jednostkami i źródłem, wykres zamiast tabeli, brak ścian tekstu.</li>'+
'<li><b>Historia</b>: sytuacja, komplikacja, pytanie, odpowiedź. Jeden krótki, prawdziwy przykład incydentu (np. z lekcji 2) działa lepiej niż ogólniki.</li>'+
'<li><b>Pokaż niepewność uczciwie</b>: podawaj widełki (np. strata roczna 400–800 tys. zł) i założenia, zamiast udawać dokładność.</li></ul>'+
'<h2>Język biznesu zamiast języka technicznego</h2>'+
'<div class="tablewrap"><table><tr><th>Zamiast</th><th>Powiedz</th></tr>'+
'<tr><td>Brakuje MFA na VPN</td><td>Ktokolwiek zdobędzie hasło pracownika, wejdzie do sieci firmy. To najczęstsza droga ataków ransomware.</td></tr>'+
'<tr><td>Kopie zapasowe nie są niezmienne</td><td>Atakujący najpierw kasuje kopie. Dziś nie jesteśmy pewni, że po ataku odtworzymy ERP w kilka dni.</td></tr>'+
'<tr><td>Mamy 340 podatności krytycznych</td><td>12 luk dotyczy systemów dostępnych z internetu i ma aktywne exploity. To je naprawimy w tym miesiącu.</td></tr>'+
'<tr><td>Potrzebujemy EDR</td><td>Dziś o ataku dowiadujemy się po kilku godzinach. Z EDR skrócimy to do minut i ograniczymy straty.</td></tr>'+
'<tr><td>Brak zgodności z ustawą o KSC</td><td>Kierownictwo odpowiada prawnie i finansowo. Potrzebujemy decyzji o zakresie wdrożenia i budżecie do kwietnia.</td></tr></table></div>'+
'<h2>Trudne pytania i sprzeciwy</h2>'+
'<div class="tablewrap"><table><tr><th>Pytanie</th><th>Dobra odpowiedź (kierunek)</th></tr>'+
'<tr><td>Czy to nie za drogo?</td><td>Porównaj koszt z oczekiwaną roczną stratą (ALE) i kosztem przestoju. Zaproponuj wariant minimalny i skutki rezygnacji.</td></tr>'+
'<tr><td>Czy nie możemy poczekać do przyszłego roku?</td><td>Pokaż, które ryzyka rosną z czasem (terminy prawne, aktywne ataki, wymagania klientów) i co da się odłożyć bez szkody.</td></tr>'+
'<tr><td>Dlaczego mamy ufać Twoim liczbom?</td><td>Opisz założenia, źródła i widełki. Zaproponuj weryfikację z właścicielami procesów.</td></tr>'+
'<tr><td>Czy to gwarantuje, że nas nie zaatakują?</td><td>Nie. Zmniejszamy prawdopodobieństwo i skutki, a plan IR skraca czas reakcji. Mówimy o akceptowalnym ryzyku, nie o zerze.</td></tr>'+
'<tr><td>Czegoś nie wiem</td><td>„Nie mam tych danych teraz. Sprawdzę i odpowiem do jutra.” To wzmacnia wiarygodność.</td></tr></table></div>'+
'<h2>Przekazywanie złych wiadomości i praca z klientem</h2>'+
'<ul><li><b>Szybko, rzeczowo, z opcjami</b>: co się stało, co wiemy, czego nie wiemy, co robimy, co zalecamy, od kogo potrzebujemy decyzji. Nie ukrywaj i nie spekuluj.</li>'+
'<li><b>Słuchaj najpierw</b>: pytaj o cele i ograniczenia biznesu, zanim zaproponujesz rozwiązanie. Rozumiesz, co dla nich jest ryzykiem.</li>'+
'<li><b>Zarządzaj oczekiwaniami</b>: ustal, co dostarczysz, kiedy i z jakim poziomem pewności. Informuj o zmianach wcześnie.</li>'+
'<li><b>Mapa interesariuszy</b>: kto decyduje, kto wpływa, kto jest zainteresowany, kto blokuje. Dopasuj komunikację do każdej grupy.</li></ul>'+
'<h2>Informacja zwrotna</h2>'+
'<ul><li>Model <b>SBI</b>: <b>S</b>ytuacja (kiedy i gdzie), <b>Z</b>achowanie (co konkretnie zaobserwowałeś), <b>W</b>pływ (jaki miało skutek). Przykład: „W części o ryzykach (S) pokazałeś trzy liczby bez źródeł (Z), więc trudno było mi ocenić, na ile im ufać (W)”.</li>'+
'<li>Przyjmując informację zwrotną: słuchaj bez obrony, dopytaj o przykłady, podziękuj, wybierz jedną rzecz do poprawy.</li></ul>'+
'<h2>Czas, priorytety i pewność siebie</h2>'+
'<ul><li><b>Priorytety</b>: oddzielaj pilne od ważnego (macierz Eisenhowera), ustalaj tygodniowo trzy rzeczy, które muszą się wydarzyć, blokuj czas na pracę głęboką, odmawiaj lub negocjuj termin, gdy zlecenie nie mieści się w priorytetach.</li>'+
'<li><b>Delegowanie</b>: jasny cel, kryterium sukcesu, termin i zakres decyzji, a następnie kontrola punktowa.</li>'+
'<li><b>Pewność siebie</b> wynika z przygotowania: przećwicz na głos, przygotuj 5 najtrudniejszych pytań, znajdź jedną liczbę, którą pamiętasz dokładnie. Opanuj stres oddechem i spokojnym tempem mowy. Pewność nie oznacza udawania wiedzy.</li></ul>'+
'<h2>Wykorzystanie AI do przygotowania</h2>'+
'<p>Asystent AI może pomóc w szkicu struktury, doborze przykładów, przetestowaniu pytań („zadaj mi pięć trudnych pytań o ten plan”) i uproszczeniu języka. Nie wklejaj do niezatwierdzonych narzędzi danych poufnych (lekcja 17), sprawdzaj liczby i fakty i nie przypisuj modelowi odpowiedzialności za treść. Za wnioski odpowiadasz Ty.</p>',

  {t:"Przykład 1: szkielet slajdów (10 slajdów)",
   h:'<ol><li><b>Teza</b> i cel spotkania (jedno zdanie).</li><li><b>Kontekst biznesowy</b>: co ważne dla firmy, 2–3 procesy krytyczne.</li><li><b>Trzy najważniejsze ryzyka</b> w pieniądzach i skutkach (ALE z widełkami).</li><li><b>Dlaczego teraz</b>: terminy prawne, zdarzenia, wymagania klientów.</li><li><b>Rekomendacja</b>: plan 30/90/365 dni jednym obrazem.</li><li><b>Koszt i efekt</b>: budżet, ROSI, redukcja ryzyka.</li><li><b>Zgodność</b>: kluczowe wymagania i status.</li><li><b>Ryzyka planu</b>: co może pójść nie tak i jak to ograniczamy.</li><li><b>Decyzje</b>: numerowana lista (1, 2, 3).</li><li><b>Dodatek</b>: szczegółowe dane, metodyka, założenia.</li></ol>'},
