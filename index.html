<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberbezpieczeństwo od podstaw do Security+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --panel:#FFFFFF; --ink:#16252C; --muted:#5B6B70; --line:#D3DAD6;
  --accent:#0E6B63; --accent-ink:#FFFFFF; --accent-soft:#D9ECE8;
  --warn:#A8402D; --warn-soft:#F6E1DB; --ok:#2C7A3F; --ok-soft:#DDEFE1;
  --code-bg:#14232A; --code-ink:#DCE9E4;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --panel:#16252C; --ink:#E4ECE9; --muted:#9BAAA9; --line:#2A3C44;
    --accent:#4FC3B5; --accent-ink:#0A1A1D; --accent-soft:#18383A;
    --warn:#F08A74; --warn-soft:#3A2420; --ok:#7BCB8B; --ok-soft:#1D3524;
    --code-bg:#0A1317; --code-ink:#D5E4DF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --panel:#16252C; --ink:#E4ECE9; --muted:#9BAAA9; --line:#2A3C44;
  --accent:#4FC3B5; --accent-ink:#0A1A1D; --accent-soft:#18383A;
  --warn:#F08A74; --warn-soft:#3A2420; --ok:#7BCB8B; --ok-soft:#1D3524;
  --code-bg:#0A1317; --code-ink:#D5E4DF;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 16px 32px}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 6px}
.meter>span{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.meter-label{font-size:13px;color:var(--muted);margin:0 0 18px}
.block-title{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.lesson-btn{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;line-height:1.35}
.lesson-btn:hover{background:var(--accent-soft)}
.lesson-btn[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lesson-btn .n{flex:0 0 24px;font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.lesson-btn .t{flex:1;font-size:14.5px}
.lesson-btn .s{flex:0 0 auto;font-size:12px;color:var(--muted)}
.lesson-btn.soon .t{color:var(--muted)}
.lesson-btn.done .s{color:var(--ok);font-weight:600}
.side-foot{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.ghost:hover{border-color:var(--accent);color:var(--ink)}

.main{padding:32px clamp(16px,4vw,56px) 80px;min-width:0}
.mobile-bar{display:none}
.scrim{display:none}
.wrap{max-width:780px;margin:0 auto}
.crumb{font-size:14px;color:var(--muted);margin:0 0 6px}
h1.lesson-title{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.2vw,40px);line-height:1.15;margin:0 0 12px}
.lead{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 22px}
.goals{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin:0 0 24px}
.goals strong{display:block;margin-bottom:4px}
.goals ul{margin:0;padding-left:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;flex:0 0 auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

.prose{font-family:var(--serif);font-size:18px;line-height:1.65}
.prose h2{font-family:var(--ui);font-size:22px;font-weight:600;margin:34px 0 8px;line-height:1.25}
.prose h3{font-family:var(--ui);font-size:17px;font-weight:600;margin:24px 0 6px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 16px;padding-left:24px}
.prose li{margin-bottom:6px}
.prose code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.prose table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:15px;margin:0 0 18px}
.tablewrap{overflow-x:auto;margin:0 0 18px}
.prose th,.prose td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--accent-soft);font-weight:600}
.callout{font-family:var(--ui);font-size:15.5px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:4px;padding:12px 16px;margin:0 0 18px}
.callout.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.callout strong:first-child{display:block;margin-bottom:2px}
pre{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.55;padding:14px 16px;border-radius:8px;overflow-x:auto;margin:0 0 18px;max-width:100%}
.prose pre code,pre code{background:none;padding:0;border-radius:0;font-size:inherit;color:inherit}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px 6px;margin:0 0 22px}
.ex>h2{margin-top:0 !important}
details{font-family:var(--ui);font-size:15.5px;margin:0 0 14px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg)}
summary{cursor:pointer;font-weight:500}
details[open] summary{margin-bottom:8px}

/* defense in depth: nested layers */
.onion{font-family:var(--ui);font-size:14px;margin:6px 0 20px}
.layer{border:2px solid var(--accent);border-radius:12px;padding:8px 12px 12px;background:var(--panel)}
.layer>b{display:block;margin-bottom:6px}
.layer .layer{margin-top:4px}
.layer .layer .layer .layer .layer{background:var(--accent-soft)}
.layer small{color:var(--muted);font-weight:400}

/* quiz */
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.q-head{font-weight:600;margin:0 0 12px}
.q-head .qn{color:var(--muted);font-family:var(--mono);font-size:13px;margin-right:8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.why{font-size:15px;margin:10px 0 0;padding:10px 12px;border-radius:6px;background:var(--bg);border-left:4px solid var(--muted)}
.why.good{border-left-color:var(--ok)} .why.bad{border-left-color:var(--warn)}
.result{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.result h3{margin:0 0 6px;font-size:20px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.wsf{margin:0 0 20px}
.wsf label{display:block;font-weight:600;margin:0 0 2px}
.hint{font-size:14px;color:var(--muted);margin:0 0 6px}
.wsf textarea,.ws-export{width:100%;font-family:var(--ui);font-size:15px;line-height:1.5;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.ws-export{font-family:var(--mono);font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.soon-box{background:var(--panel);border:1px dashed var(--muted);border-radius:10px;padding:24px;font-family:var(--ui)}
.soon-box h2{margin:0 0 8px;font-size:20px}

@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;inset:0 20% 0 0;max-width:340px;z-index:20;height:100%;transform:translateX(-102%);padding-top:calc(20px + env(safe-area-inset-top,0px));transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
  .scrim.show{display:block}
  .mobile-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .main{padding-top:20px}
  .tab{padding:10px 11px;font-size:15px}
  .prose{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Spis lekcji">
    <h1 class="brand">Cyberbezpieczeństwo od podstaw do Security+</h1>
    <p class="brand-sub">32 lekcje: wprowadzenie, przykłady, quiz</p>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="meter"><span id="meter-bar"></span></div>
    <p class="meter-label" id="meter-label"></p>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="ghost" id="theme-btn" type="button">Zmień motyw</button>
      <button class="ghost" id="reset-btn" type="button">Wyzeruj postęp</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main-col" style="min-width:0">
    <div class="mobile-bar">
      <button class="ghost" id="menu-btn" type="button" aria-controls="side" aria-expanded="false">Spis lekcji</button>
      <span id="mobile-prog" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<script>
/* ---------- Spis lekcji ---------- */
var BLOCKS = [
  {name:"Fundamenty", ids:[1,2]},
  {name:"Hosty i systemy operacyjne", ids:[3,4]},
  {name:"Sieci", ids:[5,6,7,8,9,10]},
  {name:"Tożsamość i kryptografia", ids:[11,12,13,14,15]},
  {name:"Ryzyko, polityki i zgodność", ids:[16,17,18,19]},
  {name:"Bezpieczeństwo aplikacji", ids:[20]},
  {name:"Projekt końcowy", ids:[21,22]},
  {name:"Operacje obronne i ofensywne", ids:[23,24,25,26,27]},
  {name:"Podsumowanie i egzamin", ids:[28,29,30,31,32]}
];
var TITLES = {
1:"Wprowadzenie do cyberbezpieczeństwa",2:"Typy zagrożeń i znane ataki",3:"Systemy operacyjne: konta i uprawnienia",4:"Zabezpieczenia hostów",
5:"Podstawy sieci komputerowych",6:"Zagrożenia sieciowe i analiza ruchu",7:"Segmentacja i architektura sieci",8:"Zapory i sieci bezprzewodowe",
9:"Bezpieczne protokoły komunikacyjne",10:"Monitoring sieci i analiza logów",11:"IAM: zarządzanie tożsamością",12:"Uwierzytelnianie i federacja",
13:"Podstawy kryptografii",14:"PKI i narzędzia szyfrujące",15:"Backup i klasyfikacja danych",16:"Zarządzanie ryzykiem",
17:"Tworzenie polityk bezpieczeństwa",18:"Standardy i regulacje",19:"Compliance i audyt",20:"Wprowadzenie do bezpieczeństwa aplikacji",
21:"Projekt końcowy, część I",22:"Projekt końcowy, część II",23:"OSINT i skanowanie podatności",24:"Zarządzanie incydentami",
25:"Zaawansowane techniki obronne",26:"Secure coding i DevSecOps",27:"Wprowadzenie do testów penetracyjnych",28:"Prezentacje projektów",
29:"Powtórka: kryptografia, IAM, aplikacje",30:"Powtórka: sieci, incydenty, compliance",31:"Egzamin próbny i omówienie wyników",32:"Ścieżki kariery i certyfikacji"
};

/* ---------- Treść lekcji ---------- */
var LESSONS = {};

LESSONS[1] = {
  lead:"Zanim nauczysz się czegokolwiek konkretnego, potrzebujesz wspólnego języka. Ta lekcja daje go w trzech krokach: co właściwie chronimy, przed czym i w jaki sposób warstwowo budujemy obronę.",
  goals:["Wyjaśnić triadę CIA i jej rozszerzenia","Odróżnić aktywo, zagrożenie, podatność, ryzyko i zabezpieczenie","Opisać strategię defense-in-depth","Sklasyfikować zabezpieczenie według kategorii i typu (nomenklatura Security+)"],
  intro:
'<h2>Czym jest bezpieczeństwo informacji</h2>'+
'<p>Bezpieczeństwo informacji to ochrona informacji bez względu na to, gdzie żyje: w bazie danych, na papierze, w głowie pracownika czy w chmurze. Cyberbezpieczeństwo jest jego częścią dotyczącą systemów i sieci. Cel nie polega na „zero incydentów”, tylko na tym, żeby organizacja mogła działać mimo ataków i błędów, a straty były akceptowalne.</p>'+
'<h2>Triada CIA</h2>'+
'<div class="tablewrap"><table><tr><th>Właściwość</th><th>Pytanie kontrolne</th><th>Typowe zabezpieczenia</th></tr>'+
'<tr><td><b>Poufność</b> (Confidentiality)</td><td>Czy dostęp mają tylko uprawnione osoby?</td><td>Szyfrowanie, kontrola dostępu, MFA, klasyfikacja danych</td></tr>'+
'<tr><td><b>Integralność</b> (Integrity)</td><td>Czy dane są kompletne i nie zostały po cichu zmienione?</td><td>Funkcje skrótu, podpisy cyfrowe, kontrola wersji, logi zmian</td></tr>'+
'<tr><td><b>Dostępność</b> (Availability)</td><td>Czy system działa wtedy, gdy jest potrzebny?</td><td>Redundancja, backup, ochrona przed DDoS, plany DR</td></tr></table></div>'+
'<p>Właściwości bywają ze sobą w napięciu. Silne szyfrowanie i rygorystyczny dostęp poprawiają poufność, ale mogą pogorszyć dostępność, gdy klucz zginie albo MFA zablokuje lekarza przy łóżku pacjenta. Zawodowa praca polega na świadomym wyważaniu tych kompromisów, a nie na maksymalizowaniu jednej litery.</p>'+
'<h3>Rozszerzenia triady</h3>'+
'<ul><li><b>Autentyczność</b>: pewność, że dane lub użytkownik są tym, za kogo się podają.</li>'+
'<li><b>Niezaprzeczalność</b> (non-repudiation): nadawca nie może wiarygodnie wyprzeć się wykonanej akcji. Zapewniają ją m.in. podpisy cyfrowe.</li>'+
'<li><b>AAA</b>: uwierzytelnianie (kim jesteś), autoryzacja (co możesz), rozliczalność (co zrobiłeś, czyli logi).</li></ul>'+
'<h2>Słownik, który musisz mieć w głowie</h2>'+
'<div class="tablewrap"><table><tr><th>Pojęcie</th><th>Znaczenie</th><th>Przykład</th></tr>'+
'<tr><td>Aktywo</td><td>Wszystko, co ma wartość dla organizacji</td><td>Baza klientów, serwer ERP, reputacja</td></tr>'+
'<tr><td>Zagrożenie</td><td>Potencjalna przyczyna szkody</td><td>Grupa ransomware, błąd pracownika, powódź</td></tr>'+
'<tr><td>Podatność</td><td>Słabość, którą zagrożenie może wykorzystać</td><td>Niezałatany serwer, słabe hasło administratora</td></tr>'+
'<tr><td>Ryzyko</td><td>Możliwość straty: zagrożenie wykorzystujące podatność aktywa</td><td>Szyfrowanie ERP przez ransomware przez niezałatany serwer</td></tr>'+
'<tr><td>Zabezpieczenie (control)</td><td>Środek zmniejszający ryzyko</td><td>Łatanie, segmentacja, backup offline</td></tr></table></div>'+
'<div class="callout"><strong>Zasada zapamiętywania</strong>Bez zagrożenia podatność jest tylko wadą, a bez podatności zagrożenie nie ma czego użyć. Ryzyko pojawia się dopiero na ich przecięciu, a jego wielkość upraszczamy do iloczynu: <code>prawdopodobieństwo × wpływ</code>. Szczegóły w lekcji 16.</div>'+
'<h2>Defense in depth: obrona warstwowa</h2>'+
'<p>Żadne pojedyncze zabezpieczenie nie jest nieomylne, dlatego układamy je w warstwy. Atakujący, który pokona jedną, trafia na następną, a każda dodatkowo daje szansę na wykrycie włamania.</p>'+
'<div class="onion" role="img" aria-label="Warstwy obrony od zewnątrz: polityki i szkolenia, bezpieczeństwo fizyczne, perymetr, sieć, host, aplikacja, dane">'+
'<div class="layer"><b>Polityki, procedury, szkolenia <small>(czynnik ludzki)</small></b>'+
'<div class="layer"><b>Bezpieczeństwo fizyczne <small>(zamki, kontrola wstępu, monitoring)</small></b>'+
'<div class="layer"><b>Perymetr <small>(firewall, VPN, WAF)</small></b>'+
'<div class="layer"><b>Sieć <small>(segmentacja, IDS/IPS, NAC)</small></b>'+
'<div class="layer"><b>Host <small>(łatki, EDR, hardening, uprawnienia)</small></b>'+
'<div class="layer"><b>Aplikacja <small>(bezpieczny kod, walidacja, uwierzytelnianie)</small></b>'+
'<div class="layer"><b>Dane <small>(szyfrowanie, backup, klasyfikacja)</small></b></div>'+
'</div></div></div></div></div></div></div>'+
'<p>Warstwy powinny być zróżnicowane. Dwa firewalle od tego samego dostawcy z tą samą podatnością to praktycznie jedna warstwa. Powiązane idee to <b>najmniejsze uprawnienia</b> (każdy ma tylko to, czego potrzebuje), <b>rozdział obowiązków</b> (krytyczne operacje wymagają dwóch osób) i <b>Zero Trust</b> (żadnego zaufania z samego położenia w sieci).</p>'+
'<h2>Kategorie i typy zabezpieczeń (Security+)</h2>'+
'<p>Na egzaminie każde zabezpieczenie klasyfikujesz dwuwymiarowo.</p>'+
'<div class="tablewrap"><table><tr><th>Kategoria (czym jest)</th><th>Typ (co robi)</th></tr>'+
'<tr><td><b>Techniczna</b>: firewall, szyfrowanie, antywirus</td><td><b>Zapobiegawcze</b> (preventive): blokuje zdarzenie</td></tr>'+
'<tr><td><b>Zarządcza</b> (managerial): ocena ryzyka, polityki</td><td><b>Wykrywające</b> (detective): ujawnia zdarzenie, np. SIEM, kamera</td></tr>'+
'<tr><td><b>Operacyjna</b>: szkolenia, procedury wykonywane przez ludzi</td><td><b>Naprawcze</b> (corrective): ogranicza skutki, np. restore z backupu</td></tr>'+
'<tr><td><b>Fizyczna</b>: zamek, ogrodzenie, ochroniarz</td><td><b>Odstraszające</b> (deterrent), <b>kompensacyjne</b> (compensating), <b>dyrektywne</b> (directive): nakazuje, np. polityka</td></tr></table></div>'+
'<h2>Krajobraz zagrożeń w skrócie</h2>'+
'<ul><li><b>Ransomware</b> i wymuszenia: przestępczość zorganizowana działająca jak firma, często z wyciekiem danych jako dodatkowym naciskiem.</li>'+
'<li><b>Phishing i przejęcia kont</b>: najczęstszy punkt wejścia, bo omija technikę i uderza w człowieka.</li>'+
'<li><b>Łańcuch dostaw</b>: atak na dostawcę oprogramowania lub usługi zamiast na cel bezpośrednio.</li>'+
'<li><b>Podatności w urządzeniach brzegowych</b> (VPN, firewalle, poczta): szybko wykorzystywane po publikacji łatek.</li>'+
'<li><b>AI po obu stronach</b>: wiarygodniejsze wiadomości phishingowe i deepfake po stronie atakujących, szybsza analiza alertów po stronie obrońców. Do tego nowa powierzchnia ataku: prompt injection i wyciek danych przez narzędzia AI.</li></ul>'+
'<p>Plan kursu: najpierw hosty i sieci, potem tożsamość i kryptografia, dalej ryzyko i zgodność, a na końcu aplikacje, operacje obronne i testy penetracyjne. Całość przygotowuje do egzaminu CompTIA Security+ (SY0-701).</p>',
  ex:[
  {t:"Przykład 1: jeden incydent, trzy właściwości",
   h:'<p>Dopasuj każdy incydent do właściwości triady, która została naruszona.</p>'+
   '<ol><li>Szpital nie może otworzyć kart pacjentów, bo ransomware zaszyfrował serwery.</li>'+
   '<li>Księgowy zmienia numer konta w pliku z przelewami, a nikt tego nie zauważa.</li>'+
   '<li>Dysk z danymi klientów trafia do sieci publicznej w nieskonfigurowanym koszyku chmurowym.</li></ol>'+
   '<details><summary>Pokaż rozwiązanie</summary><p>(1) <b>Dostępność</b>: dane istnieją, ale są niedostępne (przy wycieku danych przez podwójne wymuszenie dojdzie też poufność). (2) <b>Integralność</b>: zmiana bez autoryzacji i bez śladu. (3) <b>Poufność</b>: dane widzą osoby nieuprawnione.</p></details>'},
  {t:"Przykład 2: klasyfikacja zabezpieczeń",
   h:'<div class="tablewrap"><table><tr><th>Zabezpieczenie</th><th>Kategoria</th><th>Typ</th></tr>'+
   '<tr><td>Zapora sieciowa blokuje port 445 z internetu</td><td>Techniczna</td><td>Zapobiegawcze</td></tr>'+
   '<tr><td>Kamera CCTV przy serwerowni</td><td>Fizyczna</td><td>Wykrywające (i odstraszające)</td></tr>'+
   '<tr><td>Polityka haseł zatwierdzona przez zarząd</td><td>Zarządcza</td><td>Dyrektywne</td></tr>'+
   '<tr><td>Odtworzenie systemu z kopii po awarii</td><td>Techniczna</td><td>Naprawcze</td></tr>'+
   '<tr><td>Kwartalne szkolenie z rozpoznawania phishingu</td><td>Operacyjna</td><td>Zapobiegawcze</td></tr>'+
   '<tr><td>Dodatkowa segmentacja, bo nie da się załatać starego systemu</td><td>Techniczna</td><td>Kompensacyjne</td></tr></table></div>'+
   '<div class="callout">Zauważ, że jedno zabezpieczenie bywa jednocześnie np. wykrywające i odstraszające. Na egzaminie wybierasz typ, który najlepiej opisuje <i>główną</i> funkcję w danym scenariuszu.</div>'},
  {t:"Przykład 3: sprawdzanie integralności pliku w Pythonie",
   h:'<p>Dostawca publikuje skrót SHA-256 instalatora. Skrypt sprawdza, czy pobrany plik jest identyczny z oryginałem. To najprostsza praktyczna kontrola integralności.</p>'+
   '<pre><code>import hashlib\nimport hmac\nimport sys\n\n\ndef sha256_of(path: str, chunk: int = 65536) -&gt; str:\n    h = hashlib.sha256()\n    with open(path, "rb") as f:\n        while block := f.read(chunk):\n            h.update(block)\n    return h.hexdigest()\n\n\nif __name__ == "__main__":\n    path, expected = sys.argv[1], sys.argv[2].lower()\n    actual = sha256_of(path)\n    if hmac.compare_digest(actual, expected):\n        print("OK: plik zgodny z oryginałem")\n    else:\n        print("UWAGA: skrót się nie zgadza!", actual)\n        sys.exit(1)</code></pre>'+
   '<p>Uruchomienie: <code>python verify.py instalator.exe 9f86d0...</code>. Pamiętaj o ograniczeniu: skrót chroni przed uszkodzeniem i podmianą tylko wtedy, gdy samą wartość skrótu pobierasz z zaufanego, osobnego kanału. Przed atakującym, który podmienił i plik, i skrót na tej samej stronie, chroni dopiero podpis cyfrowy (lekcje 13 i 14).</p>'},
  {t:"Ćwiczenie: warstwy obrony małego sklepu internetowego",
   h:'<p>Sklep ma stronę WWW w chmurze, panel administracyjny, bazę zamówień i trzy osoby w biurze. Wypisz po jednym zabezpieczeniu na każdą warstwę z diagramu oraz wskaż, jaką właściwość CIA ono chroni.</p>'+
   '<details><summary>Przykładowa odpowiedź</summary><ul><li>Polityki i szkolenia: instrukcja „nie klikaj w faktury od nieznanych nadawców” (poufność, integralność).</li><li>Fizyczne: laptopy z szyfrowanym dyskiem i blokadą ekranu.</li><li>Perymetr: WAF przed sklepem (dostępność, integralność).</li><li>Sieć: panel admina dostępny tylko przez VPN lub z listy IP.</li><li>Host: automatyczne aktualizacje i EDR na laptopach.</li><li>Aplikacja: parametryzowane zapytania SQL, MFA w panelu.</li><li>Dane: szyfrowana baza i codzienny backup offline lub niezmienny (dostępność).</li></ul></details>'}
  ],
  quiz:[
  {q:"Pracownik zmienia kwotę na fakturze w systemie, a system nie zapisuje, kto i kiedy to zrobił. Która właściwość i która funkcja AAA zostały zawiedzione?",o:["Poufność i uwierzytelnianie","Integralność i rozliczalność","Dostępność i autoryzacja","Autentyczność i niezaprzeczalność tylko"],a:1,w:"Zmiana danych to naruszenie integralności, a brak śladu, kto jej dokonał, to brak rozliczalności (accounting)."},
  {q:"Serwer ma niezałataną podatność, ale nie jest wystawiony do internetu i nie ma żadnych znanych atakujących zainteresowanych firmą. Co najlepiej opisuje tę sytuację?",o:["Istnieje podatność, ryzyko jest niższe, ale niezerowe","Nie ma ryzyka, bo nie ma zagrożenia","Doszło do incydentu","To zagrożenie, a nie podatność"],a:0,w:"Podatność istnieje, więc ryzyko też, ale prawdopodobieństwo jest niskie. Ryzyko rzadko spada do zera, a jego ocena uwzględnia prawdopodobieństwo i wpływ."},
  {q:"Zarząd zatwierdza politykę zakazującą podłączania prywatnych nośników USB. Jak sklasyfikujesz to zabezpieczenie?",o:["Techniczne, naprawcze","Fizyczne, odstraszające","Zarządcze, dyrektywne","Operacyjne, wykrywające"],a:2,w:"Polityka to zabezpieczenie zarządcze (managerial) o charakterze dyrektywnym, bo nakazuje lub zakazuje określonych zachowań. Techniczne blokowanie portów USB byłoby osobnym zabezpieczeniem."},
  {q:"Które rozwiązanie najlepiej ilustruje zasadę defense in depth?",o:["Jeden bardzo drogi firewall nowej generacji","Firewall, segmentacja sieci, EDR na hostach, MFA i szyfrowanie danych","Dwa identyczne firewalle w tej samej konfiguracji","Szkolenie pracowników zamiast zabezpieczeń technicznych"],a:1,w:"Obrona warstwowa łączy różnorodne zabezpieczenia na różnych poziomach. Dwa identyczne urządzenia to w praktyce jedna warstwa, a jeden element nigdy nie wystarcza."},
  {q:"Podpis cyfrowy pod umową uniemożliwia sygnatariuszowi wiarygodne wyparcie się jej podpisania. Która właściwość jest tu zapewniona?",o:["Dostępność","Niezaprzeczalność","Poufność","Redundancja"],a:1,w:"Niezaprzeczalność (non-repudiation) oznacza, że autor nie może wiarygodnie zaprzeczyć wykonanej akcji. Podpis cyfrowy zapewnia też integralność i autentyczność."},
  {q:"Firma nie może załatać krytycznego, starego systemu produkcyjnego, więc izoluje go w osobnym segmencie sieci z ograniczonym ruchem. Jaki to typ zabezpieczenia?",o:["Kompensacyjne","Odstraszające","Wykrywające","Dyrektywne"],a:0,w:"Zabezpieczenie kompensacyjne zastępuje inne, niemożliwe do wdrożenia (tu: łatkę), obniżając ryzyko innym sposobem."}
  ]

LESSONS[2] = {
  lead:"Poznajesz przeciwnika: z czego składają się typowe ataki, jak działają i dlaczego dwa głośne incydenty, WannaCry i SolarWinds, uczą dwóch zupełnie różnych lekcji.",
  goals:["Odróżnić rodzaje złośliwego oprogramowania","Rozpoznać odmiany phishingu i techniki socjotechniczne","Opisać przebieg ataku ransomware i DDoS","Wyciągnąć wnioski obronne z incydentów WannaCry i SolarWinds"],
  intro:
'<h2>Malware: rodzaje i różnice</h2>'+
'<div class="tablewrap"><table><tr><th>Typ</th><th>Jak się rozprzestrzenia / działa</th><th>Cecha rozpoznawcza</th></tr>'+
'<tr><td>Wirus</td><td>Dołącza się do plików, wymaga uruchomienia przez użytkownika</td><td>Infekuje inne pliki</td></tr>'+
'<tr><td>Robak (worm)</td><td>Rozprzestrzenia się samodzielnie przez sieć</td><td>Brak interakcji użytkownika</td></tr>'+
'<tr><td>Trojan</td><td>Udaje legalny program</td><td>Użytkownik sam go instaluje</td></tr>'+
'<tr><td>Ransomware</td><td>Szyfruje dane (często też je kradnie) i żąda okupu</td><td>Notatka z żądaniem okupu</td></tr>'+
'<tr><td>Spyware / keylogger</td><td>Zbiera dane i naciśnięcia klawiszy</td><td>Działa po cichu</td></tr>'+
'<tr><td>Rootkit</td><td>Ukrywa swoją obecność na poziomie systemu</td><td>Trudny do wykrycia</td></tr>'+
'<tr><td>Botnet</td><td>Zainfekowane urządzenia sterowane centralnie (C2)</td><td>Używany m.in. do DDoS</td></tr>'+
'<tr><td>Bomba logiczna</td><td>Aktywuje się po spełnieniu warunku (data, zdarzenie)</td><td>Często dzieło insidera</td></tr>'+
'<tr><td>Fileless</td><td>Działa w pamięci, nadużywa narzędzi systemowych (PowerShell, WMI)</td><td>Brak pliku na dysku</td></tr></table></div>'+
'<h2>Socjotechnika i phishing</h2>'+
'<p>Socjotechnika atakuje decyzje człowieka, a nie system. Działa, bo odwołuje się do stałych mechanizmów psychologicznych: <b>autorytetu</b> („jestem z zarządu”), <b>pilności</b> („konto zostanie zablokowane”), <b>niedoboru</b>, <b>sympatii</b>, <b>zaufania do konsensusu</b> i <b>zobowiązania</b>.</p>'+
'<ul><li><b>Phishing</b>: masowa wiadomość podszywająca się pod zaufany podmiot.</li>'+
'<li><b>Spear phishing</b>: wiadomość skrojona pod konkretną osobę lub firmę.</li>'+
'<li><b>Whaling</b>: spear phishing wymierzony w kadrę zarządzającą.</li>'+
'<li><b>BEC</b> (Business Email Compromise): podszycie pod zarząd lub kontrahenta, by wymusić przelew lub zmianę numeru konta.</li>'+
'<li><b>Vishing</b> (głos) i <b>smishing</b> (SMS), <b>quishing</b> (złośliwy kod QR).</li>'+
'<li><b>Pretexting</b>: zmyślony scenariusz uzasadniający prośbę. <b>Tailgating</b>: wejście fizyczne „na ogonie” uprawnionej osoby.</li>'+
'<li><b>Watering hole</b>: zainfekowanie strony, którą regularnie odwiedza ofiara.</li></ul>'+
'<div class="callout"><strong>Wskazówka egzaminacyjna</strong>Gdy w scenariuszu pojawia się pilna prośba od „prezesa” o nietypowy przelew, odpowiedź to BEC lub whaling, a najlepsza kontrola to procedura weryfikacji drugim kanałem (oddzwonienie), a nie kolejne narzędzie techniczne.</div>'+
'<h2>DoS i DDoS</h2>'+
'<p>Atak na dostępność. <b>DDoS</b> pochodzi z wielu źródeł, zwykle z botnetu. Warianty: wolumetryczne (zalanie łącza), protokołowe (np. SYN flood wyczerpujący tablicę połączeń), aplikacyjne (zalew żądań HTTP do kosztownych endpointów). Ataki z <b>amplifikacją</b> (np. przez DNS lub NTP) wykorzystują serwery, które odpowiadają znacznie większym pakietem na małe, sfałszowane zapytanie. Obrona: filtrowanie u dostawcy (scrubbing), CDN, rate limiting, anycast i plan reagowania uzgodniony z operatorem.</p>'+
'<h2>Ransomware: przebieg ataku</h2>'+
'<ol><li><b>Wejście</b>: phishing, przejęte dane VPN/RDP, niezałatana podatność brzegowa.</li>'+
'<li><b>Utrwalenie i rozpoznanie</b>: konta, skanowanie sieci, wyszukiwanie backupów.</li>'+
'<li><b>Eskalacja i ruch boczny</b>: kradzież poświadczeń, przejęcie kontrolera domeny.</li>'+
'<li><b>Eksfiltracja</b>: kopiowanie danych do wymuszenia („podwójne wymuszenie”).</li>'+
'<li><b>Szyfrowanie</b>: zwykle poza godzinami pracy, po usunięciu kopii zapasowych.</li>'+
'<li><b>Żądanie okupu</b> i negocjacje.</li></ol>'+
'<p>Z tego wynika obrona: MFA na dostępie zdalnym, szybkie łatanie urządzeń brzegowych, segmentacja, ochrona kont uprzywilejowanych, monitoring i przede wszystkim <b>kopie zapasowe offline lub niezmienne</b>, regularnie testowane odtwarzaniem.</p>'+
'<h2>Modele opisu ataku</h2>'+
'<p><b>Cyber Kill Chain</b> dzieli atak na etapy liniowe (rekonesans, uzbrojenie, dostarczenie, wykorzystanie, instalacja, C2, działanie na celu). <b>MITRE ATT&amp;CK</b> to katalog taktyk i technik obserwowanych w prawdziwych atakach i dziś standardowy język zespołów SOC. Obrońca używa ich, by pytać: „na którym etapie mogliśmy to zatrzymać lub wykryć?”.</p>'+
'<h2>Dwa przypadki, dwie lekcje</h2>'+
'<h3>WannaCry (maj 2017)</h3>'+
'<p>Robak ransomware wykorzystał podatność w protokole SMB w systemach Windows (exploit EternalBlue, łatka MS17-010 była dostępna od marca tego samego roku). Rozprzestrzeniał się samodzielnie przez sieci, uderzył w setki tysięcy komputerów w około 150 krajach, w tym w szpitale brytyjskiej służby zdrowia. Zatrzymało go w dużej mierze odkrycie i zarejestrowanie domeny, której malware szukał przed szyfrowaniem (tzw. kill switch). <b>Lekcje:</b> zarządzanie łatkami, nieeksponowanie SMB do internetu, segmentacja, inwentaryzacja systemów legacy.</p>'+
'<h3>SolarWinds (ujawniony w grudniu 2020)</h3>'+
'<p>Atakujący włamali się do środowiska budowania oprogramowania Orion i umieścili backdoor (SUNBURST) w legalnej, podpisanej aktualizacji. Pobrało ją kilkanaście tysięcy klientów, ale prawdziwych celów wybrano znacznie mniej i atakowano je ręcznie. Wykrycie zawdzięczamy firmie FireEye, która zauważyła włamanie do własnych zasobów. <b>Lekcje:</b> zaufanie do dostawcy nie jest kontrolą bezpieczeństwa, potrzebne jest zarządzanie ryzykiem łańcucha dostaw, monitoring ruchu wychodzącego, ograniczanie uprawnień oprogramowania zarządzającego i zabezpieczenie własnych pipeline’ów CI/CD.</p>'+
'<div class="tablewrap"><table><tr><th></th><th>WannaCry</th><th>SolarWinds</th></tr><tr><td>Charakter</td><td>Masowy, głośny, destrukcyjny</td><td>Celowany, cichy, szpiegowski</td></tr><tr><td>Wektor</td><td>Podatność SMB, samorozprzestrzenianie</td><td>Skompromitowana aktualizacja dostawcy</td></tr><tr><td>Główna obrona</td><td>Łatanie, segmentacja</td><td>Zarządzanie ryzykiem dostawców, detekcja</td></tr></table></div>',
  ex:[
  {t:"Przykład 1: anatomia wiadomości phishingowej",
   h:'<p>Przeanalizuj treść:</p>'+
   '<pre><code>Od:      "Dział HR" &lt;hr@firma-portal-kadry.com&gt;\nTemat:   PILNE: zmiana warunków wynagrodzenia - potwierdź do 16:00\nTreść:   Zaloguj się, aby zobaczyć nowy aneks do umowy:\n         https://firma-portal-kadry.com/login?id=48213</code></pre>'+
   '<details><summary>Pokaż sygnały ostrzegawcze</summary><ul><li>Domena nadawcy różni się od domeny firmy.</li><li>Presja czasu („do 16:00”) i temat dotyczący pieniędzy.</li><li>Prośba o logowanie przez link zamiast przez znaną ścieżkę (intranet, zakładka).</li><li>Nadawca anonimowy („Dział HR”), brak imienia i nazwiska.</li></ul><p>Właściwa reakcja: nie klikać, zgłosić wiadomość przyciskiem „Zgłoś phishing” lub do zespołu bezpieczeństwa, a w razie wątpliwości zweryfikować inną drogą.</p></details>'},
  {t:"Przykład 2: prosta ocena podejrzanego adresu URL w Pythonie",
   h:'<p>Skrypt nie zastępuje bramy pocztowej, ale pokazuje, jak automatyzować pierwszy filtr, np. w przepływie n8n, który ocenia linki ze zgłoszonych wiadomości.</p>'+
   '<pre><code>import re\nfrom urllib.parse import urlparse\n\n\ndef score_url(url: str):\n    u = urlparse(url)\n    host = u.hostname or ""\n    points, reasons = 0, []\n\n    if u.scheme != "https":\n        points += 1; reasons.append("brak HTTPS")\n    if re.fullmatch(r"\\d{1,3}(\\.\\d{1,3}){3}", host):\n        points += 2; reasons.append("adres IP zamiast domeny")\n    if "xn--" in host:\n        points += 2; reasons.append("punycode (możliwy homoglif)")\n    if host.count(".") &gt;= 4:\n        points += 1; reasons.append("bardzo wiele subdomen")\n    if "@" in url:\n        points += 2; reasons.append("znak @ w adresie")\n    if re.search(r"(login|verify|secure|update)", host):\n        points += 1; reasons.append("słowa typowe dla phishingu w domenie")\n    return points, reasons\n\n\nprint(score_url("http://203.0.113.7/secure-login"))\n# (3, [\'brak HTTPS\', \'adres IP zamiast domeny\'])</code></pre>'+
   '<div class="callout warn"><strong>Ograniczenia</strong>Heurystyki dają fałszywe alarmy i da się je ominąć. W praktyce łączy się je z reputacją domeny, analizą w piaskownicy i przede wszystkim z decyzją człowieka na końcu.</div>'},
  {t:"Przykład 3: scenariusz ransomware, gdzie mogliśmy przerwać atak?",
   h:'<p>W poniedziałek rano pracownicy widzą zaszyfrowane pliki. Analiza pokazuje: w piątek wieczorem zalogowano się przez VPN na konto kontraktora bez MFA, w sobotę z tego konta uruchomiono skanowanie sieci, w niedzielę w nocy skopiowano 200 GB na zewnętrzny serwer, a przed szyfrowaniem usunięto kopie zapasowe na serwerze backupu dostępnym z domeny.</p>'+
   '<details><summary>Pokaż punkty przerwania i wykrycia</summary><ul><li><b>Wejście</b>: MFA na VPN, przegląd kont kontraktorów (zapobiegawcze).</li><li><b>Rozpoznanie</b>: alert IDS na skanowanie z konta kontraktora (wykrywające).</li><li><b>Eksfiltracja</b>: monitoring dużych transferów wychodzących, filtrowanie wyjścia (wykrywające i zapobiegawcze).</li><li><b>Backup</b>: kopia offline lub niezmienna, serwer backupu poza domeną (naprawcze).</li><li><b>Reagowanie</b>: procedura IR i kontakt do zespołu dyżurnego w weekend.</li></ul></details>'}
  ],
  quiz:[
  {q:"Które złośliwe oprogramowanie rozprzestrzenia się samodzielnie przez sieć, bez udziału użytkownika?",o:["Trojan","Wirus","Robak","Keylogger"],a:2,w:"Robak (worm) samodzielnie się replikuje i propaguje przez sieć. Wirus wymaga uruchomienia nosiciela, a trojan jest instalowany przez użytkownika, bo udaje legalny program."},
  {q:"Księgowa dostaje e-mail wyglądający na wiadomość od prezesa z pilną prośbą o przelew na nowy rachunek kontrahenta. Co to jest i co najlepiej temu zapobiega?",o:["Phishing masowy; filtr antyspamowy","BEC/whaling; weryfikacja prośby innym kanałem i procedura zatwierdzania przelewów","Vishing; blokada portu 25","Watering hole; aktualizacja przeglądarki"],a:1,w:"To Business Email Compromise z elementem whalingu. Technika trafia w proces, więc najskuteczniejsza jest procedura (dwuosobowe zatwierdzanie, oddzwonienie na znany numer)."},
  {q:"Atakujący wysyła niewielkie, sfałszowane zapytania do publicznych serwerów DNS, które odsyłają znacznie większe odpowiedzi na adres ofiary. Jak nazywa się ta technika?",o:["SQL injection","Amplifikacja w ataku DDoS","Ruch boczny","Pretexting"],a:1,w:"To DDoS z amplifikacją (reflection/amplification): fałszowany adres źródłowy i duży współczynnik wzmocnienia odpowiedzi."},
  {q:"Co jest najważniejszą lekcją z ataku SolarWinds?",o:["Należy usunąć wszystkie podpisy cyfrowe","Zaufanie do dostawcy i podpisanej aktualizacji nie zastępuje zarządzania ryzykiem łańcucha dostaw i monitoringu","Wystarczy aktualizować oprogramowanie jak najszybciej","Ataki dotyczą tylko firm technologicznych"],a:1,w:"Złośliwy kod dotarł w legalnej, podpisanej aktualizacji. Obrona wymaga oceny dostawców, ograniczania uprawnień oprogramowania zarządzającego oraz monitoringu, np. ruchu wychodzącego."},

LESSONS[3] = {
  lead:"Prawie każdy atak kończy się pytaniem: z jakimi uprawnieniami działa napastnik? Ta lekcja uczy zarządzać kontami i prawami dostępu w Windows i Linuksie tak, by odpowiedź brzmiała „z jak najmniejszymi”.",
  goals:["Opisać model kont i grup w Windows i Linuksie","Odczytać i ustawić uprawnienia plików (NTFS, chmod)","Zastosować zasadę najmniejszych uprawnień","Wskazać typowe błędy konfiguracyjne prowadzące do eskalacji uprawnień"],
  intro:
'<h2>Dlaczego uprawnienia są fundamentem</h2>'+
'<p>System operacyjny mediuje między programami a zasobami. Każdy proces działa w imieniu jakiegoś konta i dziedziczy jego prawa. Złośliwy dokument otwarty przez zwykłego użytkownika ma jego uprawnienia, a ten sam dokument otwarty przez administratora ma pełną władzę nad maszyną. Dlatego rozdzielamy konta codzienne od administracyjnych.</p>'+
'<div class="callout"><strong>Najmniejsze uprawnienia (least privilege)</strong>Każde konto, usługa i proces dostają wyłącznie prawa potrzebne do wykonania zadania i tylko na czas jego wykonywania.</div>'+
'<h2>Windows: konta, grupy, UAC</h2>'+
'<ul><li><b>SID</b>: unikalny identyfikator konta lub grupy. Uprawnienia przypisuje się do SID, nie do nazwy.</li>'+
'<li><b>Konta lokalne</b> (przechowywane w bazie SAM na maszynie) i <b>domenowe</b> (Active Directory, zarządzane centralnie).</li>'+
'<li><b>Grupy wbudowane</b>: Administrators, Users, Remote Desktop Users. W domenie m.in. Domain Admins, które należy trzymać możliwie pustą.</li>'+
'<li><b>UAC</b> (User Account Control): nawet administrator pracuje domyślnie z ograniczonym tokenem i potwierdza operacje wymagające podniesienia uprawnień.</li>'+
'<li><b>Konta usługowe</b>: dla aplikacji. Najlepsze są zarządzane konta usługowe (gMSA) z automatyczną rotacją hasła.</li></ul>'+
'<h3>Uprawnienia NTFS</h3>'+
'<p>Każdy plik i folder ma listę ACL z wpisami ACE (kto, co wolno lub zabroniono). Podstawowe poziomy: <i>Read</i>, <i>Read &amp; Execute</i>, <i>Modify</i>, <i>Full Control</i>. Uprawnienia się <b>dziedziczą</b> z folderu nadrzędnego, a jawny zakaz (Deny) wygrywa z zezwoleniem. Efektywne prawa użytkownika to suma praw z jego grup, z uwzględnieniem zakazów. Dobra praktyka: przypisuj prawa grupom (model AGDLP: konta → grupy globalne → grupy lokalne domeny → uprawnienia), nie pojedynczym osobom.</p>'+
'<h2>Linux: użytkownicy, grupy, rwx</h2>'+
'<ul><li><b>UID/GID</b>: numeryczne identyfikatory. <code>root</code> ma UID 0 i pełną władzę.</li>'+
'<li><code>/etc/passwd</code> (publicznie czytelna lista kont), <code>/etc/shadow</code> (skróty haseł, dostęp tylko dla roota), <code>/etc/group</code>.</li>'+
'<li><b>sudo</b>: kontrolowane podnoszenie uprawnień z logowaniem, konfigurowane w <code>/etc/sudoers</code>. Lepiej niż praca na root.</li></ul>'+
'<h3>Odczyt uprawnień</h3>'+
'<pre><code>$ ls -l raport.txt\n-rw-r----- 1 anna finanse 2048 paź  9 10:12 raport.txt\n  │└┬┘└┬┘└┬┘\n  │ │  │  └ pozostali: brak praw\n  │ │  └ grupa (finanse): r-- = odczyt\n  │ └ właściciel (anna): rw- = odczyt i zapis\n  └ typ: - plik, d katalog, l link</code></pre>'+
'<p>Zapis ósemkowy: r=4, w=2, x=1. Zatem <code>rw-r-----</code> to <code>640</code>.</p>'+
'<h3>Bity specjalne i umask</h3>'+
'<ul><li><b>setuid</b> (4000): program uruchamia się z prawami właściciela pliku, np. <code>passwd</code>. Źle skonfigurowany plik setuid root to klasyczna droga do eskalacji.</li>'+
'<li><b>setgid</b> (2000) i <b>sticky bit</b> (1000, np. <code>/tmp</code>: usuwać pliki może tylko ich właściciel).</li>'+
'<li><b>umask</b>: maska odejmowana od domyślnych uprawnień nowych plików. Typowe 022 daje pliki 644, a bezpieczniejsze 027 daje 640.</li></ul>'+
'<h2>Typowe błędy prowadzące do eskalacji</h2>'+
'<ul><li>Praca codzienna na koncie administratora i ominięcie UAC.</li>'+
'<li>Pliki i skrypty zapisywalne przez wszystkich (<code>chmod 777</code>), zwłaszcza uruchamiane z uprawnieniami roota lub przez harmonogram.</li>'+
'<li>Konta usługowe z uprawnieniami Domain Admin „bo tak działa”.</li>'+
'<li>Współdzielone konta administracyjne bez rozliczalności.</li>'+
'<li>Niezmienione konta domyślne i hasła, nieusunięte konta byłych pracowników.</li>'+
'<li>Zbyt szerokie wpisy w sudoers, np. dostęp do edytora lub powłoki przez sudo bez ograniczeń.</li></ul>',
  ex:[
  {t:"Przykład 1: uprawnienia w Linuksie krok po kroku",
   h:'<p>Folder zespołu finansów ma być czytelny i zapisywalny dla grupy <code>finanse</code>, a niedostępny dla reszty.</p>'+
   '<pre><code>sudo groupadd finanse\nsudo usermod -aG finanse anna\n\nsudo mkdir /srv/finanse\nsudo chown root:finanse /srv/finanse\nsudo chmod 2770 /srv/finanse    # setgid: nowe pliki dziedziczą grupę\n\nls -ld /srv/finanse\n# drwxrws--- 2 root finanse 4096 ... /srv/finanse</code></pre>'+
   '<p>Zwróć uwagę na <code>s</code> w uprawnieniach grupy (setgid) i brak jakichkolwiek praw dla „pozostałych”.</p>'},
  {t:"Przykład 2: uprawnienia NTFS przez icacls",
   h:'<pre><code>:: pokaż uprawnienia\nicacls D:\\Finanse\n\n:: wyłącz dziedziczenie i skopiuj istniejące wpisy\nicacls D:\\Finanse /inheritance:d\n\n:: usuń grupę Users\nicacls D:\\Finanse /remove "Users"\n\n:: nadaj grupie FIRMA\\Finanse prawo modyfikacji (z dziedziczeniem na podobiekty)\nicacls D:\\Finanse /grant "FIRMA\\Finanse:(OI)(CI)M"</code></pre>'+
   '<p><code>(OI)</code> i <code>(CI)</code> oznaczają dziedziczenie na pliki i podfoldery, <code>M</code> to Modify. Nadajemy prawa grupie, nie osobie, więc zmiana składu zespołu nie wymaga edycji ACL.</p>'},
  {t:"Przykład 3: audyt plików zapisywalnych przez wszystkich (Python)",
   h:'<p>Szybka kontrola higieny uprawnień na serwerze Linux.</p>'+
   '<pre><code>import os\nimport stat\n\n\ndef world_writable(root: str):\n    for dirpath, _dirs, files in os.walk(root):\n        for name in files:\n            path = os.path.join(dirpath, name)\n            try:\n                mode = os.lstat(path).st_mode\n            except OSError:\n                continue\n            if stat.S_ISREG(mode) and mode &amp; stat.S_IWOTH:\n                yield path\n\n\nfor p in world_writable("/opt/aplikacja"):\n    print("do sprawdzenia:", p)</code></pre>'+
   '<p>Użyto <code>lstat</code>, żeby nie podążać za dowiązaniami symbolicznymi. Wynik to lista kandydatów do przeglądu, a nie automatyczny wyrok: niektóre pliki (np. w katalogach tymczasowych) bywają zapisywalne celowo.</p>'},
  {t:"Ćwiczenie: oceń konfigurację",
   h:'<p>W audycie znalazłeś: (a) skrypt backupu <code>/opt/backup.sh</code> z prawami <code>777</code>, uruchamiany co noc z crona jako root; (b) konto usługowe aplikacji CRM w grupie Domain Admins; (c) wspólne konto „admin” używane przez cztery osoby. Opisz ryzyko każdego znaleziska i propozycję poprawki.</p>'+
   '<details><summary>Przykładowa odpowiedź</summary><ul><li><b>(a)</b> Każdy użytkownik może zmienić skrypt wykonywany jako root, co daje trywialną eskalację do roota. Poprawka: właściciel root, <code>chmod 750</code> lub <code>700</code>, monitorowanie zmian.</li><li><b>(b)</b> Przejęcie aplikacji oznacza przejęcie domeny. Poprawka: dedykowane konto usługowe (najlepiej gMSA) z minimalnymi prawami do potrzebnych zasobów.</li><li><b>(c)</b> Brak rozliczalności. Poprawka: imienne konta, uprawnienia przez grupy i sudo, a dla kont uprzywilejowanych sejf haseł (PAM) i MFA.</li></ul></details>'}
  ],
  quiz:[
  {q:"Plik ma uprawnienia 640. Co mogą zrobić jego właściciel, członkowie grupy i pozostali użytkownicy?",o:["Właściciel: odczyt i zapis; grupa: odczyt; pozostali: nic","Właściciel: wszystko; grupa: zapis; pozostali: odczyt","Wszyscy: odczyt","Właściciel: odczyt; grupa: odczyt i zapis; pozostali: nic"],a:0,w:"6 = rw- (właściciel), 4 = r-- (grupa), 0 = --- (pozostali)."},
  {q:"Użytkownik należy do dwóch grup. Jedna ma w NTFS zezwolenie Modify do folderu, druga jawny zakaz Deny Write. Jaki jest efekt dla zapisu?",o:["Zapis jest dozwolony, bo Modify obejmuje zapis","Zapis jest zabroniony, bo jawny Deny ma pierwszeństwo","Decyduje kolejność grup w profilu","Zapis dozwolony tylko w trybie UAC"],a:1,w:"W NTFS jawne odmowy (Deny) mają pierwszeństwo przed zezwoleniami (Allow)."},
  {q:"Która praktyka najlepiej realizuje zasadę najmniejszych uprawnień dla administratora IT?",o:["Jedno konto z uprawnieniami domain admina do wszystkiego","Osobne konto zwykłe do pracy codziennej i osobne administracyjne do zadań wymagających podniesienia uprawnień","Dodanie wszystkich administratorów do grupy Everyone","Współdzielenie hasła admina w zespole"],a:1,w:"Rozdzielenie kont zmniejsza ekspozycję: phishing czy malware w sesji codziennej nie dostaje praw administratora."},
  {q:"Co oznacza ustawienie bitu setuid na pliku wykonywalnym należącym do roota?",o:["Plik może być usunięty tylko przez właściciela","Program uruchamia się z uprawnieniami właściciela pliku (root), a nie uruchamiającego","Plik jest automatycznie szyfrowany","Nowe pliki dziedziczą grupę katalogu"],a:1,w:"Setuid powoduje, że proces działa z efektywnym UID właściciela pliku. Błędnie ustawiony na podatnym programie staje się drogą do eskalacji uprawnień. Dziedziczenie grupy to setgid, a ograniczenie usuwania to sticky bit."},
  {q:"Aplikacja korzysta z konta usługowego z hasłem, którego nikt nie zmienił od lat. Jakie rozwiązanie w środowisku Active Directory jest najlepsze?",o:["Wpisanie hasła w skrypcie dla wygody","Zarządzane konto usługowe (gMSA) z automatyczną rotacją hasła","Przypisanie konta do grupy Domain Admins","Wyłączenie wymagań złożoności hasła"],a:1,w:"gMSA automatycznie zmienia i przechowuje złożone hasło, więc eliminuje stare, współdzielone i wklejane w kodzie hasła usług."},
  {q:"Skrypt uruchamiany co noc z crona jako root jest zapisywalny przez wszystkich użytkowników (chmod 777). Jakie to ryzyko?",o:["Skrypt będzie działał wolniej","Dowolny użytkownik może wstrzyknąć polecenia wykonane jako root","Cron przestanie działać","Brak ryzyka, jeśli skrypt jest krótki"],a:1,w:"Zapisywalny skrypt uruchamiany z wysokimi uprawnieniami to klasyczna eskalacja uprawnień: napastnik modyfikuje skrypt i czeka na uruchomienie."}
  ]
};

LESSONS[4] = {
  lead:"Host to miejsce, gdzie atak zwykle się rozstrzyga: tam działają użytkownicy, aplikacje i dane. Uczysz się budować bezpieczną konfigurację bazową i utrzymywać ją w czasie.",
  goals:["Wyjaśnić, czym jest hardening i bezpieczna konfiguracja bazowa","Skonfigurować politykę haseł i blokadę konta w Group Policy","Odróżnić aktualizacje od łatek i opisać proces zarządzania łatkami","Dobrać poziom szyfrowania danych do scenariusza"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+ (SY0-701)</strong>Cele 2.5 (techniki ograniczające ryzyko), 4.1 (techniki bezpieczeństwa dla zasobów obliczeniowych) i 4.5 (modyfikacje możliwości przedsiębiorstwa).</div>'+
'<h2>Hardening: zmniejszanie powierzchni ataku</h2>'+
'<p>Hardening to proces wzmacniania systemu przez usuwanie tego, co niepotrzebne, i zaostrzanie tego, co zostaje. Każda otwarta usługa, port, konto i program to element <b>powierzchni ataku</b>. Mniej elementów oznacza mniej miejsc do wykorzystania i mniej do monitorowania.</p>'+
'<div class="tablewrap"><table><tr><th>Obszar</th><th>Co robimy</th></tr>'+
'<tr><td>Konfiguracje domyślne</td><td>Zmieniamy domyślne hasła i konta, zamykamy zbędne porty, zastępujemy protokoły niezaszyfrowane bezpiecznymi (Telnet na SSH, HTTP na HTTPS)</td></tr>'+
'<tr><td>Zbędne usługi</td><td>Identyfikujemy i wyłączamy usługi, których serwer nie potrzebuje do swojej roli</td></tr>'+
'<tr><td>Ograniczanie aplikacji</td><td><b>Allow list</b> (dozwolone tylko zatwierdzone programy, domyślna odmowa) lub block list (blokujemy znane złe). Allow list jest bezpieczniejsza, ale wymaga utrzymania</td></tr>'+
'<tr><td>Aktualizacje i łatki</td><td>Systematyczny proces zarządzania łatkami</td></tr>'+
'<tr><td>Szyfrowanie</td><td>Dane w spoczynku chronione na odpowiednim poziomie</td></tr>'+
'<tr><td>Konta i uprawnienia</td><td>Najmniejsze uprawnienia, osobne konto administracyjne, wyłączone konta gościa</td></tr></table></div>'+
'<div class="callout warn"><strong>Pułapka domyślnych haseł</strong>Domyślne dane logowania routerów, kamer i punktów dostępowych są publicznie znane. Zmiana domyślnego hasła przy pierwszym uruchomieniu to pierwsza czynność po zakupie urządzenia. Hasła do urządzeń i usług przechowuj w menedżerze haseł.</div>'+
'<h2>Polityka haseł w Group Policy</h2>'+
'<p>Group Policy (GPO) pozwala ustawić politykę raz i rozesłać ją na tysiące komputerów w domenie. To ogranicza błędy konfiguracji i pracę administratorów. Do polityki haseł należą:</p>'+
'<div class="tablewrap"><table><tr><th>Ustawienie</th><th>Co robi</th></tr>'+
'<tr><td>Enforce password history</td><td>Zapamiętuje poprzednie hasła, żeby nie dało się ich użyć ponownie (do 24). Na egzaminie: <i>password reuse</i> to ta sama idea dla innych produktów</td></tr>'+
'<tr><td>Maximum password age</td><td>Po ilu dniach hasło musi zostać zmienione (domyślnie 42)</td></tr>'+
'<tr><td>Minimum password age</td><td>Przez ile dni nie można zmienić hasła ponownie. Zapobiega wielokrotnej zmianie, by wrócić do starego hasła</td></tr>'+
'<tr><td>Complexity</td><td>Wymaga znaków z co najmniej trzech z czterech grup: małe litery, wielkie litery, cyfry, znaki specjalne</td></tr>'+
'<tr><td>Account lockout threshold</td><td>Po ilu błędnych próbach konto jest blokowane. Ogranicza zgadywanie haseł</td></tr></table></div>'+
'<div class="callout"><strong>Uwaga praktyczna</strong>Złożoność nie równa się siła: hasło P@$$w0rd spełnia wymagania, ale łamacze haseł znają takie podstawienia i złamią je błyskawicznie. Współczesne zalecenia (np. NIST SP 800-63B) stawiają na długość, sprawdzanie haseł z list wycieków i MFA, a krytykują wymuszanie zmian bez powodu. Na egzaminie i w audytach nadal jednak spotkasz limity wieku haseł, więc znaj obie perspektywy.</div>'+
'<h2>Aktualizacje a łatki</h2>'+
'<p><b>Łatka</b> (patch) naprawia konkretną wadę lub podatność. <b>Aktualizacja</b> (update) bywa szersza i może dodawać funkcje. Proces zarządzania łatkami:</p>'+
'<ol><li><b>Inwentaryzacja</b>: nie załatasz tego, o czym nie wiesz.</li><li><b>Ocena</b>: krytyczność podatności i ekspozycja systemu.</li><li><b>Test</b> na środowisku testowym lub grupie pilotażowej.</li><li><b>Wdrożenie</b> w oknie serwisowym, z planem wycofania.</li><li><b>Weryfikacja</b>: skan potwierdza, że łatka działa.</li><li><b>Wyjątki</b>: systemy, których nie da się załatać, dostają zabezpieczenia kompensacyjne (np. izolację).</li></ol>'+
'<h2>Kontrola dostępu w systemie: DAC i MAC</h2>'+
'<p>W standardowym modelu <b>DAC</b> właściciel pliku decyduje, kto ma dostęp. W modelu <b>MAC</b> o dostępie decyduje polityka systemu na podstawie etykiet i właściciel nie może jej obejść. W Linuksie MAC realizuje <b>SELinux</b> (tryby: enforcing, permissive, disabled). <b>Trusted OS</b> to system ocenony i certyfikowany pod kątem takich mechanizmów.</p>'+
'<h2>Szyfrowanie danych: poziomy</h2>'+
'<div class="tablewrap"><table><tr><th>Poziom</th><th>Chroni</th><th>Typowy scenariusz</th></tr>'+
'<tr><td>Dysk (full-disk)</td><td>Cały dysk, w tym system</td><td>Utrata lub kradzież laptopa (BitLocker, LUKS)</td></tr>'+
'<tr><td>Partycja / wolumen</td><td>Wybrany fragment dysku</td><td>Osobny wolumen z danymi</td></tr>'+
'<tr><td>Plik</td><td>Pojedyncze dokumenty</td><td>Wysyłka wrażliwego załącznika</td></tr>'+
'<tr><td>Baza danych</td><td>Całą bazę (np. TDE)</td><td>Kradzież plików bazy lub backupu</td></tr>'+
'<tr><td>Rekord / kolumna</td><td>Wybrane pola, np. numery kart</td><td>Ochrona danych także przed administratorem bazy</td></tr></table></div>'+
'<p>Szyfrowanie dysku chroni wtedy, gdy urządzenie jest wyłączone lub zgubione. Gdy system działa i użytkownik jest zalogowany, dane są odszyfrowane, więc nie chroni przed malware.</p>'+
'<h2>Secure baseline</h2>'+
'<p>Bezpieczna konfiguracja bazowa to udokumentowany, uzgodniony punkt wyjścia dla każdego typu systemu. Tworzysz ją na bazie wzorców (np. CIS Benchmarks), wdrażasz przez obrazy i GPO, a potem <b>mierzysz odchylenia</b> (configuration drift) i je korygujesz.</p>',
  ex:[
  {t:"Przykład 1: polityka haseł w GPO (ćwiczenie)",
   h:'<p>Wymagania: użytkownik nie może wracać do ostatnich 12 haseł, nie może zmienić hasła częściej niż co 3 dni, hasła muszą być złożone, a po pięciu błędnych próbach logowania konto ma być blokowane.</p>'+
   '<ol><li>Na kontrolerze domeny otwórz Group Policy Management i edytuj <i>Default Domain Policy</i> (lokalnie: <code>gpedit.msc</code>).</li><li>Computer Configuration, potem Windows Settings, potem Security Settings, potem Account Policies.</li><li>Password Policy: <i>Enforce password history</i> = 12, <i>Minimum password age</i> = 3 dni, <i>Password must meet complexity requirements</i> = Enabled.</li><li>Account Lockout Policy: <i>Account lockout threshold</i> = 5.</li><li>Sprawdź zastosowanie polityki poleceniem <code>gpresult /r</code> na stacji roboczej.</li></ol>'+
   '<div class="callout">Zauważ, że blokada po pięciu próbach zatrzymuje atak brute force na jedno konto, ale nie password spraying (kilka popularnych haseł na wielu kontach). Przed tym chroni MFA i monitoring nieudanych logowań.</div>'},
  {t:"Przykład 2: przegląd usług i portów w Linuksie",
   h:'<pre><code># które porty nasłuchują i jaki proces je otworzył\nsudo ss -tulpn\n\n# usługi uruchamiane przy starcie\nsystemctl list-unit-files --state=enabled\n\n# wyłączenie zbędnej usługi (np. serwer FTP na maszynie, która go nie potrzebuje)\nsudo systemctl disable --now vsftpd\n\n# status SELinux\ngetenforce            # Enforcing / Permissive / Disabled\nsudo setenforce 1     # tymczasowo włącz tryb enforcing</code></pre>'+
   '<p>Wniosek ćwiczenia: dla każdego nasłuchującego portu powinieneś umieć powiedzieć, <i>dlaczego</i> istnieje. Jeśli nie umiesz, to kandydat do wyłączenia.</p>'},
  {t:"Przykład 3: porównanie otwartych portów z linią bazową (Python)",
   h:'<pre><code>import subprocess\n\nALLOWED = {22, 443}   # port z linii bazowej serwera WWW\n\nout = subprocess.run(\n    ["ss", "-H", "-tln"], capture_output=True, text=True, check=True\n).stdout\n\nfor line in out.splitlines():\n    local = line.split()[3]              # np. 0.0.0.0:8080\n    port = int(local.rsplit(":", 1)[1])\n    if port not in ALLOWED:\n        print("Nieoczekiwany port nasłuchujący:", local)</code></pre>'+
   '<p>To zalążek kontroli odchyleń od bazy. W produkcji uruchamiasz go cyklicznie (np. w n8n lub harmonogramem) i wysyłasz alert, gdy pojawi się nieoczekiwany port.</p>'}
  ],
  quiz:[
  {q:"Kupiłeś nowy punkt dostępowy Wi-Fi do biura. Co robisz w pierwszej kolejności?",o:["Zostawiasz ustawienia fabryczne, bo są zoptymalizowane","Zmieniasz domyślne dane administratora","Włączasz WPS dla wygody","Wyłączasz logowanie"],a:1,w:"Domyślne dane logowania są publicznie znane. Ich zmiana to pierwsza czynność hardeningu urządzenia."},
  {q:"Które ustawienie Group Policy uniemożliwia użytkownikowi powrót do niedawno używanego hasła?",o:["Maximum password age","Account lockout threshold","Enforce password history","Minimum password length"],a:2,w:"Enforce password history (na egzaminie też: password reuse) zapamiętuje poprzednie hasła i blokuje ich ponowne użycie."},
  {q:"Pracownik zgubił służbowy laptop z danymi klientów. Które zabezpieczenie najlepiej chroni dane na zgubionym urządzeniu?",o:["Hasło do konta Windows","Szyfrowanie całego dysku","Szyfrowanie tylko wybranych dokumentów","System DLP"],a:1,w:"Full-disk encryption chroni cały dysk, także pliki tymczasowe i system. Samo hasło do konta nie zabezpiecza danych przy podłączeniu dysku do innego komputera."},
  {q:"Utwardzasz publiczny serwer WWW. Które działanie najlepiej zmniejsza powierzchnię ataku?",o:["Włączenie konta gościa","Dopuszczenie dostępu z dowolnego adresu IP","Wyłączenie zbędnych usług i zamknięcie nieużywanych portów","Pozostawienie domyślnego hasła roota"],a:2,w:"Mniej uruchomionych usług i otwartych portów oznacza mniej elementów, które można zaatakować."},
  {q:"Czym SELinux różni się od klasycznych uprawnień rwx?",o:["Szyfruje pliki","Wymusza politykę systemową niezależnie od woli właściciela pliku (MAC)","Zastępuje firewall","Działa tylko w Windows"],a:1,w:"SELinux realizuje Mandatory Access Control: politykę narzuca system, a właściciel zasobu nie może jej obejść. Klasyczne rwx to DAC."},
  {q:"Dlaczego allow list aplikacji jest bezpieczniejsza niż block list?",o:["Bo jest łatwiejsza w utrzymaniu","Bo domyślnie blokuje wszystko, co nie zostało jawnie zatwierdzone","Bo działa tylko na serwerach","Bo nie wymaga żadnej konfiguracji"],a:1,w:"Allow list działa w modelu domyślnej odmowy, więc nowe, nieznane malware nie uruchomi się. Block list zatrzymuje tylko to, co już zna."}
