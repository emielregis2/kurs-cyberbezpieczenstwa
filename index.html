LESSONS[16] = {
  lead:"Cyberbezpieczeństwo nie polega na usunięciu wszystkich zagrożeń, tylko na świadomym zarządzaniu tym, co może nam zaszkodzić. Zarząd rozumie język ryzyka i pieniędzy, więc ta lekcja uczy, jak przełożyć techniczne słabości na decyzje biznesowe.",
  goals:["Przeprowadzić proces oceny ryzyka od identyfikacji aktywów do postępowania z ryzykiem","Ocenić ryzyko jakościowo (macierz 5×5) i ilościowo (SLE, ARO, ALE, ROSI)","Wybrać i udokumentować reakcję: unikanie, redukcja, transfer lub akceptacja","Powiązać zarządzanie ryzykiem z wymaganiami RODO i ustawy o KSC (NIS2)"],
  intro:
'<div class="callout"><strong>Stan prawny na 9 października 2026 r.</strong>Fragmenty o prawie polskim opisują obowiązujące przepisy w zarysie i mają charakter edukacyjny, a nie porady prawnej. Szczegóły sprawdzaj w tekście aktów i u prawnika.</div>'+
'<div class="callout"><strong>Powiązanie z Security+</strong>Domena 5 (zarządzanie programem bezpieczeństwa): ocena ryzyka, rodzaje analizy, reakcje na ryzyko, rejestr ryzyka, BIA, ryzyko dostawców.</div>'+
'<h2>Terminologia</h2>'+
'<div class="tablewrap"><table><tr><th>Pojęcie</th><th>Znaczenie</th></tr>'+
'<tr><td>Ryzyko nieodłączne (inherent)</td><td>Ryzyko bez żadnych zabezpieczeń</td></tr>'+
'<tr><td>Ryzyko rezydualne (residual)</td><td>Ryzyko, które zostaje po wdrożeniu zabezpieczeń</td></tr>'+
'<tr><td>Ryzyko docelowe</td><td>Poziom, do którego organizacja chce dojść</td></tr>'+
'<tr><td>Apetyt na ryzyko</td><td>Ogólna gotowość organizacji do podejmowania ryzyka dla celów biznesowych</td></tr>'+
'<tr><td>Tolerancja na ryzyko</td><td>Dopuszczalne odchylenie od apetytu, konkretne progi</td></tr>'+
'<tr><td>Właściciel ryzyka</td><td>Osoba z uprawnieniami i odpowiedzialnością za decyzję o ryzyku (zwykle właściciel procesu biznesowego, nie administrator IT)</td></tr></table></div>'+
'<h2>Proces zarządzania ryzykiem</h2>'+
'<ol><li><b>Ustalenie kontekstu</b>: cele biznesowe, zakres, kryteria oceny, zobowiązania prawne.</li>'+
'<li><b>Identyfikacja</b>: aktywa (dane, systemy, procesy, ludzie, dostawcy), zagrożenia, podatności. Zacznij od inwentaryzacji i klasyfikacji aktywów.</li>'+
'<li><b>Analiza</b>: prawdopodobieństwo i skutek.</li>'+
'<li><b>Ocena</b>: porównanie z kryteriami akceptacji i priorytetyzacja.</li>'+
'<li><b>Postępowanie z ryzykiem</b>: wybór reakcji i planu działań.</li>'+
'<li><b>Monitorowanie i przegląd</b>: ryzyka się zmieniają, więc proces jest ciągły. Standardy: ISO 31000 (ogólny), ISO/IEC 27005 (ryzyko bezpieczeństwa informacji), NIST SP 800-30.</li></ol>'+
'<h2>Analiza jakościowa: macierz ryzyka</h2>'+
'<p>Oceniasz prawdopodobieństwo i skutek w skali 1–5, a wynik to ich iloczyn. Przykładowe progi: 1–7 niskie, 8–14 średnie, 15–25 wysokie.</p>'+
'<div class="tablewrap"><table style="text-align:center"><tr><th>Prawd. \\ Skutek</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>'+
'<tr><th>5</th><td style="background:rgba(44,122,63,.3)">5</td><td style="background:rgba(224,161,0,.35)">10</td><td style="background:rgba(168,64,45,.4)">15</td><td style="background:rgba(168,64,45,.4)">20</td><td style="background:rgba(168,64,45,.4)">25</td></tr>'+
'<tr><th>4</th><td style="background:rgba(44,122,63,.3)">4</td><td style="background:rgba(224,161,0,.35)">8</td><td style="background:rgba(224,161,0,.35)">12</td><td style="background:rgba(168,64,45,.4)">16</td><td style="background:rgba(168,64,45,.4)">20</td></tr>'+
'<tr><th>3</th><td style="background:rgba(44,122,63,.3)">3</td><td style="background:rgba(44,122,63,.3)">6</td><td style="background:rgba(224,161,0,.35)">9</td><td style="background:rgba(224,161,0,.35)">12</td><td style="background:rgba(168,64,45,.4)">15</td></tr>'+
'<tr><th>2</th><td style="background:rgba(44,122,63,.3)">2</td><td style="background:rgba(44,122,63,.3)">4</td><td style="background:rgba(44,122,63,.3)">6</td><td style="background:rgba(224,161,0,.35)">8</td><td style="background:rgba(224,161,0,.35)">10</td></tr>'+
'<tr><th>1</th><td style="background:rgba(44,122,63,.3)">1</td><td style="background:rgba(44,122,63,.3)">2</td><td style="background:rgba(44,122,63,.3)">3</td><td style="background:rgba(44,122,63,.3)">4</td><td style="background:rgba(44,122,63,.3)">5</td></tr></table></div>'+
'<p>Zalety: szybkie, zrozumiałe, nie wymaga danych finansowych. Wady: subiektywne i trudno porównać z budżetem.</p>'+
'<h2>Analiza ilościowa</h2>'+
'<ul><li><b>AV</b> (wartość aktywa), <b>EF</b> (współczynnik ekspozycji: jaki ułamek wartości tracimy w jednym zdarzeniu).</li>'+
'<li><b>SLE</b> (Single Loss Expectancy) = AV × EF: strata z jednego zdarzenia.</li>'+
'<li><b>ARO</b> (Annualized Rate of Occurrence): ile razy w roku spodziewamy się zdarzenia (0,25 = raz na cztery lata).</li>'+
'<li><b>ALE</b> (Annualized Loss Expectancy) = SLE × ARO: roczna oczekiwana strata.</li>'+
'<li><b>ROSI</b> (zwrot z inwestycji w bezpieczeństwo) = (spadek ALE − roczny koszt zabezpieczenia) ÷ roczny koszt zabezpieczenia.</li></ul>'+
'<p>Metoda <b>półilościowa</b> łączy skale z przedziałami finansowymi. Metodyka <b>FAIR</b> to uporządkowany sposób wyceny ryzyka cybernetycznego w pieniądzach z użyciem rozkładów, a nie pojedynczych liczb. Zawsze podawaj zakresy i założenia, bo dane o prawdopodobieństwie są niepewne.</p>'+
'<h2>Postępowanie z ryzykiem</h2>'+
'<div class="tablewrap"><table><tr><th>Reakcja</th><th>Istota</th><th>Przykład</th></tr>'+
'<tr><td><b>Unikanie</b> (avoid)</td><td>Rezygnacja z działania generującego ryzyko</td><td>Wycofanie przestarzałej usługi wystawionej do internetu</td></tr>'+
'<tr><td><b>Redukcja</b> (mitigate)</td><td>Zmniejszenie prawdopodobieństwa lub skutku</td><td>MFA, segmentacja, niezmienne kopie</td></tr>'+
'<tr><td><b>Transfer</b> (transfer)</td><td>Przeniesienie skutków finansowych na stronę trzecią</td><td>Ubezpieczenie cyber, outsourcing z umową i SLA. Odpowiedzialność prawna zwykle zostaje u Ciebie</td></tr>'+
'<tr><td><b>Akceptacja</b> (accept)</td><td>Świadoma decyzja o pozostawieniu ryzyka</td><td>Niskie ryzyko lub koszt zabezpieczenia wyższy niż strata. Wymaga formalnej zgody właściciela ryzyka i terminu przeglądu</td></tr></table></div>'+
'<p>Pamiętaj: akceptacji nie wolno mylić z ignorowaniem. Zaakceptowane ryzyko musi być opisane, uzasadnione, zatwierdzone przez osobę z uprawnieniami i okresowo przeglądane. Wyjątki od polityk (exceptions) działają tak samo.</p>'+
'<h2>Rejestr ryzyka i BIA</h2>'+
'<p><b>Rejestr ryzyka</b> zawiera: identyfikator, opis scenariusza, aktywo, zagrożenie i podatność, ocenę przed i po zabezpieczeniach, właściciela, wybraną reakcję, plan działań z terminem i status. <b>BIA</b> (analiza wpływu na biznes) ustala krytyczność procesów oraz cele RTO, RPO i MTD (maksymalny tolerowany czas niedostępności), omówione w lekcji 15.</p>'+
'<h2>Ryzyko dostawców i łańcucha dostaw</h2>'+
'<p>Atak SolarWinds (lekcja 2) pokazał, że ryzyko dostawcy staje się Twoim. Zarządzanie obejmuje: klasyfikację dostawców według krytyczności i dostępu do danych, ocenę przed zakupem (ankiety, certyfikaty, raporty z audytów), zapisy w umowie (wymogi bezpieczeństwa, zgłaszanie incydentów, prawo do audytu, podwykonawcy, plan wyjścia), monitorowanie w trakcie i bezpieczne zakończenie współpracy. Dla oprogramowania pomaga lista składników (SBOM).</p>'+
'<p><b>Przykład wymagań regulatora (DORA, sektor finansowy).</b> Rozporządzenie traktuje dostawców ICT jako odrębny obszar ryzyka: prowadzi się rejestr informacji o umowach (standardowe wzory ITS 2024/2956), a o planowanej umowie na usługi wspierające funkcje krytyczne lub istotne (KLIF) informuje się KNF z wyprzedzeniem (SPR-PF-19: co najmniej 14 dni przed związaniem się umową). W ankiecie KRI regulator pyta m.in. o dostawców wspierających KLIF, w tym tych, których nie można łatwo zastąpić (ryzyko koncentracji), o usługi świadczone przez dostawców w państwach trzecich, o strategie i plany wyjścia, o nowe umowy z przeprowadzoną oceną ryzyka i due diligence oraz o audyty u dostawców wraz z otwartymi zaleceniami. Z tego wynika lista pytań kontrolnych, którą możesz zadać dostawcom także poza sektorem finansowym. Pamiętaj, że w ankiecie dostawców liczy się też podwykonawców (łańcuch dostaw), a nie tylko bezpośrednią umowę.</p>'+
'<h2>Polski kontekst prawny</h2>'+
'<ul><li><b>Ustawa o KSC (po nowelizacji z 2026 r.)</b> wymaga od podmiotów kluczowych i ważnych systemu zarządzania bezpieczeństwem informacji opartego na szacowaniu ryzyka. Kierownik podmiotu odpowiada za wdrożenie i nadzór, a kara pieniężna dla niego może wynieść do 300% wynagrodzenia (lekcja 18). Ryzyko prawne i finansowe samo staje się pozycją rejestru.</li>'+
'<li><b>RODO</b> opiera się na podejściu opartym na ryzyku: środki bezpieczeństwa mają być adekwatne do ryzyka dla praw i wolności osób (art. 24, 25, 32), a przy wysokim ryzyku wymagana jest ocena skutków dla ochrony danych, DPIA (art. 35). Prezes UODO opublikował listę rodzajów przetwarzania, dla których DPIA jest obowiązkowa.</li>'+
'<li><b>Ubezpieczenia cyber</b> i ankiety ubezpieczycieli dziś zwykle wymagają MFA, EDR, kopii offline i procedur reagowania. To praktyczny sprawdzian dojrzałości.</li>'+
'<li>Nie myl skrótów: <i>KRI</i> w zarządzaniu ryzykiem to Key Risk Indicator (wskaźnik ryzyka), a w polskim sektorze publicznym KRI oznacza też Krajowe Ramy Interoperacyjności. W sektorze finansowym „Ankieta KRI” KNF to Kluczowe wskaźniki ryzyka dla obszaru ICT (formularze SPR-PF-26, 27 i 30, lekcja 18).</li></ul>',
  ex:[
  {t:"Przykład 1: fragment rejestru ryzyka",
   h:'<div class="tablewrap"><table><tr><th>ID</th><th>Scenariusz</th><th>P</th><th>S</th><th>Wynik</th><th>Reakcja</th><th>Właściciel</th></tr>'+
   '<tr><td>R1</td><td>Ransomware szyfruje serwery plików i ERP</td><td>4</td><td>5</td><td>20</td><td>Redukcja: kopie niezmienne, EDR, segmentacja. Transfer: ubezpieczenie</td><td>Dyrektor operacyjny</td></tr>'+
   '<tr><td>R2</td><td>Przejęcie konta administratora przez phishing</td><td>3</td><td>5</td><td>15</td><td>Redukcja: klucze FIDO2, PAM</td><td>CISO</td></tr>'+
   '<tr><td>R3</td><td>Dostawca SaaS ma awarię trwającą ponad 3 dni</td><td>3</td><td>3</td><td>9</td><td>Redukcja: SLA, plan awaryjny. Akceptacja części ryzyka</td><td>Właściciel procesu</td></tr>'+
   '<tr><td>R4</td><td>Wyciek danych osobowych z błędnie skonfigurowanego magazynu w chmurze</td><td>3</td><td>4</td><td>12</td><td>Redukcja: skanowanie konfiguracji, polityka dostępu publicznego</td><td>Dyrektor IT</td></tr>'+
   '<tr><td>R5</td><td>Utrata starego, nieużywanego laptopa z szyfrowanym dyskiem</td><td>4</td><td>1</td><td>4</td><td>Akceptacja (zaszyfrowany dysk, odwołanie dostępu)</td><td>Dyrektor IT</td></tr></table></div>'+
   '<p>Zauważ, że za ryzyka odpowiadają osoby biznesowe, a CISO doradza i koordynuje. To zmienia rozmowę z zarządem: nie „IT wnioskuje o budżet”, tylko „właściciel procesu wybiera, jak obniżyć ryzyko”.</p>'},
  {t:"Przykład 2: rachunek ALE i ROSI",
   h:'<p>Ransomware w sklepie internetowym: wartość narażona (utrata przychodu, odtwarzanie, kary, reputacja) AV = 2 000 000 zł. Spodziewamy się, że w jednym zdarzeniu stracimy 40% (EF). Zdarzenie spodziewane raz na cztery lata (ARO = 0,25).</p>'+
   '<div class="tablewrap"><table><tr><th>Wielkość</th><th>Przed</th><th>Po wdrożeniu kopii niezmiennych i EDR (koszt 90 000 zł rocznie)</th></tr>'+
   '<tr><td>EF</td><td>40%</td><td>20% (szybsze odtworzenie)</td></tr>'+
   '<tr><td>SLE = AV × EF</td><td>800 000 zł</td><td>400 000 zł</td></tr>'+
   '<tr><td>ARO</td><td>0,25</td><td>0,10</td></tr>'+
   '<tr><td>ALE = SLE × ARO</td><td>200 000 zł</td><td>40 000 zł</td></tr></table></div>'+
   '<p>Spadek ALE = 160 000 zł. ROSI = (160 000 − 90 000) ÷ 90 000 ≈ 0,78, czyli 78%. Inwestycja się zwraca, ale pamiętaj, że to szacunki oparte na założeniach. Pokazuj zarządowi widełki (np. pesymistyczny i optymistyczny wariant) i źródła danych.</p>'},
  {t:"Przykład 3: ranking ryzyk w Pythonie",
   h:'<pre><code>RISKS = [\n    {"id": "R1", "opis": "Ransomware na serwery plików i ERP", "p": 4, "s": 5},\n    {"id": "R2", "opis": "Przejęcie konta administratora", "p": 3, "s": 5},\n    {"id": "R3", "opis": "Awaria dostawcy SaaS", "p": 3, "s": 3},\n    {"id": "R5", "opis": "Utrata zaszyfrowanego laptopa", "p": 4, "s": 1},\n]\n\n\ndef poziom(score: int) -&gt; str:\n    return "WYSOKIE" if score &gt;= 15 else "ŚREDNIE" if score &gt;= 8 else "NISKIE"\n\n\ndef ale(av: float, ef: float, aro: float) -&gt; float:\n    return av * ef * aro                 # ALE = SLE * ARO, gdzie SLE = AV * EF\n\n\nfor r in sorted(RISKS, key=lambda x: x["p"] * x["s"], reverse=True):\n    score = r["p"] * r["s"]\n    print(f"{r[\'id\']}: {score:2d} {poziom(score):8s} {r[\'opis\']}")\n\nprint(ale(2_000_000, 0.4, 0.25))        # 200000.0</code></pre>'+
   '<p>Taki skrypt można podłączyć do rejestru w arkuszu lub bazie i automatycznie generować zestawienie dla zarządu, np. w przepływie n8n.</p>'},
  {t:"Przykład 4: wybierz reakcję na ryzyko",
   h:'<div class="tablewrap"><table><tr><th>Sytuacja</th><th>Reakcja</th></tr>'+
   '<tr><td>Firma wykupuje polisę cyber na pokrycie kosztów odtwarzania i kar umownych</td><td>Transfer (finansowy)</td></tr>'+
   '<tr><td>Zarząd rezygnuje z wprowadzenia nowej aplikacji mobilnej, bo nie ma zasobów na jej zabezpieczenie</td><td>Unikanie</td></tr>'+
   '<tr><td>Dział wdraża MFA i segmentację dla systemu płac</td><td>Redukcja</td></tr>'+
   '<tr><td>Właściciel procesu na piśmie akceptuje ryzyko starego systemu do końca roku, z izolacją sieciową i planem wymiany</td><td>Akceptacja (z zabezpieczeniem kompensacyjnym i terminem)</td></tr></table></div>'}
  ],
  quiz:[
  {q:"Jaki jest roczny oczekiwany koszt incydentu (ALE), gdy wartość aktywa to 500 000 zł, współczynnik ekspozycji 20%, a zdarzenie występuje średnio raz na pięć lat?",o:["20 000 zł","100 000 zł","500 000 zł","2 500 000 zł"],a:0,w:"SLE = 500 000 × 0,2 = 100 000 zł. ARO = 0,2. ALE = 100 000 × 0,2 = 20 000 zł."},
  {q:"Firma wykupuje ubezpieczenie od skutków ataku ransomware. Którą reakcję na ryzyko to ilustruje?",o:["Unikanie","Redukcja","Transfer","Akceptacja"],a:2,w:"Ubezpieczenie przenosi skutki finansowe na ubezpieczyciela, czyli transfer ryzyka. Nie usuwa jednak samego zagrożenia ani odpowiedzialności prawnej."},
  {q:"Co oznacza ryzyko rezydualne?",o:["Ryzyko przed wdrożeniem jakichkolwiek zabezpieczeń","Ryzyko, które pozostaje po wdrożeniu zabezpieczeń","Ryzyko wynikające z awarii zasilania","Ryzyko, którego nie da się ocenić"],a:1,w:"Ryzyko rezydualne to pozostałość po zastosowaniu środków ochrony. Porównujemy je z apetytem na ryzyko."},

LESSONS[17] = {
  lead:"Polityka bezpieczeństwa to sposób, w jaki zarząd mówi organizacji, czego od niej oczekuje. Dobra polityka jest krótka, zrozumiała, możliwa do wyegzekwowania i połączona z ryzykiem. Zła leży w szufladzie.",
  goals:["Odróżnić politykę, standard, procedurę i wytyczne","Napisać politykę z zachowaniem zasad struktury i egzekwowalności","Wskazać wymagane polityki i powiązać je z obowiązkami z ustawy o KSC","Uwzględnić polskie wymogi dotyczące monitorowania pracowników i BYOD"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Domena 5: polityki, standardy, procedury i wytyczne, zarządzanie, szkolenia uświadamiające, onboarding i offboarding oraz zarządzanie zmianą.</div>'+
'<h2>Hierarchia dokumentów</h2>'+
'<div class="tablewrap"><table><tr><th>Dokument</th><th>Charakter</th><th>Przykład</th></tr>'+
'<tr><td><b>Polityka</b></td><td>Ogólne zasady i cele, zatwierdzone przez zarząd. Odpowiada na pytanie „co i dlaczego”</td><td>Polityka kontroli dostępu</td></tr>'+
'<tr><td><b>Standard</b> (wymagania)</td><td>Obowiązkowe, mierzalne wymagania wynikające z polityki</td><td>Hasła co najmniej 14 znaków, MFA dla wszystkich dostępów zdalnych</td></tr>'+
'<tr><td><b>Procedura</b></td><td>Kroki wykonania czynności („jak”)</td><td>Procedura odbierania uprawnień po odejściu pracownika</td></tr>'+
'<tr><td><b>Wytyczne</b> (guidelines)</td><td>Zalecenia dobrowolne, dobre praktyki</td><td>Jak wybrać dobre hasło lub frazę</td></tr>'+
'<tr><td><b>Konfiguracja bazowa</b></td><td>Techniczny wzorzec ustawień</td><td>Baseline CIS dla serwerów Windows</td></tr></table></div>'+
'<h2>Jak napisać dobrą politykę</h2>'+
'<ul><li><b>Cel i zakres</b>: komu i czemu służy, kogo dotyczy.</li>'+
'<li><b>Role i odpowiedzialności</b> (właściciel, wykonawcy, nadzór).</li>'+
'<li><b>Wymagania</b>: używaj jednoznacznych słów (musi, powinien, może) i rzeczy sprawdzalnych. Zamiast „hasła mają być silne”: „minimum 14 znaków, sprawdzane względem list wycieków”.</li>'+
'<li><b>Wyjątki</b>: proces zgłoszenia, uzasadnienie, zatwierdzenie, termin ważności.</li>'+
'<li><b>Egzekwowanie i konsekwencje</b>: jak sprawdzamy, co grozi za naruszenie.</li>'+
'<li><b>Wersjonowanie</b>: właściciel, data zatwierdzenia, cykl przeglądu (co najmniej raz w roku i po istotnych zmianach), historia zmian.</li>'+
'<li><b>Zatwierdzenie przez kierownictwo</b>: zarząd musi wziąć odpowiedzialność, bo w ustawie o KSC to kierownik podmiotu odpowiada za system zarządzania bezpieczeństwem.</li></ul>'+
'<div class="callout warn"><strong>Dobra praktyka</strong>Krótka polityka z listą kontroli, którą ktoś naprawdę sprawdza, jest lepsza niż 60 stron, których nikt nie czyta. Każda polityka powinna mieć mierzalny wskaźnik wykonania.</div>'+
'<h2>Jakie polityki są potrzebne</h2>'+
'<div class="tablewrap"><table><tr><th>Obszar</th><th>Przykładowe polityki i procedury</th></tr>'+
'<tr><td>Nadrzędne</td><td>Polityka bezpieczeństwa informacji, polityka zarządzania ryzykiem</td></tr>'+
'<tr><td>Ludzie</td><td>Dopuszczalne użycie (AUP), onboarding i offboarding, szkolenia, czyste biurko, praca zdalna, BYOD i urządzenia mobilne</td></tr>'+
'<tr><td>Dostęp i tożsamość</td><td>Kontrola dostępu, hasła i MFA, zarządzanie kontami uprzywilejowanymi</td></tr>'+
'<tr><td>Dane</td><td>Klasyfikacja danych, retencja i niszczenie, szyfrowanie i zarządzanie kluczami, ochrona danych osobowych</td></tr>'+
'<tr><td>Systemy i sieć</td><td>Hardening i konfiguracje bazowe, łatki i podatności, logowanie i monitoring, kopie zapasowe, zarządzanie zmianą</td></tr>'+
'<tr><td>Rozwój</td><td>Bezpieczne tworzenie oprogramowania, przegląd kodu, zarządzanie sekretami</td></tr>'+
'<tr><td>Dostawcy</td><td>Zarządzanie dostawcami i łańcuchem dostaw, wymogi umowne</td></tr>'+
'<tr><td>Reagowanie</td><td>Obsługa incydentów, ciągłość działania i odtwarzanie, komunikacja kryzysowa</td></tr>'+
'<tr><td>Nowe technologie</td><td>Korzystanie z narzędzi generatywnej AI, chmura, urządzenia IoT</td></tr></table></div>'+
'<h2>Świadomość i szkolenia</h2>'+
'<p>Bezpieczeństwo zależy od ludzi, więc szkolenia są częścią kontroli. Elementy dobrego programu: szkolenie wstępne i okresowe dopasowane do ról (inne dla zarządu, administratorów i księgowości), symulacje phishingu z uczeniem zamiast karania, łatwy sposób zgłaszania incydentów (przycisk w kliencie poczty) i mierniki (odsetek zgłoszeń, czas reakcji). W ustawie o KSC edukacja personelu oraz coroczne szkolenie kierownictwa są obowiązkami, a ich zaniedbanie jest podstawą kary osobistej dla kierownika.</p>'+
'<h2>Polski kontekst prawny</h2>'+
'<ul><li><b>Ustawa o KSC</b>: dokumentacja systemu zarządzania bezpieczeństwem informacji (polityki, procedury, analiza ryzyka) ma być wdrożona do 3 kwietnia 2027 r. dla podmiotów, które spełniały kryteria w dniu wejścia w życie nowelizacji. Zobacz lekcję 18.</li>'+
'<li><b>Miękkie prawo w sektorze finansowym</b>: według adnotacji w arkuszu KNF (październik 2026) Komisja Nadzoru Finansowego uchyliła 17 stycznia 2025 r. większość „miękkiego prawa” z zakresu IT, w tym Rekomendację D dla banków i wytyczne IT dla zakładów ubezpieczeń i reasekuracji. Polityki w finansach buduje się dziś wokół DORA i aktów delegowanych (m.in. rozporządzenie 2024/1774). Wniosek ogólny: sprawdzaj, czy akty, na których oparłeś politykę, nie zostały uchylone lub zastąpione. Ankieta KRI pyta też o liczbę ewidencjonowanych odstępstw od zasad bezpieczeństwa (ZGD.01), więc rejestr wyjątków z tej lekcji jest też mierzalnym wskaźnikiem.</li>'+
'<li><b>Kodeks pracy a monitoring</b>: monitorowanie poczty elektronicznej (art. 22³) i monitoring wizyjny (art. 22²) wymagają określenia celu, zakresu i sposobu w przepisach wewnętrznych oraz poinformowania pracowników, co do zasady z wyprzedzeniem (co najmniej 2 tygodnie przed uruchomieniem), a nowych pracowników przed dopuszczeniem do pracy. Monitoring musi być proporcjonalny i niezbędny do określonego celu. Dotyczy to też narzędzi DLP, rejestrowania aktywności i SIEM obejmujących działania pracowników.</li>'+
'<li><b>RODO</b>: przetwarzanie danych w logach i monitoringu wymaga podstawy prawnej, informacji dla osób, minimalizacji i okresów przechowywania. Polityka retencji logów musi to uwzględniać.</li>'+
'<li><b>BYOD</b>: prywatne urządzenie z danymi firmy wymaga zasad: zakres kontroli firmy (np. kontener służbowy w MDM zamiast kontroli całego urządzenia), szyfrowanie, możliwość zdalnego usunięcia danych służbowych, zgoda i informacja dla pracownika. Im większa ingerencja w prywatność, tym mocniejsze uzasadnienie.</li>'+
'<li><b>Wymogi umowne i tajemnica przedsiębiorstwa</b>: umowy o zachowaniu poufności, zasady postępowania z danymi klientów i know-how powinny być spójne z politykami.</li></ul>',
  ex:[
  {t:"Przykład 1: szkielet polityki haseł i MFA",
   h:'<pre><code>POLITYKA UWIERZYTELNIANIA I HASEŁ                        wersja 1.2\nWłaściciel: CISO | Zatwierdził: Zarząd | Obowiązuje od: 01.11.2026\nNastępny przegląd: 01.11.2027\n\n1. Cel i zakres\n   Zasady uwierzytelniania użytkowników i kont usługowych we wszystkich\n   systemach organizacji.\n\n2. Wymagania\n   2.1 MFA jest obowiązkowe dla: dostępu zdalnego, poczty, kont\n       uprzywilejowanych i systemów klasy "poufne".\n   2.2 Konta uprzywilejowane używają kluczy FIDO2.\n   2.3 Hasło ma co najmniej 14 znaków i jest sprawdzane względem listy\n       haseł z wycieków. Zmiana hasła następuje po podejrzeniu\n       kompromitacji, nie według stałego kalendarza.\n   2.4 Hasła są przechowywane wyłącznie w zatwierdzonym menedżerze haseł.\n   2.5 Konta współdzielone są zabronione. Wyjątki wymagają zgody CISO.\n\n3. Role: użytkownik, właściciel systemu, administrator tożsamości, CISO.\n4. Wyjątki: wniosek, ocena ryzyka, zatwierdzenie, termin wygaśnięcia.\n5. Egzekwowanie: kontrola techniczna (IdP), przegląd kwartalny, konsekwencje\n   zgodnie z regulaminem pracy.\n6. Dokumenty powiązane: Polityka kontroli dostępu, Procedura odzyskiwania\n   konta, Standard konfiguracji IdP.</code></pre>'+
   '<p>Zwróć uwagę na punkt 2.3: zamiast wymuszać cykliczną zmianę haseł, polityka opiera się na zmianie po podejrzeniu kompromitacji i kontroli list wycieków, zgodnie ze współczesnymi zaleceniami (por. lekcja 4).</p>'},
  {t:"Przykład 2: polityka korzystania z narzędzi generatywnej AI",
   h:'<p>To dziś jedna z najpilniejszych polityk. Przykładowe zapisy:</p>'+
   '<ol><li><b>Dozwolone narzędzia</b>: tylko zatwierdzone przez IT i bezpieczeństwo konta firmowe, z umową o przetwarzaniu danych i wyłączonym uczeniem na danych firmy.</li>'+
   '<li><b>Klasyfikacja danych</b>: dane publiczne i wewnętrzne wolno wprowadzać do zatwierdzonych narzędzi. Dane poufne tylko za zgodą właściciela danych i w narzędziach o odpowiednim poziomie ochrony. Dane osobowe szczególnych kategorii, tajemnice handlowe i klucze: zakaz.</li>'+
   '<li><b>Weryfikacja wyników</b>: człowiek odpowiada za treść. Obowiązek sprawdzenia faktów, kodu (testy, przegląd bezpieczeństwa) i zgodności z prawami autorskimi.</li>'+
   '<li><b>Integracje i agenci</b>: dostęp narzędzi AI do poczty, plików i systemów zatwierdza się jak każdy dostęp (najmniejsze uprawnienia, rejestr, przegląd).</li>'+
   '<li><b>Zgłaszanie</b>: przypadek wprowadzenia danych niezgodnie z polityką zgłaszamy jako incydent.</li></ol>'+
   '<div class="callout">Polityka AI łączy trzy rzeczy z kursu: klasyfikację danych (lekcja 15), zarządzanie dostawcami (lekcja 16) i RODO (lekcja 18).</div>'},
  {t:"Przykład 3: mapowanie środków NIS2 na polityki i lekcje kursu",
   h:'<p>Art. 21 dyrektywy NIS2 wymienia dziesięć obszarów środków zarządzania ryzykiem, które w ustawie o KSC przekładają się na obowiązki podmiotów kluczowych i ważnych.</p>'+
   '<div class="tablewrap"><table><tr><th>Obszar NIS2</th><th>Polityka lub procedura</th><th>Lekcje</th></tr>'+
   '<tr><td>Analiza ryzyka i polityki bezpieczeństwa</td><td>Polityka bezpieczeństwa informacji, polityka ryzyka</td><td>16, 17</td></tr>'+
   '<tr><td>Obsługa incydentów</td><td>Procedura reagowania na incydenty</td><td>10, 24</td></tr>'+
   '<tr><td>Ciągłość działania, kopie, odtwarzanie, zarządzanie kryzysowe</td><td>BCP/DRP, polityka kopii zapasowych</td><td>15</td></tr>'+
   '<tr><td>Bezpieczeństwo łańcucha dostaw</td><td>Zarządzanie dostawcami</td><td>2, 16</td></tr>'+
   '<tr><td>Bezpieczeństwo nabywania, rozwoju i utrzymania, obsługa podatności</td><td>Bezpieczny SDLC, zarządzanie podatnościami i łatkami</td><td>4, 20, 23, 26</td></tr>'+
   '<tr><td>Ocena skuteczności środków</td><td>Audyty, testy, pomiary</td><td>19, 27</td></tr>'+
   '<tr><td>Higiena cybernetyczna i szkolenia</td><td>Program świadomości, szkolenia kierownictwa</td><td>17</td></tr>'+
   '<tr><td>Kryptografia i szyfrowanie</td><td>Polityka kryptograficzna i zarządzania kluczami</td><td>13, 14</td></tr>'+
   '<tr><td>Bezpieczeństwo kadr, kontrola dostępu, zarządzanie aktywami</td><td>Onboarding/offboarding, kontrola dostępu, inwentaryzacja</td><td>3, 11, 16</td></tr>'+
   '<tr><td>MFA, bezpieczna łączność, awaryjne kanały komunikacji</td><td>Polityka MFA, zdalny dostęp, komunikacja kryzysowa</td><td>8, 9, 12</td></tr></table></div>'},
  {t:"Przykład 4: pilnowanie terminów przeglądu polityk (Python)",
   h:'<pre><code>import csv\nfrom datetime import date, datetime\n\n# polityki.csv: nazwa,wlasciciel,data_przegladu\nwith open("polityki.csv", encoding="utf-8") as f:\n    for row in csv.DictReader(f):\n        termin = datetime.strptime(row["data_przegladu"], "%Y-%m-%d").date()\n        dni = (termin - date.today()).days\n        if dni &lt; 0:\n            print(f"PRZETERMINOWANA: {row[\'nazwa\']} ({row[\'wlasciciel\']}) {-dni} dni")\n        elif dni &lt;= 30:\n            print(f"Do przeglądu za {dni} dni: {row[\'nazwa\']} ({row[\'wlasciciel\']})")</code></pre>'+
   '<p>Prosty skrypt, który uruchomisz co tydzień i wyślesz wynik do właścicieli polityk. Zatwierdzanie i wersjonowanie warto prowadzić w systemie dokumentów z historią zmian.</p>'},
  {t:"Ćwiczenie: monitorowanie poczty i SIEM, co sprawdzić",
   h:'<p>Wdrażasz DLP i SIEM, który rejestruje m.in. adresy odbiorców i załączniki w poczcie pracowników. Jakie kroki prawne i organizacyjne musisz wykonać?</p>'+
   '<details><summary>Pokaż listę kontrolną</summary><ul><li>Określ cel (np. ochrona tajemnicy przedsiębiorstwa i wykrywanie wycieków), zakres (co i kogo obejmuje) i sposób monitorowania.</li><li>Zapisz to w regulaminie pracy lub obwieszczeniu i poinformuj pracowników z wymaganym wyprzedzeniem, a nowych przed dopuszczeniem do pracy.</li><li>Zadbaj, by nie naruszać poufności korespondencji nieużywanej do celów służbowych oraz tajemnic np. związków zawodowych.</li><li>Zastosuj RODO: podstawa prawna, minimalizacja, ograniczony dostęp do logów, okres przechowywania, informacja w klauzuli, rejestr czynności przetwarzania, ocena czy potrzebna jest DPIA.</li><li>Skonsultuj się z IOD (inspektorem ochrony danych) i działem prawnym przed uruchomieniem.</li></ul></details>'}
  ],
  quiz:[
  {q:"Który dokument opisuje krok po kroku, jak wykonać czynność, np. odebrać uprawnienia po odejściu pracownika?",o:["Polityka","Procedura","Standard bezpieczeństwa wysokiego poziomu","Wytyczne"],a:1,w:"Procedura odpowiada na pytanie „jak”. Polityka mówi „co i dlaczego”, standard określa obowiązkowe wymagania, a wytyczne to zalecenia dobrowolne."},
  {q:"Kto powinien zatwierdzić politykę bezpieczeństwa informacji, aby miała realną moc?",o:["Zespół IT bez wiedzy zarządu","Kierownictwo (zarząd)","Dostawca zewnętrzny","Każdy pracownik indywidualnie"],a:1,w:"Zatwierdzenie przez kierownictwo daje politykę autorytet i przypisuje odpowiedzialność. W ustawie o KSC odpowiada za nią kierownik podmiotu."},
  {q:"Jak powinien działać proces wyjątków od polityki?",o:["Wyjątki przyznaje się ustnie","Wniosek, ocena ryzyka, formalne zatwierdzenie i termin wygaśnięcia","Wyjątki są wieczne po zatwierdzeniu","Wyjątków nie wolno robić nigdy"],a:1,w:"Wyjątek to forma akceptacji ryzyka, więc musi być udokumentowany, uzasadniony, zatwierdzony przez właściwą osobę i ograniczony w czasie."},
  {q:"Planujesz monitorować pocztę służbową pracowników. Co jest konieczne z perspektywy Kodeksu pracy?",o:["Nic, bo poczta należy do firmy","Określenie celu, zakresu i sposobu monitorowania oraz poinformowanie pracowników przed uruchomieniem","Zgoda każdego pracownika w formie notarialnej","Monitorowanie tylko w nocy"],a:1,w:"Przepisy wymagają ustalenia celu, zakresu i sposobu oraz poinformowania pracowników (z wyprzedzeniem). Dodatkowo obowiązują zasady RODO i proporcjonalność."},
  {q:"Które rozwiązanie najlepiej godzi potrzeby firmy i prywatność pracownika w BYOD?",o:["Pełna kontrola prywatnego telefonu bez informowania","Kontener służbowy w MDM z możliwością zdalnego usunięcia danych firmowych, za wiedzą pracownika","Zakaz poczty na telefonach prywatnych bez alternatywy","Przekazanie firmie hasła do konta Apple lub Google pracownika"],a:1,w:"Rozdzielenie danych służbowych od prywatnych ogranicza ingerencję w prywatność, a firma zachowuje kontrolę nad swoimi danymi."},
  {q:"Pracownik wkleja do publicznego czatu AI fragment umowy z klientem. Którą politykę naruszył?",o:["Politykę czystego biurka","Politykę dopuszczalnego użycia/AI oraz klasyfikacji danych","Politykę kopii zapasowych","Politykę fizycznego dostępu"],a:1,w:"Dane poufne można wprowadzać tylko do zatwierdzonych narzędzi o odpowiednim poziomie ochrony. Zdarzenie należy zgłosić jako incydent."}
  ]
};

LESSONS[18] = {
  lead:"Prawo mówi, co musisz. Normy mówią, jak to dobrze zrobić. Umowy i regulatorzy sektorowi dokładają swoje. Ta lekcja porządkuje wymagania, z którymi spotkasz się w Polsce: RODO, ustawę o KSC (NIS2), DORA oraz ISO 27001.",
  goals:["Odróżnić obowiązek prawny, normę dobrowolną i wymóg umowny","Opisać zakres i główne obowiązki RODO, KSC (NIS2) i DORA","Znać polskie terminy i organy: UODO, CSIRT, KNF, wykaz KSC i system S46","Zastosować podstawową logikę kwalifikacji podmiotu do NIS2"],
  intro:
'<div class="callout warn"><strong>Stan prawny na 9 października 2026 r. i zastrzeżenie</strong>Lekcja opiera się na tekstach aktów i opracowaniach z 2026 r. Przepisy i terminy bywają zmieniane lub interpretowane przez organy, a w mediach prawniczych znajdziesz rozbieżności w szczegółach. To materiał edukacyjny, a nie porada prawna. Kwalifikację własnej organizacji i terminy zawsze potwierdź w tekście ustawy (ustawa o KSC w brzmieniu z ustawy z 23 stycznia 2026 r., Dz.U. 2026 poz. 252), u prawnika i na stronach organów.</div>'+
'<h2>Prawo, normy, ramy, umowy</h2>'+
'<div class="tablewrap"><table><tr><th>Rodzaj</th><th>Charakter</th><th>Przykłady</th></tr>'+
'<tr><td>Prawo</td><td>Obowiązkowe, sankcje prawne</td><td>RODO, ustawa o KSC (NIS2), DORA, Kodeks pracy, Kodeks karny</td></tr>'+
'<tr><td>Normy</td><td>Dobrowolne, ale często wymagane przez klientów. Możliwa certyfikacja</td><td>ISO/IEC 27001, 27002, 27005, 27701, 22301, 42001</td></tr>'+
'<tr><td>Ramy i dobre praktyki</td><td>Dobrowolne, wzorce do dostosowania</td><td>NIST CSF 2.0, CIS Controls v8, COBIT, MITRE ATT&amp;CK</td></tr>'+
'<tr><td>Wymogi branżowe i umowne</td><td>Obowiązują przez umowę lub regulatora sektora</td><td>PCI DSS (karty płatnicze), TISAX (motoryzacja), wytyczne KNF</td></tr></table></div>'+
'<p>Ważna zasada: <b>certyfikat ISO 27001 nie oznacza zgodności z prawem</b>, a zgodność z prawem nie oznacza bezpieczeństwa. Normy pomagają zbudować system, który dowodzi należytej staranności, ale nie zastępują analizy wymogów prawnych.</p>'+
'<h2>RODO i polska ustawa o ochronie danych osobowych</h2>'+
'<ul><li><b>Zasady (art. 5)</b>: zgodność z prawem, rzetelność i przejrzystość, ograniczenie celu, minimalizacja, prawidłowość, ograniczenie przechowywania, integralność i poufność, rozliczalność.</li>'+
'<li><b>Podstawy przetwarzania (art. 6)</b>: zgoda, umowa, obowiązek prawny, żywotne interesy, zadanie publiczne, prawnie uzasadniony interes. Dane szczególnych kategorii (m.in. zdrowie) mają dodatkowe ograniczenia (art. 9).</li>'+
'<li><b>Role</b>: administrator, podmiot przetwarzający (umowa powierzenia, art. 28), inspektor ochrony danych IOD (art. 37 i nast.).</li>'+
'<li><b>Dokumentacja</b>: rejestr czynności przetwarzania (art. 30), DPIA przy wysokim ryzyku (art. 35), polityki i dowody zabezpieczeń (art. 24, 32).</li>'+
'<li><b>Naruszenia (art. 33 i 34)</b>: zgłoszenie do <b>Prezesa UODO</b> bez zbędnej zwłoki, w miarę możliwości w 72 godziny od stwierdzenia naruszenia, o ile jest ryzyko dla praw i wolności osób. Gdy ryzyko jest wysokie, zawiadamiasz też osoby, których dane dotyczą. Podmiot przetwarzający zawiadamia administratora bez zbędnej zwłoki. Każde naruszenie dokumentujesz, także to niezgłoszone.</li>'+
'<li><b>Kary</b>: do 20 mln euro lub 4% rocznego obrotu za najpoważniejsze naruszenia oraz do 10 mln euro lub 2% za pozostałe (art. 83). Organ nadzorczy: UODO.</li></ul>'+
'<h2>Ustawa o krajowym systemie cyberbezpieczeństwa (KSC) i NIS2</h2>'+
'<p>Polska wdrożyła dyrektywę NIS2 nie nową ustawą, tylko <b>nowelizacją ustawy z 5 lipca 2018 r. o KSC</b>. Weszła w życie <b>3 kwietnia 2026 r.</b> Dzieli podmioty na <b>kluczowe</b> i <b>ważne</b>.</p>'+
'<h3>Kogo dotyczy</h3>'+
'<ul><li>Sektory z <b>załącznika 1</b> (o wysokiej krytyczności): energetyka, transport, bankowość, infrastruktura rynków finansowych, zdrowie, woda pitna, ścieki, infrastruktura cyfrowa, zarządzanie usługami ICT (B2B), administracja publiczna, przestrzeń kosmiczna.</li>'+
'<li>Sektory z <b>załącznika 2</b> (inne krytyczne): usługi pocztowe i kurierskie, gospodarka odpadami, chemikalia, żywność, przemysł (m.in. wyroby medyczne, elektronika, maszyny, pojazdy), dostawcy cyfrowi (m.in. platformy handlowe, wyszukiwarki, media społecznościowe), badania.</li>'+
'<li>Wielkość: co do zasady średnie i duże przedsiębiorstwa. Wyjątki obejmują niektórych dostawców niezależnie od wielkości.</li>'+
'<li><b>Podmiot kluczowy</b>: duży podmiot z załącznika 1 (i niektóre specjalne kategorie). <b>Podmiot ważny</b>: średni z załącznika 1 oraz średni lub duży z załącznika 2.</li>'+
'<li>Podmioty <b>same ustalają</b>, czy podlegają ustawie, i same składają wniosek o wpis do wykazu. Kwalifikacja jest często trudna: ten sam biznes może wchodzić w różne sektory zależnie od faktycznie świadczonych usług. Samo bycie sprzedawcą detalicznym nie czyni z firmy podmiotu NIS2, ale prowadzenie np. platformy handlowej, usług kurierskich lub produkcji może.</li></ul>'+
'<h3>Kalendarz dla podmiotów istniejących w dniu wejścia ustawy w życie</h3>'+
'<div class="tablewrap"><table><tr><th>Data</th><th>Zdarzenie</th></tr>'+
'<tr><td>3 kwietnia 2026</td><td>Wejście w życie nowelizacji. Od tego dnia obowiązują m.in. obowiązki kierownika (szkolenie, nadzór)</td></tr>'+
'<tr><td>13 kwietnia – 6 maja 2026</td><td>Wykaz KSC: wpisy z urzędu</td></tr>'+
'<tr><td>7 maja – 3 października 2026</td><td>Samorejestracja podmiotów, które nie zostały wpisane z urzędu (system S46 i wykaz)</td></tr>'+
'<tr><td><b>3 października 2026</b></td><td><b>Termin na złożenie wniosku o wpis do wykazu (termin już upłynął)</b></td></tr>'+
'<tr><td>3 kwietnia 2027</td><td>Wdrożenie systemu zarządzania bezpieczeństwem informacji i pozostałych obowiązków (12 miesięcy)</td></tr>'+
'<tr><td>3 kwietnia 2028</td><td>Pierwszy audyt (podmioty kluczowe, następnie co 3 lata). Według opracowań prawniczych od tej daty możliwe jest też nakładanie kar finansowych (2 lata od wejścia w życie)</td></tr></table></div>'+
'<div class="callout"><strong>Co zrobić, jeśli termin wniosku już minął</strong>Jeśli Twoja organizacja mogła podlegać ustawie i nie złożyła wniosku, sprawdź to natychmiast z prawnikiem, zbierz dokumentację kwalifikacji i złóż wniosek bez zwłoki. Brak wpisu jest naruszeniem, a odpowiedzialność za terminowość spoczywa na kierowniku podmiotu. Dokumentacja analizy kwalifikacji (nawet gdy wynik brzmi „nie podlegamy”) jest ważnym dowodem należytej staranności.</div>'+
'<h3>Najważniejsze obowiązki</h3>'+
'<ul><li><b>System zarządzania bezpieczeństwem informacji</b> (SZBI): analiza ryzyka, polityki, środki techniczne i organizacyjne (lekcja 17, przykład 3).</li>'+
'<li><b>Zgłaszanie poważnych incydentów</b> do właściwego CSIRT przez system S46: <b>wczesne ostrzeżenie do 24 godzin</b> od wykrycia, <b>zgłoszenie do 72 godzin</b>, <b>sprawozdanie końcowe w ciągu miesiąca</b> od zgłoszenia. CSIRT GOV (ABW), CSIRT MON i CSIRT NASK obsługują różne grupy podmiotów.</li>'+
'<li><b>Audyt</b> bezpieczeństwa systemu informacyjnego (co 3 lata dla podmiotów kluczowych).</li>'+
'<li><b>Osoby kontaktowe</b>, bezpieczeństwo łańcucha dostaw, edukacja personelu.</li>'+
'<li><b>Odpowiedzialność kierownika</b>: kierownik podmiotu odpowiada za wykonanie obowiązków, zatwierdza środki zarządzania ryzykiem, nadzoruje wdrożenie i musi być szkolony (co roku). Odpowiedzialności nie da się w pełni scedować na IT ani dostawcę.</li>'+
'<li><b>Kary (według opracowań prawniczych)</b>: podmiot kluczowy do 10 mln euro lub 2% obrotu, ważny do 7 mln euro lub 1,4% (stosuje się kwotę wyższą), kara dla kierownika do 300% wynagrodzenia (art. 73a), w sektorze publicznym do 100%, kary okresowe oraz szczególna kara do 100 mln zł za poważne cyberzagrożenia. Część mediów podaje inne pułapy kary dla kierownika, co jest dobrym powodem, by sprawdzić tekst ustawy.</li>'+
'<li>Ustawa zawiera też krajowe mechanizmy, m.in. procedurę uznania <b>dostawcy sprzętu lub oprogramowania za dostawcę wysokiego ryzyka</b>, która wpływa na wybory zakupowe.</li></ul>'+
'<h2>DORA: odporność cyfrowa sektora finansowego</h2>'+
'<div class="callout"><strong>Zaktualizowano po analizie dokumentów KNF (październik 2026)</strong>Ta sekcja uwzględnia instrukcję KNF „Wypełnianie i przekazywanie formularzy przez podmioty finansowe w zakresie wymogów sprawozdawczych wynikających z Rozporządzenia DORA” (wersja 1.8, październik 2026), instrukcję formularza SPR-PF-26 (wersja 1.0 z 2 października 2026), komunikat „Kluczowe informacje SPR-PF-26, III kwartał 2026” oraz arkusz formularza SPR-PF-26.</div>'+
'<p>Rozporządzenie (UE) 2022/2554 obowiązuje od <b>17 stycznia 2025 r.</b> Dotyczy instytucji finansowych (banki, ubezpieczyciele, firmy inwestycyjne, instytucje płatnicze, dostawcy kryptoaktywów i inne) oraz, pośrednio, dostawców usług ICT. Wobec podmiotów finansowych DORA jest aktem szczególnym względem NIS2 w zakresie zarządzania ryzykiem ICT i zgłaszania incydentów. Według instrukcji KNF od 17 stycznia 2025 r. <b>Komisja Nadzoru Finansowego</b> sprawuje nadzór nad stosowaniem DORA, a obowiązki sprawozdawcze realizuje się przez kanały udostępnione przez Urząd KNF (UKNF).</p>'+
'<h3>Akty, na które powołuje się KNF</h3>'+
'<div class="tablewrap"><table><tr><th>Akt</th><th>Czego dotyczy</th></tr>'+
'<tr><td>Rozporządzenie (UE) 2022/2554 (DORA)</td><td>Rama operacyjnej odporności cyfrowej</td></tr>'+
'<tr><td>Rozp. delegowane 2024/1772</td><td>Klasyfikacja incydentów ICT i cyberzagrożeń, progi istotności, treść zgłoszeń</td></tr>'+
'<tr><td>Rozp. delegowane 2024/1773</td><td>Treść polityki umów z dostawcami ICT wspierającymi funkcje krytyczne lub istotne</td></tr>'+
'<tr><td>Rozp. delegowane 2024/1774</td><td>Narzędzia, metody, procesy i polityki zarządzania ryzykiem ICT oraz uproszczone ramy</td></tr>'+
'<tr><td>Rozp. wykonawcze 2024/2956 (ITS)</td><td>Standardowe wzory rejestru informacji o umowach z dostawcami ICT</td></tr>'+
'<tr><td>Rozp. delegowane 2024/1502 i 2024/1505</td><td>Kryteria wyznaczania kluczowych dostawców ICT (CTPP) oraz opłaty nadzorcze</td></tr></table></div>'+
'<h3>Pięć filarów</h3>'+
'<ul><li><b>Zarządzanie ryzykiem ICT</b> z odpowiedzialnością organu zarządzającego. Podmioty stosują <b>pełne ramy</b> albo <b>uproszczone ramy</b> zarządzania ryzykiem ICT (art. 16 DORA, np. mniejsze podmioty), co wpływa na zakres sprawozdawczości.</li>'+
'<li><b>Incydenty</b>: zgłoszenie poważnych incydentów ICT w trzech krokach. Wstępne powiadomienie jak najszybciej, najpóźniej <b>4 godziny od zaklasyfikowania</b> jako poważny i <b>nie później niż 24 godziny od powzięcia wiadomości</b>, sprawozdanie śródokresowe do <b>72 godzin od wstępnego powiadomienia</b>, sprawozdanie końcowe <b>nie później niż miesiąc po śródokresowym</b> (lub po jego ostatniej aktualizacji). Dobrowolnie można zgłaszać znaczące cyberzagrożenia.</li>'+
'<li><b>Testy odporności</b>, w tym zaawansowane testy penetracyjne oparte na zagrożeniach (TLPT) dla wybranych podmiotów.</li>'+
'<li><b>Ryzyko dostawców ICT</b>: rejestr informacji o umowach, wymagane postanowienia umowne, oceny ryzyka i koncentracji, strategie wyjścia, nadzór nad krytycznymi dostawcami ICT (CTPP).</li>'+
'<li><b>Wymiana informacji</b> o cyberzagrożeniach w zaufanych społecznościach podmiotów finansowych (o przystąpieniu lub utracie członkostwa informuje się KNF formularzem SPR-PF-22).</li></ul>'+
'<p>Słowo klucz w sprawozdawczości to <b>KLIF</b>, czyli „krytyczne lub istotne funkcje”: funkcje, których zakłócenie istotnie pogorszyłoby wyniki finansowe, bezpieczeństwo lub ciągłość usług podmiotu albo wypełnianie obowiązków wynikających z zezwolenia. Od poprawnego wskazania KLIF zależy większość późniejszych klasyfikacji (systemy, dostawcy, procesy, kluczowi pracownicy).</p>'+
'<h3>Sprawozdawczość do KNF: katalog formularzy</h3>'+
'<div class="tablewrap"><table><tr><th>Obszar</th><th>Formularze SPR-PF</th><th>Kiedy</th></tr>'+
'<tr><td>Poważne incydenty ICT</td><td>07 (wstępne powiadomienie), 08 (śródokresowe), 09 (końcowe)</td><td>Obligatoryjnie: 4 h od klasyfikacji i maks. 24 h od powzięcia wiadomości; 72 h od wstępnego; miesiąc od śródokresowego</td></tr>'+
'<tr><td>Cyberzagrożenia</td><td>10 (znaczące cyberzagrożenie)</td><td>Dobrowolnie</td></tr>'+
'<tr><td>Koszty i uczenie się po incydentach</td><td>04 (roczne koszty i straty z poważnych incydentów), 05 (zmiany po przeglądzie poważnego incydentu)</td><td>Na żądanie KNF, w terminie z wezwania (z wyłączeniem mikroprzedsiębiorstw)</td></tr>'+
'<tr><td>Ramy zarządzania ryzykiem ICT</td><td>00 (podstawowe informacje), 01 (informacje o ryzyku i ramach), 02 (przegląd ram), 06 (przegląd ram uproszczonych)</td><td>Na żądanie KNF</td></tr>'+
'<tr><td>Dostawcy usług ICT</td><td>17 (roczne dane o nowych ustaleniach), 18 (pełny rejestr informacji), 19 (planowane umowy dot. KLIF), 20 (funkcje, które stały się krytyczne lub istotne), 21 (ryzyko dostawców, zalecenia dot. CTPP)</td><td>17 raz w roku w terminie z decyzji Europejskich Urzędów Nadzoru; 19 co najmniej 14 dni przed związaniem się umową; 20 w ciągu 14 dni od dnia, gdy funkcja stała się krytyczna lub istotna; 18 i 21 na żądanie</td></tr>'+
'<tr><td>Wymiana informacji</td><td>22 (członkostwo w zaufanej społeczności)</td><td>Po zatwierdzeniu członkostwa lub po jego utracie</td></tr>'+
'<tr><td>Kluczowe wskaźniki ryzyka (KRI)</td><td>26 (kwartalnie, ramy pełne), 27 (rocznie, ramy pełne), 30 (rocznie, ramy uproszczone)</td><td>Obligatoryjnie, cyklicznie</td></tr>'+
'<tr><td>Testy ciągłości działania</td><td>03</td><td>Tylko centralne depozyty papierów wartościowych, w razie zajścia zdarzenia</td></tr></table></div>'+
'<h3>Jak działa składanie sprawozdań (praktyka)</h3>'+
'<ul><li><b>Wyłącznie aktualne wzory</b> z Systemu Sprawozdawczości DORA (zakładka „Biblioteka – repozytorium plików”). Wzór nieaktualny lub z innego źródła nie przejdzie walidacji, a zmiana struktury arkusza (dodanie lub usunięcie komórek, formuł, układu) skutkuje odrzuceniem.</li>'+
'<li><b>Nazwa pliku</b>: [Kod UKNF podmiotu]_[Symbol modułu]_[Symbol okresu]_[Znacznik czasu].xlsx. Archiwum .zip ma tę samą nazwę, zawiera dokładnie jeden plik .xlsx, nie może być zabezpieczone hasłem, a załączniki są w formacie PDF.</li>'+
'<li><b>Wysłanie pliku to nie złożenie sprawozdania.</b> System wykonuje weryfikację techniczną i walidację (reguły XBRL oraz reguły biznesowe). Błąd techniczny przerywa przetwarzanie, błąd biznesowy oznacza formularz poprawny technicznie, ale niepoprawny merytorycznie. Poprawne sprawozdanie ma status „Proces walidacji zakończony sukcesem”, i to jego trzeba sprawdzić.</li>'+
'<li><b>Korekty</b>: składa się je niezwłocznie po stwierdzeniu błędu (także z korespondencji nadzorczej), ale nie należy ich nadużywać. Celem jest kompletne, poprawne sprawozdanie w terminie.</li>'+
'<li>Problemy z przekazaniem zgłasza się na adres konsultacje.dora@knf.gov.pl. Adres systemu sprawozdawczego podany w instrukcjach to crp.knf.gov.pl.</li></ul>'+
'<h3>Ankieta KRI (SPR-PF-26, -27, -30)</h3>'+
'<p>Kluczowe wskaźniki ryzyka dla obszaru ICT to regularne badanie nadzorcze: kwartalne dla podmiotów stosujących pełne ramy (SPR-PF-26), roczne dla pełnych (SPR-PF-27) i uproszczonych ram (SPR-PF-30). Arkusz SPR-PF-26 zawiera <b>124 mierniki w 17 obszarach</b> (m.in. architektura IT, ciągłość działania, zarządzanie dostępem, infrastruktura, outsourcing, zarządzanie podatnościami, incydenty, audyt). Dla każdego miernika podaje się wartość albo wyjaśnienie braku wartości („Brak danych” lub „Nie dotyczy”). Przykład lekcji 22 pokazuje, jak z tej ankiety uczyć się budowania własnych wskaźników.</p>'+
'<ul><li>Dane nagłówka: LEI, nazwa, kod UPN (z systemu), NIP, KRS, początek i koniec okresu oraz <b>unikalny kod UKNF sprawozdania</b> przypisany do okresu. Zły kod oznacza odrzucenie. Daty i kod podaje się według wezwania.</li>'+
'<li>Dla III kwartału 2026 komunikat KNF wskazuje okres od 1 czerwca do 30 września 2026, kod SPRPF26_202609_01 oraz termin 2 listopada 2026. Wartość „Nie” we fladze korekty wybiera się przy złożeniu w terminie, a „Tak” przy złożeniu po terminie.</li>'+
'<li>Arkusz INFO w SPR-PF-26 wypełnia się automatycznie na podstawie nagłówka (arkusz I_01.01).</li></ul>'+
'<h3>Co się zmieniło w prawie miękkim</h3>'+
'<p>Według adnotacji w arkuszu KNF, 17 stycznia 2025 r. KNF uchyliła większość „miękkiego prawa” z zakresu IT, w tym Rekomendację D dla banków i wytyczne IT dla zakładów ubezpieczeń i reasekuracji. W praktyce dokumenty i polityki w sektorze finansowym opiera się dziś na DORA i aktach delegowanych, a nie na starych rekomendacjach.</p>'+
'<p>Stan krajowej ustawy dostosowującej do DORA bywa opisywany różnie w opracowaniach, więc sprawdź aktualny stan i kompetencje KNF dla Twojego rodzaju podmiotu. Wcześniej KNF udostępniała też System Obsługi Incydentów DORA (SOID, csirt.knf.gov.pl). Instrukcje z października 2026 r. wskazują, że formularze SPR-PF-07/08/09 przekazuje się w Systemie Sprawozdawczości DORA, więc zawsze potwierdź aktualny kanał zgłoszeń w komunikatach KNF. Formularz KRI zakłada też, że do czasu opublikowania przez Europejskie Urzędy Nadzoru listy kluczowych dostawców ICT (CTPP) w miernikach OUT.08 i OUT.09 raportuje się „Nie dotyczy”: sprawdź, czy lista została już opublikowana.</p>'+
'<h2>ISO/IEC 27001 i inne normy</h2>'+
'<ul><li><b>ISO/IEC 27001:2022</b>: wymagania dla systemu zarządzania bezpieczeństwem informacji (ISMS). Rozdziały 4–10: kontekst, przywództwo, planowanie (w tym ocena ryzyka), wsparcie, działanie, ocena wyników, doskonalenie.</li>'+
'<li><b>Załącznik A</b> (zgodny z ISO/IEC 27002:2022) zawiera 93 zabezpieczenia w czterech grupach: organizacyjne, osobowe, fizyczne i technologiczne. Dobór zabezpieczeń zapisujesz w <b>Deklaracji stosowania</b> (SoA) z uzasadnieniem wyłączeń.</li>'+
'<li><b>Certyfikacja</b>: audyt etapu 1 i 2 przez jednostkę certyfikującą, potem audyty nadzoru co roku, a recertyfikacja co 3 lata. Normy powiązane: 27005 (ryzyko), 27701 (prywatność), 22301 (ciągłość działania), 42001 (zarządzanie systemami AI).</li>'+
'<li>ISMS zgodny z ISO 27001 ułatwia spełnienie wymagań SZBI z ustawy o KSC, ale nie gwarantuje zgodności z nimi. Zawsze zrób mapowanie wymagań.</li></ul>'+
'<h2>Inne regulacje warto znać</h2>'+
'<ul><li><b>Kodeks karny</b> (art. 267–269b): nielegalny dostęp do informacji, podsłuch, naruszenie integralności danych, sabotaż komputerowy, tworzenie narzędzi do ataków. Ważne dla zgłaszania przestępstw i dla zasad testów penetracyjnych (lekcja 27).</li>'+
'<li><b>Akt o cyberodporności (CRA)</b>: wymagania dla producentów produktów z elementami cyfrowymi, z obowiązkami zgłaszania aktywnie wykorzystywanych podatności, które według harmonogramu zaczynają się we wrześniu 2026 r. Sprawdź aktualne terminy.</li>'+
'<li><b>Akt o sztucznej inteligencji</b>: obowiązki wprowadzane etapami, a terminy podlegały dyskusji o zmianach. Sprawdź aktualny harmonogram.</li>'+
'<li>Branżowe: wytyczne KNF (np. dla chmury i outsourcingu), PCI DSS.</li></ul>',

  {t:"Przykład 2: wstępna kwalifikacja do NIS2 w Pythonie",
