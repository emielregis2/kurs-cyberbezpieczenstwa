LESSONS[10] = {
  lead:"Atak, którego nie widać, trwa dłużej. Uczysz się, jak sieć i systemy zostawiają ślady, jak je zbierać w jednym miejscu i jak zamienić miliony zdarzeń w kilka sensownych alertów.",
  goals:["Odróżnić IDS od IPS oraz wykrywanie sygnaturowe od anomalii","Wskazać źródła logów i ich wartość dla śledztwa","Wyjaśnić działanie SIEM: zbieranie, normalizacja, korelacja, alertowanie","Napisać prostą regułę detekcji i skrypt analizy logów"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Cele 4.4 (alerty i monitoring) i 4.9 (źródła danych do śledztwa): panele i raporty, skany podatności, przechwycone pakiety, logi zapór, aplikacji, endpointów i systemów, alerty IDS/IPS, logi sieciowe i metadane.</div>'+
'<h2>IDS i IPS</h2>'+
'<div class="tablewrap"><table><tr><th></th><th>IDS</th><th>IPS</th></tr>'+
'<tr><td>Reakcja</td><td>Loguje i alarmuje</td><td>Loguje, alarmuje i <b>blokuje</b></td></tr>'+
'<tr><td>Umiejscowienie</td><td>Poza pasmem (TAP lub port SPAN), nie wpływa na ruch</td><td>W linii (inline), widzi ruch i może go zatrzymać</td></tr>'+
'<tr><td>Ryzyko</td><td>Atak trwa, dopóki ktoś nie zareaguje</td><td>Fałszywy alarm może zablokować legalny ruch lub awaria zatrzyma sieć</td></tr></table></div>'+
'<ul><li><b>NIDS</b> obserwuje ruch w sieci, <b>HIDS</b> zdarzenia na pojedynczym hoście, <b>WIDS</b> sieć bezprzewodową (rogue AP, ataki DoS).</li>'+
'<li><b>Sygnaturowe</b>: szybkie i precyzyjne dla znanych ataków, ale ślepe na nowe (zero-day).</li>'+
'<li><b>Anomalii (behawioralne)</b>: uczą się „normalnego” ruchu i zgłaszają odchylenia. Wykrywają nowości, ale generują więcej fałszywych alarmów i wymagają dostrojenia.</li>'+
'<li><b>Fałszywy alarm</b> (false positive): zdarzenie legalne uznane za atak. <b>Fałszywy negatyw</b>: atak, którego nie wykryto. Oba są kosztowne, ale fałszywy negatyw jest groźniejszy.</li></ul>'+
'<h2>Źródła logów</h2>'+
'<div class="tablewrap"><table><tr><th>Źródło</th><th>Co mówi</th></tr>'+
'<tr><td>Zapora, router, proxy</td><td>Kto z kim próbował się połączyć, co zablokowano</td></tr>'+
'<tr><td>Systemowe i bezpieczeństwa (Windows Event Log, auth.log)</td><td>Logowania, zmiany uprawnień, uruchomienie usług</td></tr>'+
'<tr><td>Aplikacyjne i serwera WWW</td><td>Błędy, żądania, kody odpowiedzi HTTP (2xx sukces, 3xx przekierowanie, 4xx błąd klienta, 5xx błąd serwera)</td></tr>'+
'<tr><td>DNS, DHCP</td><td>Jakie domeny odpytywano, kto miał jaki adres</td></tr>'+
'<tr><td>IDS/IPS, EDR, antywirus</td><td>Wykryte zagrożenia i próby włamania</td></tr>'+
'<tr><td>NetFlow / sFlow / IPFIX</td><td>Metadane przepływów: źródło, cel, wolumen. Bez zawartości pakietów</td></tr>'+
'<tr><td>Metadane (e-mail, plików)</td><td>Nagłówki wiadomości, autor i daty zmian plików</td></tr></table></div>'+
'<h3>Zdarzenia, które warto znać</h3>'+
'<div class="tablewrap"><table><tr><th>Windows Event ID</th><th>Znaczenie</th></tr><tr><td>4624</td><td>Udane logowanie</td></tr><tr><td>4625</td><td>Nieudane logowanie</td></tr><tr><td>4672</td><td>Nadanie specjalnych uprawnień (logowanie z wysokimi prawami)</td></tr><tr><td>4720</td><td>Utworzono konto użytkownika</td></tr><tr><td>1102</td><td>Wyczyszczono dziennik zdarzeń (bardzo podejrzane)</td></tr></table></div>'+
'<p>W Linuksie logowania znajdziesz w <code>/var/log/auth.log</code> (Debian, Ubuntu) lub <code>/var/log/secure</code> (RHEL), a dziennik usług przez <code>journalctl</code>.</p>'+
'<h2>Zbieranie i centralizacja</h2>'+
'<ul><li><b>Syslog</b> (UDP 514, szyfrowany wariant TLS na 6514) zbiera zdarzenia z wielu urządzeń do jednego serwera. <b>rsyslog</b> i <b>syslog-ng</b> to wydajne implementacje, <b>NXLog</b> działa na wielu platformach.</li>'+
'<li>Centralna kopia chroni dowody: atakujący, który włamał się na serwer, często kasuje lokalne logi (por. zdarzenie 1102).</li>'+
'<li><b>NTP</b>: zsynchronizowany czas na wszystkich urządzeniach to warunek poprawnej korelacji zdarzeń.</li>'+
'<li>Retencja zgodna z wymaganiami prawnymi i wewnętrznymi, ochrona integralności logów, kontrola dostępu do nich.</li></ul>'+
'<h2>SIEM</h2>'+
'<p>SIEM (Security Information and Event Management) zbiera dane z wielu źródeł i łączy je w jedną całość. Główne funkcje:</p>'+
'<ol><li><b>Zbieranie</b> (agent na urządzeniu lub bez agenta przez standardowe protokoły: agent daje dane szczegółowe i w czasie rzeczywistym, wariant bez agenta mniej utrzymania, ale mniej szczegółów).</li>'+
'<li><b>Normalizacja i agregacja</b>: różne formaty trafiają do wspólnego schematu, duplikaty są redukowane.</li>'+
'<li><b>Korelacja</b>: łączenie zdarzeń z różnych źródeł w jedną historię.</li>'+
'<li><b>Alertowanie i dashboardy</b>: powiadomienia i przegląd trendów.</li>'+
'<li><b>Raportowanie i dowody</b> dla zgodności (RODO, PCI DSS i inne) oraz dla analizy powłamaniowej.</li></ol>'+
'<p>Popularne rozwiązania: Splunk, Elastic Stack (Elasticsearch, Logstash, Kibana, Beats), IBM QRadar, ArcSight. Fałszywe alarmy w SIEM wynikają zwykle ze złych filtrów lub monitorowania niewłaściwych hostów. Wdrożenie wymaga zdefiniowania <b>scenariuszy użycia</b> (use cases), procesu zgłoszeń, planu reakcji i regularnego polowania na zagrożenia (threat hunting).</p>'+
'<div class="callout"><strong>Zasada CISO</strong>Zbieranie wszystkiego bez planu daje drogi magazyn danych, a nie bezpieczeństwo. Zacznij od pytań: jakie ataki chcemy wykrywać i jakie logi na to pozwalają. Zadbaj o pokrycie krytycznych aktywów (tożsamość, brzeg sieci, serwery, poczta) przed dodawaniem kolejnych źródeł.</div>'+
'<div class="callout"><strong>Pokrycie monitoringiem jako wskaźnik</strong>Ankieta KRI KNF pyta o liczbę hostów objętych scentralizowanym monitoringiem (INF.05), czyli takich, które systematycznie i automatycznie wysyłają do centralnego systemu informacje o stanie, błędach i wyjątkach. Dla incydentów (BEZ.01–06) każdy incydent przypisuje się tylko do jednej kategorii: złośliwe oprogramowanie, włamanie, niedostępność lub naruszenie treści informacji. Dobrze zdefiniowane kategorie i znane pokrycie to podstawa sensownych miar w SIEM.</div>',
  ex:[
  {t:"Przykład 1: szybka analiza logowań SSH z linii poleceń",
   h:'<pre><code># przykładowy wpis w auth.log:\n# Failed password for invalid user admin from 203.0.113.9 port 51234 ssh2\n\n# adresy z największą liczbą nieudanych prób\ngrep "Failed password" /var/log/auth.log \\\n  | grep -oE "from [0-9.]+" | sort | uniq -c | sort -nr | head\n\n# udane logowania z tych samych adresów\ngrep "Accepted" /var/log/auth.log | grep -oE "from [0-9.]+" | sort | uniq -c</code></pre>'+
   '<p>Jeśli adres z dziesiątkami nieudanych prób pojawia się też w „Accepted”, to możliwe, że atak się powiódł. Takie powiązanie to właśnie korelacja.</p>'},
  {t:"Przykład 2: wykrywanie brute force w Pythonie",
   h:'<pre><code>import re\nfrom collections import defaultdict\n\nFAILED = re.compile(r"Failed password for (?:invalid user )?(\\S+) from (\\S+)")\nACCEPTED = re.compile(r"Accepted \\S+ for (\\S+) from (\\S+)")\n\nfailures = defaultdict(int)\naccepted_ips = set()\n\nwith open("auth.log", encoding="utf-8", errors="replace") as f:\n    for line in f:\n        if m := FAILED.search(line):\n            failures[m.group(2)] += 1\n        elif m := ACCEPTED.search(line):\n            accepted_ips.add(m.group(2))\n\nfor ip, n in sorted(failures.items(), key=lambda x: -x[1]):\n    if n &gt;= 5:\n        note = "  &lt;-- ten adres ma też udane logowanie, sprawdź!" if ip in accepted_ips else ""\n        print(f"{ip}: {n} nieudanych prób{note}")</code></pre>'+
   '<p>To uproszczenie: nie sprawdza kolejności zdarzeń ani okna czasowego. W SIEM reguła korelacyjna uwzględni oba. Taki skrypt możesz uruchomić jako krok przepływu n8n, który tworzy zgłoszenie w systemie ticketowym.</p>'},
  {t:"Przykład 3: reguła IDS w stylu Snort",
   h:'<pre><code>alert tcp any any -&gt; $HOME_NET 22 (\n    msg:"Mozliwy brute force SSH";\n    flow:to_server,established;\n    detection_filter:track by_src, count 5, seconds 60;\n    classtype:attempted-admin;\n    sid:1000001; rev:1;\n)</code></pre>'+
   '<p>Rozbiór: akcja <code>alert</code> (IDS, w IPS użyłbyś <code>drop</code>), protokół, adresy i porty źródłowe, kierunek <code>-&gt;</code>, cel (sieć własna, port 22), a w nawiasie opcje: komunikat, kierunek przepływu, próg (5 zdarzeń od jednego źródła w 60 sekund), klasyfikacja i unikalny identyfikator. Dokładna składnia zależy od wersji Snort lub Suricata, więc sprawdź dokumentację swojej.</p>'},
  {t:"Przykład 4: korelacja zdarzeń w SIEM (scenariusz)",
   h:'<p>Pojedyncze zdarzenia wyglądają niewinnie, ale razem opowiadają historię:</p>'+
   '<ol><li>VPN: logowanie konta „jkowalski” z kraju, w którym nie ma pracowników.</li><li>Windows: 12 zdarzeń 4625 (nieudane logowania) na serwer plików z tego adresu VPN.</li><li>Windows: 4624, a zaraz po nim 4672 na koncie administracyjnym.</li><li>NetFlow: 8 GB danych wychodzących z serwera plików do nieznanego adresu.</li></ol>'+
   '<details><summary>Pokaż, jak powinna zareagować reguła i zespół</summary><ul><li>Reguła korelacyjna: „logowanie z nowej lokalizacji + wiele 4625 + 4672 + duży transfer wychodzący w ciągu godziny” daje alert wysokiego priorytetu.</li><li>Natychmiastowe działania: blokada konta, odcięcie sesji VPN, izolacja serwera, zabezpieczenie logów (kopia centralna).</li><li>Dalej: uruchomienie procedury reagowania na incydenty (lekcja 24), ocena, czy doszło do naruszenia danych osobowych i obowiązku zgłoszenia.</li><li>Po incydencie: poprawki detekcji (np. geofencing, MFA odporne na phishing).</li></ul></details>'}
  ],
  quiz:[
  {q:"Czym różni się IPS od IDS?",o:["IPS tylko rejestruje zdarzenia","IPS poza logowaniem i alarmowaniem aktywnie blokuje złośliwy ruch","IDS blokuje ruch, a IPS nie","Nie ma różnicy"],a:1,w:"IDS wykrywa i alarmuje, a IPS stoi w linii ruchu i dodatkowo podejmuje działania, np. blokuje pakiety."},
  {q:"Dlaczego system IDS oparty wyłącznie na sygnaturach nie wykryje ataku zero-day?",o:["Bo sygnatury działają zbyt wolno","Bo rozpoznaje tylko wzorce znanych wcześniej ataków","Bo wymaga szyfrowania","Bo działa tylko na hostach"],a:1,w:"Sygnatury opisują znane ataki. Nowy, nieznany wcześniej exploit nie ma jeszcze sygnatury, więc potrzebne są też metody behawioralne."},
  {q:"Dlaczego w środowisku SIEM tak ważna jest synchronizacja czasu (NTP)?",o:["Aby szybciej ładować dashboardy","Aby zdarzenia z różnych urządzeń można było poprawnie ułożyć w czasie i skorelować","Aby zmniejszyć rozmiar logów","Aby zaszyfrować logi"],a:1,w:"Bez spójnego czasu nie da się ustalić kolejności zdarzeń z różnych systemów, więc korelacja i analiza powłamaniowa są niewiarygodne."},
  {q:"SIEM zgłasza dużo fałszywych alarmów. Jaka jest najczęstsza przyczyna?",o:["Za dużo analityków","Niewłaściwe filtry wejściowe lub monitorowanie niewłaściwych hostów","Za krótki kabel sieciowy","Zbyt nowa wersja systemu"],a:1,w:"Źle dobrane filtry i zakres monitorowania generują szum. Dostrajanie reguł i use case’ów to stała praca zespołu."},
  {q:"Które zdarzenie Windows odpowiada nieudanemu logowaniu?",o:["4624","4625","4720","1102"],a:1,w:"4625 to nieudane logowanie, 4624 udane, 4720 utworzenie konta, a 1102 wyczyszczenie dziennika zdarzeń."},
  {q:"Atakujący po włamaniu usuwa logi na zaatakowanym serwerze. Co najlepiej chroni dowody?",o:["Wyłączenie logowania","Centralne przesyłanie logów (syslog/SIEM) na osobny, chroniony serwer","Zmiana nazwy pliku z logami","Skrócenie retencji"],a:1,w:"Kopia przesyłana w czasie rzeczywistym na osobny serwer pozostaje nienaruszona, nawet jeśli lokalne logi zostaną skasowane."}
  ]
};

LESSONS[11] = {
  lead:"Kto ma dostęp do czego, dlaczego i na jak długo? IAM odpowiada na te pytania w całym cyklu życia konta, od zatrudnienia po odejście pracownika. Błędy w tym obszarze to dziś jedna z głównych dróg do włamania.",
  goals:["Odróżnić identyfikację, uwierzytelnianie, autoryzację i rozliczalność","Porównać modele kontroli dostępu: DAC, MAC, RBAC, ABAC","Zaprojektować macierz ról z rozdziałem obowiązków","Opisać cykl życia konta (joiner, mover, leaver) i rolę PAM"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>IAM, modele kontroli dostępu, PAM i zarządzanie kontami to domena 4 (operacje bezpieczeństwa) oraz domena 1 (koncepcje bezpieczeństwa). Pytania są zwykle scenariuszowe.</div>'+
'<h2>Cztery pytania IAM</h2>'+
'<div class="tablewrap"><table><tr><th>Etap</th><th>Pytanie</th><th>Przykład</th></tr>'+
'<tr><td>Identyfikacja</td><td>Kim twierdzisz, że jesteś?</td><td>Nazwa użytkownika, ID pracownika</td></tr>'+
'<tr><td>Uwierzytelnianie</td><td>Udowodnij to</td><td>Hasło, kod z aplikacji, klucz FIDO2</td></tr>'+
'<tr><td>Autoryzacja</td><td>Co ci wolno?</td><td>Prawo odczytu folderu finansów</td></tr>'+
'<tr><td>Rozliczalność</td><td>Co zrobiłeś?</td><td>Logi dostępu i zmian</td></tr></table></div>'+
'<h2>Modele kontroli dostępu</h2>'+
'<div class="tablewrap"><table><tr><th>Model</th><th>Kto decyduje</th><th>Typowe zastosowanie</th></tr>'+
'<tr><td><b>DAC</b></td><td>Właściciel zasobu</td><td>Uprawnienia plików w Windows i Linuksie</td></tr>'+
'<tr><td><b>MAC</b></td><td>System, na podstawie etykiet (np. poufne, tajne)</td><td>Środowiska rządowe, SELinux</td></tr>'+
'<tr><td><b>RBAC</b></td><td>Rola przypisana do stanowiska</td><td>Firmy: „księgowy”, „helpdesk”, „administrator”</td></tr>'+
'<tr><td><b>ABAC</b></td><td>Reguły na atrybutach: użytkownik, zasób, kontekst (czas, lokalizacja, urządzenie)</td><td>Zero Trust, chmura, polityki warunkowe</td></tr>'+
'<tr><td><b>Rule-based</b></td><td>Reguły stałe dla wszystkich (np. dostęp tylko w godzinach pracy)</td><td>Zapory, ACL</td></tr></table></div>'+
'<h3>Zasady, które stosujemy w każdym modelu</h3>'+
'<ul><li><b>Najmniejsze uprawnienia</b> i <b>need-to-know</b>.</li>'+
'<li><b>Rozdział obowiązków</b> (separation of duties): jedna osoba nie powinna móc zarówno utworzyć, jak i zatwierdzić przelewu. Powiązane: rotacja stanowisk i obowiązkowy urlop, które pomagają wykryć nadużycia.</li>'+
'<li><b>Zasada czterech oczu</b> dla operacji krytycznych.</li>'+
'<li><b>Domyślna odmowa</b> i jawne przyznawanie dostępu.</li></ul>'+
'<h2>Cykl życia tożsamości: JML</h2>'+
'<ol><li><b>Joiner</b>: nowa osoba dostaje konto i uprawnienia wynikające z roli (najlepiej automatycznie z systemu HR).</li>'+
'<li><b>Mover</b>: przy zmianie stanowiska stare uprawnienia są odbierane. Ich nagromadzenie to <i>privilege creep</i>.</li>'+
'<li><b>Leaver</b>: konto jest wyłączane w dniu odejścia, a sesje, tokeny i klucze odwoływane. Zapomniane konta to <i>osierocone konta</i>, ulubiony cel atakujących.</li>'+
'<li><b>Okresowa rewizja uprawnień</b> (access review): właściciele zasobów potwierdzają, kto powinien mieć dostęp.</li></ol>'+
'<h2>Typy kont</h2>'+
'<ul><li><b>Użytkownika</b>, <b>uprzywilejowane</b> (administratorzy), <b>usługowe</b> (aplikacje, bez interaktywnego logowania), <b>gościa</b>, <b>domyślne</b> (do usunięcia lub zablokowania) oraz <b>współdzielone</b> (unikać: brak rozliczalności).</li>'+
'<li>Administratorzy mają osobne konta administracyjne, a konta serwisowe powinny mieć minimalne prawa i rotowane sekrety.</li></ul>'+
'<h2>PAM: zarządzanie dostępem uprzywilejowanym</h2>'+
'<p>Konta uprzywilejowane to „klucze do królestwa”, więc wymagają dodatkowej ochrony:</p>'+
'<ul><li><b>Just-in-Time</b>: uprawnienia administracyjne nadawane na czas zadania i automatycznie odbierane.</li>'+
'<li><b>Sejf haseł</b> (password vaulting): hasła przechowywane w sejfie, wydawane na żądanie i rotowane po użyciu.</li>'+
'<li><b>Poświadczenia efemeryczne</b>, zatwierdzanie żądań, <b>nagrywanie sesji</b>, wymuszone MFA.</li></ul>'+
'<h2>Katalogi i silne hasła</h2>'+
'<p>Użytkownicy są zwykle w katalogu (Active Directory, LDAP), a aplikacje korzystają z niego przez LDAPS lub przez federację (lekcja 12). Praktyki dotyczące haseł: długość co najmniej 12 znaków, brak powtórzeń i typowych wzorców, sprawdzanie haseł z list wycieków i menedżer haseł. Hasło jest tylko jednym z czynników (lekcja 12).</p>'+
'<h2>Biometria: błędy decyzji</h2>'+
'<ul><li><b>FAR</b> (False Acceptance Rate): przyjęcie osoby nieuprawnionej. Groźniejszy dla bezpieczeństwa.</li>'+
'<li><b>FRR</b> (False Rejection Rate): odrzucenie uprawnionego. Dokuczliwy dla użytkownika.</li>'+
'<li><b>CER/EER</b>: punkt, w którym FAR i FRR są równe. Im niższy, tym dokładniejszy system.</li></ul>',
  ex:[
  {t:"Przykład 1: macierz ról z kontrolą rozdziału obowiązków",
   h:'<div class="tablewrap"><table><tr><th>Rola</th><th>ERP: faktury</th><th>ERP: płatności</th><th>AD: reset haseł</th><th>Serwery: administracja</th></tr>'+
   '<tr><td>Księgowy</td><td>tworzenie</td><td>-</td><td>-</td><td>-</td></tr>'+
   '<tr><td>Główny księgowy</td><td>odczyt, zatwierdzanie</td><td>zatwierdzanie</td><td>-</td><td>-</td></tr>'+
   '<tr><td>Helpdesk</td><td>-</td><td>-</td><td>tak (bez kont uprzywilejowanych)</td><td>-</td></tr>'+
   '<tr><td>Administrator systemów</td><td>-</td><td>-</td><td>tak</td><td>tak (przez PAM, JIT)</td></tr></table></div>'+
   '<details><summary>Gdzie jest konflikt rozdziału obowiązków i co zrobić?</summary><p>Jeśli ktoś dostanie jednocześnie „tworzenie faktur” i „zatwierdzanie płatności”, może sam wystawić i wypłacić fałszywą fakturę. W systemie IAM definiujesz reguły konfliktu (toxic combinations) i blokujesz lub wymagasz zatwierdzenia wyjątku przez właściciela procesu.</p></details>'},
  {t:"Przykład 2: zarządzanie kontami w Linuksie",
   h:'<pre><code># konto z grupą, bez uprawnień sudo\nsudo useradd -m -s /bin/bash -G finanse anna\nsudo passwd anna\nsudo chage -M 90 -m 1 -W 14 anna       # wiek hasła (jeśli wymaga tego polityka)\n\n# wyłączenie konta odchodzącego pracownika (nie kasuj od razu: ślady i dane!)\nsudo usermod -L -e 1 jan               # zablokuj hasło i wygaś konto\nsudo pkill -KILL -u jan                # zakończ sesje\n\n# ograniczone sudo: tylko restart jednej usługi\necho "%helpdesk ALL=(root) /usr/bin/systemctl restart nginx" | sudo tee /etc/sudoers.d/helpdesk\nsudo chmod 440 /etc/sudoers.d/helpdesk\nsudo visudo -c                          # sprawdź składnię plików sudoers</code></pre>'+
   '<p>Zwróć uwagę na ostatni przykład: zamiast pełnego dostępu root, grupa dostaje prawo do jednego polecenia. To zasada najmniejszych uprawnień w praktyce.</p>'},
  {t:"Przykład 3: rewizja uprawnień w Pythonie",
   h:'<p>Porównujesz uprawnienia wynikające z roli z faktycznie nadanymi oraz listę kont z listą aktywnych pracowników z HR.</p>'+
   '<pre><code>ROLE_ALLOWED = {\n    "ksiegowy": {"erp:faktury_tworzenie"},\n    "helpdesk": {"ad:reset_hasel"},\n}\n\nactual = {                      # eksport z systemu\n    "anna": ("ksiegowy", {"erp:faktury_tworzenie", "erp:platnosci_zatwierdzanie"}),\n    "tomek": ("helpdesk", {"ad:reset_hasel"}),\n    "jan": ("ksiegowy", {"erp:faktury_tworzenie"}),\n}\nactive_hr = {"anna", "tomek"}    # jan odszedł z firmy\n\nfor user, (role, perms) in actual.items():\n    if user not in active_hr:\n        print(f"OSIEROCONE KONTO: {user}")\n    extra = perms - ROLE_ALLOWED[role]\n    if extra:\n        print(f"NADMIAROWE UPRAWNIENIA {user}: {sorted(extra)}")</code></pre>'+
   '<p>Wynik wskaże konto „jan” (osierocone) i nadmiarowe prawo zatwierdzania płatności u „anna” (privilege creep i konflikt rozdziału obowiązków). W praktyce dane pochodzą z eksportu AD lub IdP, a wyniki trafiają do właścicieli zasobów do akceptacji.</p>'+
   '<div class="callout"><strong>Jak mierzy to regulator</strong>W ankiecie KRI KNF (DORA) higienę tożsamości opisują cztery liczby: wszystkie konta w środowisku ICT (DOS.01), konta w środowiskach zewnętrznych (DOS.02), konta uprzywilejowane (DOS.03) i konta objęte przeglądem uprawnień w okresie (DOS.04). Konta stale zablokowane nie wchodzą do liczenia. Z tych liczb łatwo policzyć własne wskaźniki: udział kont uprzywilejowanych i pokrycie rewizjami. Dostęp fizyczny do stref o ograniczonym dostępie mierzą BFI.02 (liczba osób uprawnionych) i BFI.03 (data ostatniej kontroli praw).</div>'},
  {t:"Przykład 4: scenariusze JML",
   h:'<div class="tablewrap"><table><tr><th>Sytuacja</th><th>Poprawne działanie</th></tr>'+
   '<tr><td>Nowy specjalista ds. płac zaczyna w poniedziałek</td><td>Konto i role tworzone automatycznie z HR, uprawnienia wyłącznie z roli, MFA zarejestrowane na starcie</td></tr>'+
   '<tr><td>Analityk awansuje na kierownika innego działu</td><td>Stare uprawnienia odebrane, nowe z nowej roli, wpis do rewizji</td></tr>'+
   '<tr><td>Administrator odchodzi z firmy w trybie konfliktu</td><td>Natychmiastowe wyłączenie wszystkich kont, odwołanie kluczy SSH i tokenów, rotacja wspólnych sekretów, przegląd jego ostatnich działań w logach</td></tr></table></div>'}
  ],
  quiz:[
  {q:"Pracownik awansował z działu sprzedaży do finansów i nadal ma dostęp do CRM sprzedaży oraz nowe uprawnienia finansowe. Jak nazywa się to zjawisko?",o:["Rozdział obowiązków","Privilege creep (narastanie uprawnień)","Zasada najmniejszych uprawnień","Federacja"],a:1,w:"Przy zmianie stanowiska stare uprawnienia trzeba odebrać. Gdy tego nie robimy, uprawnienia narastają, a ryzyko nadużyć rośnie."},
  {q:"Która praktyka najlepiej realizuje rozdział obowiązków przy płatnościach?",o:["Jedna osoba tworzy fakturę i zatwierdza płatność dla szybkości","Jedna osoba tworzy fakturę, a inna zatwierdza płatność","Wspólne konto dla całego działu","Zatwierdzanie przez system bez człowieka"],a:1,w:"Rozdział obowiązków wymaga, by krytyczny proces był podzielony między różne osoby, co utrudnia oszustwa i pozwala wykryć błędy."},
  {q:"Który model kontroli dostępu przyznaje uprawnienia na podstawie stanowiska, np. „helpdesk” lub „księgowy”?",o:["DAC","MAC","RBAC","ABAC"],a:2,w:"RBAC (Role-Based Access Control) łączy uprawnienia z rolami przypisanymi do stanowisk. ABAC decyduje na podstawie atrybutów i kontekstu, a DAC zostawia decyzję właścicielowi zasobu."},
  {q:"Administrator dostaje prawa do serwera produkcyjnego na dwie godziny i tylko na czas konkretnej zmiany. Jak nazywa się to podejście?",o:["Just-in-Time (JIT)","Single Sign-On","Obfuscation","Tokenizacja"],a:0,w:"JIT w PAM nadaje uprawnienia na czas zadania i automatycznie je odbiera, co zmniejsza okno ryzyka związane z kontami uprzywilejowanymi."},
  {q:"System biometryczny wpuszcza osoby nieuprawnione. Który wskaźnik jest zbyt wysoki?",o:["FRR","FAR","EER","CER równe zeru"],a:1,w:"FAR (False Acceptance Rate) to odsetek przyjęć osób nieuprawnionych. FRR to odrzucanie uprawnionych."},
  {q:"Podczas audytu znajdujesz aktywne konto osoby, która odeszła z firmy pół roku temu. Co to jest i jaka jest najlepsza praktyka?",o:["Konto gościa; zostawić","Osierocone konto; wyłączać konta w dniu odejścia, automatycznie z systemu HR","Konto usługowe; zmienić hasło co rok","Konto domyślne; nic nie robić"],a:1,w:"Osierocone konta to częsty cel ataków. Proces leaver powinien być zautomatyzowany i powiązany z danymi HR."}
  ]
};

LESSONS[12] = {
  lead:"Hasło samo już nie wystarcza. Uczysz się, jak działa MFA, dlaczego jedne metody są odporne na phishing, a inne nie, oraz jak SSO, SAML, OAuth i OIDC przenoszą zaufanie między systemami.",
  goals:["Porównać czynniki uwierzytelniania i siłę metod MFA","Opisać przebieg Kerberos, SAML, OAuth 2.0 i OpenID Connect","Rozpoznać ataki na uwierzytelnianie i dobrać obronę","Zweryfikować token JWT i uruchomić testowy Keycloak"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Federacja, SSO, SAML, OAuth, Kerberos i MFA to stałe tematy egzaminu. Gdy w scenariuszu pojawia się „uwierzytelnianie przez zaufaną stronę trzecią” lub atrybuty rozszerzone, myśl o federacji.</div>'+
'<h2>Czynniki uwierzytelniania</h2>'+
'<div class="tablewrap"><table><tr><th>Czynnik</th><th>Przykłady</th><th>Słabość</th></tr>'+
'<tr><td>Coś, co wiesz</td><td>Hasło, PIN</td><td>Phishing, wycieki, zgadywanie</td></tr>'+
'<tr><td>Coś, co masz</td><td>Token sprzętowy, aplikacja, karta, klucz FIDO2</td><td>Kradzież, przejęcie numeru (SMS)</td></tr>'+
'<tr><td>Kim jesteś</td><td>Odcisk palca, twarz, tęczówka</td><td>Nie da się zmienić, fałszowanie</td></tr>'+
'<tr><td>Gdzie jesteś / jak się zachowujesz</td><td>Lokalizacja, zaufana sieć, wzorzec pisania</td><td>Pomocnicze, nie samodzielne</td></tr></table></div>'+
'<p>MFA wymaga co najmniej dwóch <i>różnych</i> czynników. Hasło plus pytanie pomocnicze to wciąż jeden czynnik (obie rzeczy „wiesz”).</p>'+
'<h3>Siła metod drugiego czynnika</h3>'+
'<div class="tablewrap"><table><tr><th>Metoda</th><th>Ocena</th><th>Uwagi</th></tr>'+
'<tr><td>SMS / połączenie</td><td>Najsłabsza</td><td>SIM swap, przechwycenie, phishing kodu</td></tr>'+
'<tr><td>TOTP (aplikacja z kodem)</td><td>Dobra</td><td>Nadal można wyłudzić kod na fałszywej stronie</td></tr>'+
'<tr><td>Powiadomienie push</td><td>Średnia</td><td>Podatne na zmęczenie MFA (spam zatwierdzeń). Pomaga dopasowanie numeru</td></tr>'+
'<tr><td>FIDO2 / WebAuthn (klucz sprzętowy, passkey)</td><td>Najlepsza</td><td>Odporna na phishing, bo uwierzytelnienie jest związane z domeną strony</td></tr>'+
'<tr><td>Karta inteligentna / certyfikat</td><td>Bardzo dobra</td><td>Wymaga infrastruktury PKI</td></tr></table></div>'+
'<h2>Ataki na uwierzytelnianie</h2>'+
'<ul><li><b>Credential stuffing</b>: użycie par login-hasło z wycieków na innych serwisach.</li>'+
'<li><b>Password spraying</b>: kilka popularnych haseł na wielu kontach (omija blokadę po N próbach).</li>'+
'<li><b>Phishing i AitM</b> (adversary-in-the-middle): fałszywa strona przekazuje dane na prawdziwą i kradnie ciasteczko sesji, więc omija zwykłe MFA.</li>'+
'<li><b>Zmęczenie MFA</b>: seria próśb zatwierdzenia, aż ofiara kliknie.</li>'+
'<li><b>Pass-the-hash</b> i kradzież ticketów Kerberos po włamaniu na stację.</li>'+
'<li><b>Kradzież tokenów</b> sesji i tokenów dostępu.</li></ul>'+
'<h2>Kerberos</h2>'+
'<p>Kerberos to protokół SSO w domenie Active Directory oparty na <b>biletach</b>. Użytkownik loguje się raz do <b>KDC</b> (kontroler domeny), dostaje <b>TGT</b>, a potem za jego pomocą pobiera bilety do konkretnych usług. Hasło nie jest wysyłane przy każdym dostępie. Bilety są ważne ograniczony czas, więc zegary muszą być zsynchronizowane (NTP), a mechanizm chroni przed odtwarzaniem komunikatów (replay). Starszy <b>NTLM</b> jest podatny na pass-the-hash i powinien być wygaszany.</p>'+
'<h2>SSO i federacja</h2>'+
'<p><b>SSO</b> pozwala zalogować się raz i korzystać z wielu aplikacji. <b>Federacja</b> rozszerza zaufanie poza jedną organizację: partner, dostawca lub klient loguje się własnymi poświadczeniami, a Twoja aplikacja (SP, service provider) ufa jego dostawcy tożsamości (IdP).</p>'+
'<div class="tablewrap"><table><tr><th></th><th>SAML 2.0</th><th>OAuth 2.0</th><th>OpenID Connect</th></tr>'+
'<tr><td>Cel</td><td>Uwierzytelnianie i atrybuty (SSO w przedsiębiorstwie)</td><td><b>Autoryzacja</b>: delegowany, ograniczony dostęp do zasobów</td><td><b>Uwierzytelnianie</b> nad OAuth</td></tr>'+
'<tr><td>Format</td><td>XML (asercja)</td><td>Tokeny dostępu (często JWT)</td><td>JWT (ID token)</td></tr>'+
'<tr><td>Typowo</td><td>Aplikacje biznesowe, partnerzy</td><td>API, „zezwól aplikacji na dostęp do kalendarza”</td><td>„Zaloguj się przez Google/Microsoft”, aplikacje mobilne i SPA</td></tr></table></div>'+
'<h3>Przebieg federacji (SAML, uproszczony)</h3>'+
'<ol><li>Użytkownik wchodzi do aplikacji (SP) i wybiera logowanie.</li><li>SP przekierowuje go do IdP.</li><li>IdP uwierzytelnia użytkownika (poświadczenia, MFA).</li><li>IdP tworzy <b>asercję</b> z tożsamością i atrybutami, podpisaną cyfrowo.</li><li>Przeglądarka wraca do SP z asercją, SP weryfikuje podpis, ważność i odbiorcę.</li><li>SP zakłada sesję. Hasło nigdy nie trafiło do SP.</li></ol>'+
'<div class="callout"><strong>OAuth to nie logowanie</strong>OAuth 2.0 mówi, co aplikacja może zrobić w imieniu użytkownika (zakresy, scopes), a nie, kim jest użytkownik. Do logowania służy OIDC, który dodaje ID token. Mylenie tych pojęć to częsty błąd projektowy i egzaminacyjny.</div>'+
'<h2>JWT: jak czytać i czego nie robić</h2>'+
'<p>JSON Web Token ma trzy części oddzielone kropkami: <code>nagłówek.ładunek.podpis</code>, zakodowane w Base64URL. Kodowanie to nie szyfrowanie: każdy może odczytać ładunek. Bezpieczeństwo daje <b>podpis</b>. Aplikacja musi sprawdzić: podpis (z oczekiwanym algorytmem), wystawcę (<code>iss</code>), odbiorcę (<code>aud</code>) i czas ważności (<code>exp</code>). Typowe błędy: akceptowanie algorytmu „none”, brak weryfikacji podpisu, zbyt długa ważność, przechowywanie tokenów w niebezpiecznym miejscu.</p>'+
'<h2>Keycloak</h2>'+
'<p>Keycloak to otwartoźródłowy serwer tożsamości (IdP) obsługujący OIDC, OAuth 2.0 i SAML. Podstawowe pojęcia: <b>realm</b> (odizolowana przestrzeń użytkowników i konfiguracji), <b>client</b> (aplikacja korzystająca z logowania), <b>role i grupy</b>, <b>mapery</b> (atrybuty w tokenach), integracja z LDAP/AD i politykami MFA. Dobrze nadaje się do laboratorium i do ochrony własnych aplikacji.</p>',
  ex:[
  {t:"Przykład 1: TOTP od środka (Python, bez bibliotek zewnętrznych)",
   h:'<p>Aplikacja uwierzytelniająca generuje kod z wspólnego sekretu i bieżącego czasu (RFC 6238). Poniżej cały algorytm.</p>'+
   '<pre><code>import base64\nimport hashlib\nimport hmac\nimport struct\nimport time\n\n\ndef totp(secret_b32: str, step: int = 30, digits: int = 6) -&gt; str:\n    key = base64.b32decode(secret_b32, casefold=True)\n    counter = struct.pack("&gt;Q", int(time.time()) // step)\n    h = hmac.new(key, counter, hashlib.sha1).digest()\n    offset = h[-1] &amp; 0x0F\n    code = (struct.unpack("&gt;I", h[offset:offset + 4])[0] &amp; 0x7FFFFFFF) % 10**digits\n    return str(code).zfill(digits)\n\n\nprint(totp("JBSWY3DPEHPK3PXP"))    # sekret testowy, nigdy produkcyjny</code></pre>'+
   '<p>Wniosek: kod zależy od sekretu i czasu, więc zegar musi być zsynchronizowany, a sekret trzeba chronić. Kod jest ważny krótko, ale nie jest związany z domeną strony, dlatego nie chroni przed phishingiem AitM, w odróżnieniu od FIDO2.</p>'},
  {t:"Przykład 2: odczyt i prawidłowa weryfikacja tokenu JWT",
   h:'<p>Odczyt ładunku (tylko do analizy, to NIE jest weryfikacja):</p>'+
   '<pre><code>import base64\nimport json\n\n\ndef b64url_decode(s: str) -&gt; bytes:\n    return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))\n\n\ndef peek(token: str):\n    header, payload, _sig = token.split(".")\n    return json.loads(b64url_decode(header)), json.loads(b64url_decode(payload))</code></pre>'+
   '<p>Prawidłowa weryfikacja z biblioteką PyJWT (<code>pip install pyjwt[crypto]</code>):</p>'+
   '<pre><code>import jwt   # PyJWT\n\nclaims = jwt.decode(\n    token,\n    key=public_key_pem,                # klucz publiczny IdP (np. z JWKS)\n    algorithms=["RS256"],              # jawnie ustaw dozwolony algorytm\n    audience="moja-aplikacja",         # sprawdza claim aud\n    issuer="https://idp.firma.pl/realms/firma",\n    options={"require": ["exp", "iss", "aud"]},\n)\nprint(claims["sub"])</code></pre>'+
   '<p>Biblioteka rzuci wyjątek przy złym podpisie, wygasłym tokenie lub niewłaściwym odbiorcy. Nigdy nie ufaj ładunkowi tokenu, którego podpisu nie sprawdziłeś.</p>'},
  {t:"Przykład 3: laboratorium Keycloak w Dockerze",
   h:'<pre><code># tylko do testów lokalnych (start-dev wyłącza wiele zabezpieczeń produkcyjnych)\ndocker run --name kc -p 8080:8080 \\\n  -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \\\n  -e KC_BOOTSTRAP_ADMIN_PASSWORD=zmien-to-haslo \\\n  quay.io/keycloak/keycloak:26.0 start-dev</code></pre>'+
   '<ol><li>Wejdź na <code>http://localhost:8080</code> i zaloguj się do konsoli administracyjnej.</li><li>Utwórz realm <i>lab</i>, potem użytkownika testowego z hasłem.</li><li>Dodaj klienta OIDC (np. <i>moja-aplikacja</i>) z poprawnym adresem przekierowania.</li><li>Włącz wymaganie drugiego czynnika (OTP) w przepływie uwierzytelniania.</li><li>Zaloguj się w konsoli konta i obejrzyj wystawiony token (np. w jwt.io lub funkcją <code>peek</code> z poprzedniego przykładu).</li></ol>'+
   '<div class="callout warn"><strong>Uwaga</strong>Zmienne środowiskowe administratora różnią się między wersjami Keycloak (starsze używają KEYCLOAK_ADMIN). Sprawdź dokumentację wersji, której używasz. Nigdy nie uruchamiaj trybu start-dev na produkcji.</div>'},
  {t:"Przykład 4: dobierz MFA do ryzyka",
   h:'<div class="tablewrap"><table><tr><th>Scenariusz</th><th>Rekomendacja</th></tr>'+
   '<tr><td>Administratorzy i konta uprzywilejowane</td><td>Klucze FIDO2 (odporne na phishing), PAM z JIT</td></tr>'+
   '<tr><td>Pracownicy, poczta i VPN</td><td>Aplikacja z dopasowaniem numeru lub passkey. Wyłącz SMS tam, gdzie to możliwe</td></tr>'+
   '<tr><td>Partnerzy zewnętrzni</td><td>Federacja z ich IdP (SAML/OIDC), warunki dostępu z kontekstem</td></tr>'+
   '<tr><td>Klienci sklepu</td><td>Logowanie przez OIDC lub passkey, opcjonalnie TOTP. Kontroluj tarcie dla użytkownika</td></tr></table></div>'}
  ],
  quiz:[
  {q:"Która metoda drugiego czynnika jest najbardziej odporna na phishing?",o:["Kod SMS","Kod z aplikacji TOTP","Klucz sprzętowy FIDO2/WebAuthn","Pytanie pomocnicze"],a:2,w:"FIDO2 wiąże uwierzytelnienie z prawdziwą domeną, więc fałszywa strona nie uzyska użytecznej odpowiedzi. Kody SMS i TOTP można wyłudzić."},
  {q:"Aplikacja chce uzyskać ograniczony dostęp do kalendarza użytkownika bez poznania jego hasła. Który standard jest właściwy?",o:["SAML jako mechanizm autoryzacji API","OAuth 2.0","Kerberos","LDAP bind"],a:1,w:"OAuth 2.0 służy do delegowanej autoryzacji z zakresami (scopes). Do logowania użytkownika używa się OIDC, który działa nad OAuth."},
  {q:"W federacji SAML kto wystawia podpisaną asercję potwierdzającą tożsamość użytkownika?",o:["Aplikacja (SP)","Dostawca tożsamości (IdP)","Przeglądarka użytkownika","Serwer DNS"],a:1,w:"IdP uwierzytelnia użytkownika i wystawia podpisaną asercję. SP ją weryfikuje i ufa IdP, więc nie przetwarza hasła."},
  {q:"Użytkownicy nie mogą się logować przez Kerberos po zmianie ustawień czasu na serwerze. Co jest prawdopodobną przyczyną?",o:["Zbyt długie hasła","Rozsynchronizowanie zegarów: bilety Kerberos są czasowe","Brak ruchu UDP 53","Zbyt wiele grup"],a:1,w:"Kerberos wymaga zsynchronizowanych zegarów (zwykle tolerancja kilku minut), co chroni też przed odtwarzaniem biletów."},

LESSONS[13] = {
  lead:"Kryptografia jest fundamentem poufności, integralności i autentyczności. Nie musisz być matematykiem, ale musisz wiedzieć, jakiego narzędzia użyć do jakiego problemu i jak nie wymyślić własnej, słabej wersji.",
  goals:["Odróżnić szyfrowanie symetryczne, asymetryczne i podejście hybrydowe","Wyjaśnić działanie skrótów, soli, rozciągania kluczy i podpisów cyfrowych","Dobrać prymityw do zadania (poufność, integralność, niezaprzeczalność, hasła)","Użyć w Pythonie AES-GCM, scrypt i podpisu Ed25519"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Domena 1 (rozwiązania kryptograficzne): stany danych, algorytmy, skróty, podpisy, narzędzia (TPM, HSM, KMS), obfuskacja oraz ataki kryptograficzne.</div>'+
'<h2>Stany danych</h2>'+
'<ul><li><b>W spoczynku</b> (at rest): dyski, bazy, kopie. Szyfrowanie dysku i bazy.</li>'+
'<li><b>W tranzycie</b> (in transit): TLS, SSH, IPsec.</li>'+
'<li><b>W użyciu</b> (in use): dane w pamięci podczas przetwarzania. Chronią je m.in. enklawy sprzętowe (secure enclave, TEE).</li></ul>'+
'<h2>Szyfrowanie symetryczne</h2>'+
'<p>Jeden klucz do szyfrowania i odszyfrowywania. Jest <b>szybkie</b>, więc służy do dużych ilości danych. Problem to bezpieczne przekazanie klucza i rosnąca liczba kluczy przy wielu uczestnikach.</p>'+
'<div class="tablewrap"><table><tr><th>Algorytm</th><th>Klucz</th><th>Status</th></tr>'+
'<tr><td>DES</td><td>56 bitów</td><td>Złamany, nie używać</td></tr>'+
'<tr><td>3DES</td><td>112/168 bitów</td><td>Przestarzały</td></tr>'+
'<tr><td>AES</td><td>128, 192, 256 bitów</td><td>Standard. Zalecany tryb uwierzytelniony (GCM)</td></tr>'+
'<tr><td>ChaCha20-Poly1305</td><td>256 bitów</td><td>Nowoczesny szyfr strumieniowy, szybki bez sprzętowego AES</td></tr>'+
'<tr><td>Blowfish, Twofish</td><td>do 448 / 256 bitów</td><td>Spotykane w narzędziach (np. dyski)</td></tr></table></div>'+
'<p>Szyfry <b>blokowe</b> (AES) przetwarzają bloki danych i wymagają <b>trybu pracy</b>. <b>ECB</b> szyfruje identyczne bloki identycznie i zdradza wzorce, więc nie używamy go. <b>CBC</b> wymaga wektora inicjującego (IV) i osobnej kontroli integralności. <b>GCM</b> to tryb <i>uwierzytelniony</i> (AEAD): zapewnia poufność i integralność jednocześnie. Szyfry <b>strumieniowe</b> szyfrują bit po bicie lub bajt po bajcie. Kluczowa zasada: <b>nonce/IV nie może się powtarzać</b> dla tego samego klucza.</p>'+
'<h2>Szyfrowanie asymetryczne</h2>'+
'<p>Para kluczy: <b>publiczny</b> (rozdawany swobodnie) i <b>prywatny</b> (tajny). Rozwiązuje problem dystrybucji kluczy, ale jest wolniejsze.</p>'+
'<ul><li><b>RSA</b>: szyfrowanie, wymiana kluczy, podpisy. Zalecane klucze co najmniej 2048, lepiej 3072 bity.</li>'+
'<li><b>ECC</b> (m.in. ECDSA, Ed25519, ECDH): krótsze klucze przy porównywalnej sile, dobre dla urządzeń mobilnych i IoT.</li>'+
'<li><b>Diffie-Hellman</b> (DH/ECDHE): uzgadnianie wspólnego klucza przez niezabezpieczony kanał. Samo DH jest podatne na MITM, więc wymaga uwierzytelnienia. Wersje efemeryczne dają forward secrecy.</li></ul>'+
'<div class="callout"><strong>Zasada z egzaminu</strong>Poufność: szyfruj <b>kluczem publicznym odbiorcy</b>, odszyfrowuje jego klucz prywatny. Podpis: podpisujesz <b>własnym kluczem prywatnym</b>, a każdy weryfikuje Twoim kluczem publicznym.</div>'+
'<h3>Podejście hybrydowe</h3>'+
'<p>W praktyce (TLS, PGP, S/MIME) asymetria służy do bezpiecznego uzgodnienia lub przesłania klucza sesji, a dane szyfruje szybki szyfr symetryczny.</p>'+
'<h2>Funkcje skrótu (hash)</h2>'+
'<p>Funkcja jednokierunkowa: z danych o dowolnej długości powstaje skrót o stałej długości. Małą zmianę danych widać w dużej zmianie skrótu. Dobry skrót jest odporny na <b>kolizje</b> (dwa różne wejścia, ten sam skrót).</p>'+
'<ul><li><b>MD5</b> i <b>SHA-1</b>: złamane pod kątem kolizji. Nie do podpisów i bezpieczeństwa.</li>'+
'<li><b>SHA-256/384/512</b> (SHA-2) i <b>SHA-3</b>: obecne standardy.</li>'+
'<li><b>HMAC</b>: skrót z kluczem. Zapewnia integralność i autentyczność wiadomości.</li></ul>'+
'<h3>Przechowywanie haseł</h3>'+
'<p>Zwykły SHA-256 jest <i>za szybki</i>: atakujący sprawdza miliardy haseł na sekundę. Hasła przechowuj z <b>solą</b> (unikalna losowa wartość na użytkownika, niweluje tablice tęczowe) i algorytmem <b>rozciągającym klucz</b>, celowo powolnym i wymagającym pamięci: <b>Argon2</b>, <b>scrypt</b>, <b>bcrypt</b>, <b>PBKDF2</b>. Opcjonalnie dodaje się „pieprz” (pepper), czyli tajny składnik trzymany poza bazą.</p>'+
'<h2>Podpis cyfrowy</h2>'+
'<ol><li>Nadawca liczy skrót wiadomości.</li><li>Podpisuje skrót swoim kluczem prywatnym.</li><li>Odbiorca weryfikuje podpis kluczem publicznym nadawcy i porównuje skrót z własnym.</li></ol>'+
'<p>Daje to: <b>integralność</b>, <b>autentyczność</b> i <b>niezaprzeczalność</b>. Nie daje poufności, bo treść może być jawna.</p>'+
'<h2>Szyfrowanie, skrót, kodowanie, podpis</h2>'+
'<div class="tablewrap"><table><tr><th></th><th>Odwracalne?</th><th>Klucz?</th><th>Po co</th></tr>'+
'<tr><td>Szyfrowanie</td><td>Tak (z kluczem)</td><td>Tak</td><td>Poufność</td></tr>'+
'<tr><td>Skrót</td><td>Nie</td><td>Nie (HMAC: tak)</td><td>Integralność, hasła</td></tr>'+
'<tr><td>Kodowanie (Base64)</td><td>Tak, dla każdego</td><td>Nie</td><td>Format danych. To nie zabezpieczenie</td></tr>'+
'<tr><td>Podpis</td><td>Weryfikacja</td><td>Para kluczy</td><td>Autentyczność, niezaprzeczalność</td></tr></table></div>'+
'<h2>Zarządzanie kluczami i obfuskacja</h2>'+
'<ul><li>Cykl życia klucza: generowanie (dobry generator losowy), przechowywanie, użycie, <b>rotacja</b>, archiwizacja, <b>zniszczenie</b>. Nigdy nie trzymaj kluczy w kodzie ani repozytorium.</li>'+
'<li><b>TPM</b> (układ w urządzeniu), <b>HSM</b> (sprzętowy moduł bezpieczeństwa), <b>KMS</b> (usługa zarządzania kluczami w chmurze).</li>'+
'<li><b>Tokenizacja</b> zastępuje dane tokenem (np. numer karty), <b>maskowanie</b> ukrywa część pola, <b>steganografia</b> ukrywa istnienie wiadomości. Obfuskacja to nie szyfrowanie.</li></ul>'+
'<h2>Ataki i zagrożenia</h2>'+
'<ul><li>Brute force, słownikowe, <b>tablice tęczowe</b> (obrona: sól).</li><li><b>Kolizje</b> i atak urodzinowy.</li><li><b>Downgrade</b>: zmuszenie stron do słabszej wersji protokołu.</li><li><b>Komputery kwantowe</b> zagrażają RSA i ECC. Trwa standaryzacja kryptografii postkwantowej, a ryzyko „zbierz teraz, odszyfruj później” dotyczy danych o długiej wartości.</li><li>Błędy implementacji (powtórzony nonce, słaby generator losowy) są częstsze niż złamanie algorytmu. Zasada Kerckhoffsa: bezpieczeństwo ma wynikać z tajności klucza, a nie algorytmu. Nie twórz własnej kryptografii.</li></ul>',
  ex:[
  {t:"Przykład 1: szyfrowanie uwierzytelnione AES-GCM w Pythonie",
   h:'<pre><code># pip install cryptography\nimport os\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\n\nkey = AESGCM.generate_key(bit_length=256)      # w praktyce: z KMS/HSM, nie z kodu\naes = AESGCM(key)\n\nnonce = os.urandom(12)                         # NIGDY nie używaj dwa razy z tym samym kluczem\ndane = "Wynagrodzenia Q3".encode()\nnaglowek = b"dokument-hr-v1"                   # dane uwierzytelniane, ale niezaszyfrowane\n\nszyfrogram = aes.encrypt(nonce, dane, naglowek)\nprint(aes.decrypt(nonce, szyfrogram, naglowek))\n\n# zmiana choćby jednego bajtu szyfrogramu lub nagłówka kończy się wyjątkiem InvalidTag\n</code></pre>'+
   '<p>Tryb GCM zwraca błąd, jeśli ktoś zmodyfikował dane. To różnica względem zwykłego CBC, który wymagałby osobnego mechanizmu integralności.</p>'},
  {t:"Przykład 2: bezpieczne przechowywanie hasła (scrypt) a zwykły SHA-256",
   h:'<pre><code>import hashlib\nimport hmac\nimport os\n\n\ndef hash_password(password: str):\n    salt = os.urandom(16)\n    digest = hashlib.scrypt(password.encode(), salt=salt, n=2**14, r=8, p=1, dklen=32)\n    return salt, digest\n\n\ndef verify(password: str, salt: bytes, expected: bytes) -&gt; bool:\n    digest = hashlib.scrypt(password.encode(), salt=salt, n=2**14, r=8, p=1, dklen=32)\n    return hmac.compare_digest(digest, expected)    # stały czas porównania\n\n\nsalt, stored = hash_password("Kot-Pije-Mleko-2026")\nprint(verify("Kot-Pije-Mleko-2026", salt, stored))   # True\nprint(verify("zle-haslo", salt, stored))             # False</code></pre>'+
   '<p>W systemach produkcyjnych użyj sprawdzonej biblioteki (np. argon2-cffi lub bcrypt) i dostosuj parametry kosztu do sprzętu. Zapisujesz sól i parametry razem ze skrótem.</p>'},
  {t:"Przykład 3: podpis cyfrowy Ed25519",
   h:'<pre><code>from cryptography.exceptions import InvalidSignature\nfrom cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey\n\nprywatny = Ed25519PrivateKey.generate()\npubliczny = prywatny.public_key()\n\numowa = b"Umowa nr 17/2026, kwota 120 000 PLN"\npodpis = prywatny.sign(umowa)\n\ntry:\n    publiczny.verify(podpis, umowa)\n    print("Podpis poprawny")\n    publiczny.verify(podpis, b"Umowa nr 17/2026, kwota 920 000 PLN")\nexcept InvalidSignature:\n    print("Dokument zmieniony lub podpis fałszywy")</code></pre>'+
   '<p>Pokazuje integralność i autentyczność: zmiana jednego znaku unieważnia podpis. Skąd odbiorca wie, że klucz publiczny naprawdę należy do nadawcy? Odpowiedź to PKI, czyli następna lekcja.</p>'},
  {t:"Przykład 4: dobierz narzędzie do zadania",
   h:'<div class="tablewrap"><table><tr><th>Zadanie</th><th>Narzędzie</th></tr>'+
   '<tr><td>Zaszyfrować dysk laptopa</td><td>Szyfrowanie symetryczne całego dysku (AES, BitLocker/LUKS), klucz chroniony TPM</td></tr>'+
   '<tr><td>Wysłać pliki partnerowi, który ma Twój klucz publiczny</td><td>Szyfrowanie hybrydowe (np. PGP): klucz publiczny odbiorcy</td></tr>'+
   '<tr><td>Udowodnić, że aktualizacja pochodzi od nas</td><td>Podpis cyfrowy kluczem prywatnym wydawcy</td></tr>'+
   '<tr><td>Wykryć zmianę pliku konfiguracyjnego</td><td>Skrót SHA-256 (lub HMAC, gdy chcesz też uwierzytelnić źródło)</td></tr>'+
   '<tr><td>Przechować hasła użytkowników</td><td>Argon2/bcrypt/scrypt z solą, nie szyfrowanie ani szybki skrót</td></tr>'+
   '<tr><td>Ukryć numery kart w testowej bazie</td><td>Tokenizacja lub maskowanie</td></tr></table></div>'}
  ],
  quiz:[
  {q:"Alicja wysyła poufną wiadomość do Bartka, używając szyfrowania asymetrycznego. Którego klucza użyje do szyfrowania?",o:["Własnego klucza prywatnego","Własnego klucza publicznego","Klucza publicznego Bartka","Klucza prywatnego Bartka"],a:2,w:"Do poufności szyfruje się kluczem publicznym odbiorcy, a odszyfrować może tylko właściciel odpowiadającego klucza prywatnego."},
  {q:"Co zapewnia podpis cyfrowy wiadomości?",o:["Poufność treści","Integralność, autentyczność i niezaprzeczalność","Tylko dostępność","Kompresję danych"],a:1,w:"Podpis (skrót podpisany kluczem prywatnym) potwierdza, że treść się nie zmieniła i że pochodzi od właściciela klucza. Poufności nie zapewnia, o ile nie zaszyfrowano treści."},
  {q:"Dlaczego do haseł dodaje się unikalną sól?",o:["Aby przyspieszyć logowanie","Aby to samo hasło miało różne skróty i uniemożliwić użycie gotowych tablic tęczowych","Aby szyfrować bazę","Aby skrócić hasła"],a:1,w:"Sól jest losowa i unikalna na użytkownika, więc identyczne hasła dają różne skróty, a wstępnie obliczone tablice stają się bezużyteczne."},
  {q:"Dlaczego w TLS stosuje się podejście hybrydowe?",o:["Bo AES jest wolniejszy od RSA","Bo asymetryczna kryptografia bezpiecznie uzgadnia klucz, a szybki szyfr symetryczny szyfruje dane","Bo certyfikaty szyfrują dane","Bo to wymóg DNS"],a:1,w:"Kryptografia asymetryczna rozwiązuje problem dystrybucji kluczy, ale jest wolna. Dlatego służy do uzgodnienia klucza sesji, a dane chroni szyfr symetryczny."},
  {q:"Który tryb pracy AES zapewnia jednocześnie poufność i integralność (AEAD)?",o:["ECB","CBC","GCM","Żaden, AES nie ma trybów"],a:2,w:"GCM to tryb uwierzytelniony. ECB zdradza wzorce, a CBC wymaga osobnego mechanizmu integralności."},
  {q:"Którego rozwiązania użyjesz do przechowywania haseł użytkowników w bazie?",o:["Szyfrowanie AES z jednym kluczem w kodzie","SHA-256 bez soli","Argon2, bcrypt lub scrypt z solą","Base64"],a:2,w:"Hasła chroni się wolnym, kosztownym algorytmem z solą. Base64 to kodowanie, a szybkie skróty bez soli są łatwe do złamania."}

LESSONS[14] = {
  lead:"Kryptografia asymetryczna działa tylko wtedy, gdy wiesz, czyj jest klucz publiczny. PKI tworzy to zaufanie. Poznajesz certyfikaty, urzędy certyfikacji oraz narzędzia, których realnie używa się do ochrony dysków, plików i poczty.",
  goals:["Opisać komponenty PKI i łańcuch zaufania","Odczytać pola certyfikatu X.509 i wskazać typowe problemy","Wyjaśnić CRL, OCSP, stapling, escrow i rolę HSM","Użyć OpenSSL, GPG i narzędzi do szyfrowania dysków oraz zbudować prosty inwentarz certyfikatów"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>PKI, cykl życia certyfikatów, unieważnianie i narzędzia szyfrujące należą do najczęściej testowanych zagadnień kryptograficznych (domena 1).</div>'+
'<h2>Komponenty PKI</h2>'+
'<div class="tablewrap"><table><tr><th>Element</th><th>Rola</th></tr>'+
'<tr><td><b>CA</b> (Certificate Authority)</td><td>Zaufana strona, która wystawia i podpisuje certyfikaty</td></tr>'+
'<tr><td><b>Root CA</b></td><td>Główny urząd, samopodpisany, kotwica zaufania. Trzymany <b>offline</b> i chroniony (HSM)</td></tr>'+
'<tr><td><b>Intermediate CA</b></td><td>Pośredni urząd wystawiający certyfikaty na co dzień. Kompromitacja nie niszczy roota</td></tr>'+
'<tr><td><b>RA</b> (Registration Authority)</td><td>Weryfikuje tożsamość wnioskodawcy i przekazuje wniosek do CA</td></tr>'+
'<tr><td><b>CSR</b></td><td>Wniosek o certyfikat: dane podmiotu i klucz <b>publiczny</b>. Klucz prywatny zostaje u wnioskodawcy</td></tr>'+
'<tr><td><b>CRL</b></td><td>Lista unieważnionych certyfikatów publikowana przez CA</td></tr>'+
'<tr><td><b>OCSP</b></td><td>Zapytanie o status jednego certyfikatu. Szybsze niż pobieranie CRL</td></tr>'+
'<tr><td><b>OCSP stapling</b></td><td>Serwer dołącza świeżą odpowiedź OCSP do uzgodnienia TLS, co przyspiesza walidację i chroni prywatność klienta</td></tr></table></div>'+
'<h2>Certyfikat X.509</h2>'+
'<ul><li><b>Subject</b> (podmiot) i <b>Issuer</b> (wystawca).</li><li><b>Serial number</b> (numer seryjny), <b>Validity</b> (okres ważności).</li><li><b>Public Key</b> i algorytm.</li><li><b>SAN</b> (Subject Alternative Name): lista nazw (DNS, IP, e-mail) dla których certyfikat jest ważny. Nowoczesne przeglądarki sprawdzają SAN, nie CN.</li><li><b>Key Usage / Extended Key Usage</b>: do czego wolno użyć klucza (TLS serwera, podpis kodu, e-mail).</li><li><b>Podpis wystawcy</b>.</li></ul>'+
'<p>Weryfikacja polega na prześledzeniu łańcucha: certyfikat serwera, certyfikat pośredni, root w magazynie zaufanych. Każdy podpis musi być poprawny, nazwa zgodna, termin ważny i certyfikat nieunieważniony.</p>'+
'<h3>Rodzaje certyfikatów</h3>'+
'<div class="tablewrap"><table><tr><th>Typ</th><th>Opis</th></tr>'+
'<tr><td>DV / OV / EV</td><td>Poziomy weryfikacji: domeny, organizacji, rozszerzona</td></tr>'+
'<tr><td>Wildcard (*.firma.pl)</td><td>Jeden certyfikat dla wielu subdomen. Jego kradzież szkodzi wszystkim</td></tr>'+
'<tr><td>SAN / multi-domain</td><td>Wiele nazw w jednym certyfikacie</td></tr>'+
'<tr><td>Samopodpisany</td><td>Bez zewnętrznego CA. Tylko laboratoria i zamknięte środowiska</td></tr>'+
'<tr><td>Podpisywanie kodu</td><td>Dowód pochodzenia i integralności oprogramowania</td></tr>'+
'<tr><td>S/MIME, użytkownika, maszyny</td><td>Poczta, uwierzytelnianie użytkowników i urządzeń (np. 802.1X, EAP-TLS)</td></tr></table></div>'+
'<h2>Cykl życia i zarządzanie</h2>'+
'<ol><li>Wygenerowanie klucza i CSR.</li><li>Weryfikacja i wystawienie przez CA.</li><li>Wdrożenie.</li><li>Monitoring ważności i <b>automatyczne odnawianie</b> (protokół ACME, np. Let&#39;s Encrypt).</li><li><b>Unieważnienie</b> przy kompromitacji klucza lub zmianie danych.</li><li>Wygaśnięcie i wycofanie.</li></ol>'+
'<ul><li><b>Key escrow</b>: bezpieczne przechowywanie kopii kluczy prywatnych (często w HSM) na wypadek utraty.</li>'+
'<li><b>DRA</b> (Data Recovery Agent): wyznaczony użytkownik, który może odzyskać dane zaszyfrowane, gdy klucz użytkownika jest niedostępny. Potrzebuje klucza z escrow.</li>'+
'<li><b>Pinning</b> kluczy publicznych utrudnia podstawienie fałszywego certyfikatu.</li>'+
'<li>Wiele awarii to nie ataki, tylko <b>wygasłe certyfikaty</b>. Prowadź inwentarz.</li></ul>'+
'<h2>Narzędzia szyfrujące</h2>'+
'<div class="tablewrap"><table><tr><th>Narzędzie</th><th>Co chroni</th><th>Uwagi</th></tr>'+
'<tr><td><b>BitLocker</b></td><td>Cały dysk Windows</td><td>TPM (opcjonalnie z PIN). <b>Klucz odzyskiwania</b> trzeba zapisać (AD/Entra ID) przed włączeniem</td></tr>'+
'<tr><td><b>LUKS</b> (dm-crypt)</td><td>Dysk lub partycja w Linuksie</td><td>Odpowiednik BitLockera</td></tr>'+
'<tr><td><b>VeraCrypt</b></td><td>Kontenery, partycje, dyski</td><td>Wieloplatformowe. Obsługuje ukryte woluminy</td></tr>'+
'<tr><td><b>GPG / PGP</b></td><td>Pliki i e-maile</td><td>Model zaufania sieciowy (web of trust), klucze wymieniane między osobami</td></tr>'+
'<tr><td><b>S/MIME</b></td><td>E-mail (podpis i szyfrowanie)</td><td>Oparte na certyfikatach z CA, wygodne w firmach</td></tr></table></div>'+
'<p>Wskazówka egzaminacyjna: PGP to szyfrowanie wymieniane między dwiema osobami bez centralnego CA, a S/MIME opiera się na certyfikatach z hierarchii PKI.</p>',
  ex:[
  {t:"Przykład 1: klucz, CSR i certyfikat laboratoryjny w OpenSSL",
   h:'<pre><code># klucz prywatny serwera\nopenssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out serwer.key\n\n# wniosek o certyfikat (CSR) z SAN\nopenssl req -new -key serwer.key -out serwer.csr \\\n  -subj "/C=PL/O=Firma Lab/CN=intranet.lab.local" \\\n  -addext "subjectAltName=DNS:intranet.lab.local"\n\n# podgląd wniosku\nopenssl req -in serwer.csr -noout -text | head -30\n\n# certyfikat samopodpisany tylko do laboratorium (30 dni)\nopenssl req -x509 -newkey rsa:3072 -nodes -keyout lab.key -out lab.crt -days 30 \\\n  -subj "/CN=intranet.lab.local" -addext "subjectAltName=DNS:intranet.lab.local"\n\n# odczyt certyfikatu\nopenssl x509 -in lab.crt -noout -subject -issuer -dates -ext subjectAltName</code></pre>'+
   '<p>Zwróć uwagę, że w CSR podróżuje tylko klucz publiczny. Plik <code>serwer.key</code> nigdy nie opuszcza serwera i ma restrykcyjne uprawnienia (<code>chmod 600</code>).</p>'},
  {t:"Przykład 2: GPG: klucze, szyfrowanie i podpis",
   h:'<pre><code>gpg --full-generate-key                              # generowanie pary kluczy\ngpg --armor --export anna@firma.pl &gt; anna.pub.asc    # eksport klucza publicznego\ngpg --gen-revoke anna@firma.pl &gt; anna.rev.asc        # certyfikat unieważnienia, przechowaj bezpiecznie\n\ngpg --import bartek.pub.asc\ngpg --encrypt --recipient bartek@firma.pl raport.pdf # szyfrowanie dla Bartka\ngpg --sign --armor wiadomosc.txt                     # podpis\ngpg --verify wiadomosc.txt.asc                       # weryfikacja podpisu\ngpg --fingerprint bartek@firma.pl                    # odcisk do potwierdzenia innym kanałem</code></pre>'+
   '<p>Odcisk klucza powinien być zweryfikowany innym kanałem (telefon, spotkanie). To odpowiednik weryfikacji klucza hosta w SSH.</p>'},
  {t:"Przykład 3: BitLocker, kolejność ma znaczenie",
   h:'<pre><code>:: stan szyfrowania\nmanage-bde -status\n\n:: PowerShell jako administrator\nAdd-BitLockerKeyProtector -MountPoint "C:" -RecoveryPasswordProtector\nBackup-BitLockerKeyProtector -MountPoint "C:" -KeyProtectorId "{ID_PROTEKTORA}"\nEnable-BitLocker -MountPoint "C:" -EncryptionMethod XtsAes256 -TpmProtector\n\n:: lista protektorów (do audytu)\nmanage-bde -protectors -get C:</code></pre>'+
   '<div class="callout warn"><strong>Najpierw zapisz klucz odzyskiwania</strong>Utrata dostępu do klucza odzyskiwania przy zmianie sprzętu lub awarii TPM oznacza utratę danych. W firmie klucze trafiają do AD lub Entra ID, a ich wydawanie jest kontrolowane i logowane (zadanie DRA).</div>'},
  {t:"Przykład 4: inwentarz certyfikatów (Python)",
   h:'<pre><code># pip install cryptography   (pole not_valid_after_utc wymaga wersji 42+)\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nfrom cryptography import x509\nfrom cryptography.hazmat.primitives.asymmetric import rsa\n\nfor path in Path("certs").glob("*.crt"):\n    cert = x509.load_pem_x509_certificate(path.read_bytes())\n    days = (cert.not_valid_after_utc - datetime.now(timezone.utc)).days\n    key = cert.public_key()\n    issues = []\n    if days &lt; 30:\n        issues.append(f"wygasa za {days} dni")\n    if isinstance(key, rsa.RSAPublicKey) and key.key_size &lt; 2048:\n        issues.append(f"słaby klucz RSA {key.key_size}")\n    if cert.subject == cert.issuer:\n        issues.append("samopodpisany")\n    print(path.name, cert.subject.rfc4514_string(), issues or "ok")</code></pre>'+
   '<p>To zalążek inwentarza. Wynik możesz wysyłać do n8n i budować alerty oraz zgłoszenia odnowienia. Prawdziwy inwentarz obejmuje też certyfikaty w load balancerach, chmurze i urządzeniach.</p>'}
  ],
  quiz:[
  {q:"Co zawiera wniosek o certyfikat (CSR)?",o:["Klucz prywatny wnioskodawcy","Dane podmiotu i klucz publiczny","Listę unieważnionych certyfikatów","Klucz prywatny CA"],a:1,w:"CSR zawiera dane podmiotu i klucz publiczny. Klucz prywatny nigdy nie jest wysyłany do CA."},
  {q:"Serwer WWW dołącza świeżą odpowiedź o statusie certyfikatu do uzgodnienia TLS, aby klient nie musiał sam pytać CA. Jak nazywa się ten mechanizm?",o:["CRL","OCSP stapling","Key escrow","Pinning"],a:1,w:"OCSP stapling przyspiesza walidację i zmniejsza obciążenie oraz wyciek informacji o odwiedzanych stronach."},
  {q:"Użytkownik zgubił klucz prywatny i nie otwiera zaszyfrowanych plików. Co umożliwia odzyskanie danych?",o:["DRA z kluczem pozyskanym z key escrow","Zmiana hasła do poczty","Wykonanie skanu antywirusowego","Pobranie CRL"],a:0,w:"Data Recovery Agent, korzystając z kopii klucza przechowywanej w escrow (np. w HSM), odzyskuje dane zaszyfrowane kluczem użytkownika."},
  {q:"Dlaczego klucz prywatny urzędu root CA przechowuje się offline?",o:["Aby przyspieszyć wystawianie certyfikatów","Bo jego kompromitacja zniszczyłaby zaufanie do całej hierarchii PKI","Bo jest bardzo duży","Bo CA nie potrzebuje klucza"],a:1,w:"Root jest kotwicą zaufania. Na co dzień certyfikaty wystawia CA pośredni, a root pozostaje offline i chroniony."},
  {q:"Które narzędzie jest typowym wyborem do szyfrowania całego dysku w Windows z użyciem TPM?",o:["GPG","BitLocker","S/MIME","OpenSSL s_client"],a:1,w:"BitLocker szyfruje woluminy i integruje się z TPM. Klucz odzyskiwania należy zabezpieczyć przed włączeniem."},
  {q:"Które stwierdzenie o PGP i S/MIME jest prawdziwe?",o:["S/MIME używa certyfikatów z hierarchii PKI, a PGP opiera się na bezpośredniej wymianie kluczy między osobami","PGP wymaga root CA, a S/MIME nie","Oba służą wyłącznie do szyfrowania dysków","Żadne nie wspiera podpisów"],a:0,w:"S/MIME wykorzystuje certyfikaty X.509 wystawiane przez CA, natomiast PGP to model zaufania oparty na wymianie i potwierdzaniu kluczy."}
  ]
};

LESSONS[15] = {
  lead:"Przy ataku ransomware to kopia zapasowa decyduje, czy firma wraca do pracy po godzinach, czy po tygodniach. Ta lekcja łączy backup, klasyfikację danych i podstawy ciągłości działania.",
  goals:["Zaprojektować strategię kopii 3-2-1 z kopią offline lub niezmienną","Porównać backup pełny, przyrostowy i różnicowy oraz policzyć potrzebne zestawy","Zdefiniować RPO, RTO i zastosować je do doboru rozwiązań","Sklasyfikować dane i dobrać zasady postępowania, retencji i niszczenia"],
  intro:
'<div class="callout"><strong>Powiązanie z Security+</strong>Klasyfikacja i ochrona danych, kopie zapasowe, redundancja oraz plany BCP/DRP. W tej lekcji domykamy też obietnicę kursu dotyczącą ciągłości działania.</div>'+
'<h2>Klasyfikacja danych</h2>'+
'<p>Nie wszystkie dane wymagają tej samej ochrony. Klasyfikacja pozwala przypisać odpowiednie zabezpieczenia i koszty. Przykładowa skala w firmie:</p>'+
'<div class="tablewrap"><table><tr><th>Klasa</th><th>Opis</th><th>Przykłady</th><th>Postępowanie</th></tr>'+
'<tr><td><b>Publiczne</b></td><td>Ujawnienie nie szkodzi</td><td>Materiały marketingowe, ogłoszenia</td><td>Kontrola integralności</td></tr>'+
'<tr><td><b>Wewnętrzne</b></td><td>Do użytku w firmie</td><td>Procedury, książka telefoniczna</td><td>Dostęp dla pracowników, nie na zewnątrz</td></tr>'+
'<tr><td><b>Poufne / wrażliwe</b></td><td>Wyciek szkodzi biznesowi lub osobom</td><td>Dane klientów, umowy, wynagrodzenia, kod źródłowy</td><td>Dostęp need-to-know, szyfrowanie, logowanie dostępu</td></tr>'+
'<tr><td><b>Ściśle tajne / krytyczne</b></td><td>Wyciek byłby bardzo dotkliwy</td><td>Klucze kryptograficzne, plany strategiczne, dane regulowane</td><td>Najściślejszy dostęp, silne szyfrowanie, zatwierdzanie, rygorystyczne niszczenie</td></tr></table></div>'+
'<p>Osobny wymiar to <b>rodzaj danych</b> regulowanych: dane osobowe (RODO, w tym szczególne kategorie), dane płatnicze (PCI DSS), dane zdrowotne, własność intelektualna. Rodzaj determinuje obowiązki prawne niezależnie od etykiety wewnętrznej. Ważne są też <b>miejsce przetwarzania danych</b> (suwerenność, transfery poza EOG) i okres retencji.</p>'+
'<h3>Role</h3>'+
'<ul><li><b>Właściciel danych</b>: osoba odpowiedzialna biznesowo, ustala klasyfikację i dostęp.</li><li><b>Powiernik / custodian</b>: IT, które wdraża zabezpieczenia i wykonuje kopie.</li><li><b>Administrator danych i podmiot przetwarzający</b> w rozumieniu RODO (lekcja 18).</li></ul>'+
'<h3>Mechanizmy ochrony</h3>'+
'<ul><li><b>Etykiety</b> i oznaczanie dokumentów, <b>DLP</b> (zapobieganie wyciekom).</li><li>Szyfrowanie w spoczynku i w tranzycie, <b>maskowanie</b> i <b>tokenizacja</b> w środowiskach testowych.</li><li><b>Retencja</b> i <b>niszczenie</b>: przechowuj tak długo, jak wymaga prawo i potrzeba, potem bezpiecznie usuń. Nośniki: nadpisanie (clear), oczyszczenie (purge), fizyczne zniszczenie (destroy). Dla nośników w chmurze i SSD stosuje się <b>crypto-erase</b>, czyli zniszczenie klucza.</li></ul>'+
'<h2>Kopie zapasowe</h2>'+
'<h3>Reguła 3-2-1-1-0</h3>'+
'<ul><li><b>3</b> kopie danych (oryginał i dwie kopie),</li><li>na <b>2</b> różnych typach nośników,</li><li><b>1</b> kopia poza lokalizacją (offsite),</li><li><b>1</b> kopia offline lub <b>niezmienna</b> (immutable/WORM, air-gap),</li><li><b>0</b> błędów: regularne <b>testy odtwarzania</b>.</li></ul>'+
'<h3>Typy kopii</h3>'+
'<div class="tablewrap"><table><tr><th>Typ</th><th>Co kopiuje</th><th>Odtwarzanie</th><th>Zajętość i czas</th></tr>'+
'<tr><td><b>Pełna</b></td><td>Wszystko</td><td>Jedna kopia, najszybsze</td><td>Najwięcej miejsca i czasu</td></tr>'+
'<tr><td><b>Przyrostowa</b></td><td>Zmiany od ostatniej kopii (dowolnego typu)</td><td>Pełna + wszystkie przyrosty, najwolniejsze</td><td>Najmniej miejsca, najkrótsze okno</td></tr>'+
'<tr><td><b>Różnicowa</b></td><td>Zmiany od ostatniej pełnej</td><td>Pełna + ostatnia różnicowa</td><td>Rośnie z dniami, środek stawki</td></tr></table></div>'+
'<p>Dodatkowo: <b>migawki</b> (snapshots) to szybkie punkty w czasie na poziomie systemu, <b>dziennik zmian</b> (journaling) umożliwia odtworzenie do dowolnej chwili.</p>'+
'<div class="callout warn"><strong>Replikacja to nie backup</strong>Replikacja natychmiast kopiuje także uszkodzenia i zaszyfrowane przez ransomware pliki. Zapewnia dostępność, ale nie chroni przed błędem logicznym ani atakiem. Potrzebne są wersje i kopie niezmienne.</div>'+
'<h3>Zasady bezpieczeństwa kopii</h3>'+
'<ul><li>Kopie <b>szyfrowane</b> w spoczynku i w tranzycie. Klucz osobno, z escrow.</li><li>Serwer i konsola backupu <b>poza domeną produkcyjną</b>, osobne konta z MFA (atakujący najpierw kasują kopie).</li><li>Regularne <b>testy odtwarzania</b> na prawdziwych scenariuszach i pomiar czasu.</li><li>Monitorowanie powodzenia zadań i alerty o brakach.</li></ul>'+
'<h2>RPO, RTO i ciągłość działania</h2>'+
'<ul><li><b>RPO</b> (Recovery Point Objective): ile danych możemy stracić, mierzone w czasie. RPO 4 godziny oznacza kopie lub replikację co najwyżej co 4 godziny.</li>'+
'<li><b>RTO</b> (Recovery Time Objective): jak długo system może być niedostępny.</li>'+
'<li><b>BIA</b> (Business Impact Analysis): analiza wpływu na biznes ustala krytyczność procesów, a z niej RPO i RTO. Krótsze cele kosztują znacznie więcej.</li>'+
'<li><b>BCP</b> (plan ciągłości działania) obejmuje ludzi, procesy i technologię w ogóle. <b>DRP</b> (plan odtwarzania po awarii) skupia się na przywróceniu systemów IT.</li>'+
'<li><b>Ośrodki zapasowe</b>: <i>hot</i> (gotowy, minuty), <i>warm</i> (część infrastruktury, godziny), <i>cold</i> (puste miejsce, dni).</li>'+
'<li><b>Redundancja</b>: RAID (1, 5, 6, 10 chronią przed awarią dysku, nie przed skasowaniem), zasilanie awaryjne (UPS, agregat), wielu dostawców łączy, klastry i chmura. RAID to nie kopia zapasowa.</li>'+
'<li><b>Perspektywa DORA (sektor finansowy)</b>: rozporządzenie reguluje ciągłość działania i kopie zapasowe (m.in. art. 11 i 12) w odniesieniu do funkcji krytycznych lub istotnych (KLIF). Ankieta KRI KNF pyta o: uruchomienia procedur zarządzania kryzysowego i planów ciągłości poza testami (BCP.01, BCP.05), awarie systemów ICT i systemów wspierających KLIF (BCP.02, BCP.03), liczbę kluczowych pracowników ICT i bezpieczeństwa oraz tych wskazanych w planach z odpowiednią nadmiarowością (MOI.08, MOI.09), a także o strategie i plany wyjścia z usług wspierających KLIF (MOI.12, OUT.10, OUT.11). To dobre pytania kontrolne także poza sektorem finansowym: czy zakładamy, że zabraknie nie tylko serwera, ale i człowieka oraz dostawcy.</li>'+
'<li><b>Testy</b>: przegląd dokumentacji, ćwiczenie scenariuszowe (tabletop), test przełączenia, test drzewa telefonów.</li></ul>',
  ex:[
  {t:"Przykład 1: ile zestawów potrzeba do odtworzenia?",
   h:'<p>W poniedziałek pełna kopia 50 GB. Codziennie przybywa 5 GB zmian. Awaria w piątek rano (ostatnia kopia w czwartek).</p>'+
   '<div class="tablewrap"><table><tr><th>Strategia</th><th>Kopie w tygodniu</th><th>Odtworzenie w piątek</th><th>Zajęte miejsce</th></tr>'+
   '<tr><td>Przyrostowa</td><td>Pn pełna 50 GB; wt, śr, czw po 5 GB</td><td>Pełna + 3 przyrosty (4 zestawy)</td><td>65 GB</td></tr>'+
   '<tr><td>Różnicowa</td><td>Pn pełna 50 GB; wt 5 GB, śr 10 GB, czw 15 GB</td><td>Pełna + czwartkowa różnicowa (2 zestawy)</td><td>80 GB</td></tr>'+
   '<tr><td>Codzienna pełna</td><td>50, 55, 60, 65 GB</td><td>Tylko czwartkowa (1 zestaw)</td><td>230 GB</td></tr></table></div>'+
   '<p>Wniosek: przyrostowa oszczędza miejsce i czas kopiowania, ale wydłuża i komplikuje odtwarzanie. Różnicowa jest kompromisem. Wybór wynika z RTO i okna backupu.</p>'},
  {t:"Przykład 2: kontrola RPO w Pythonie",
   h:'<pre><code>import time\nfrom pathlib import Path\n\nRPO_GODZIN = 24\n\n\ndef wiek_ostatniej_kopii_h(katalog: str):\n    pliki = [p for p in Path(katalog).rglob("*") if p.is_file()]\n    if not pliki:\n        return None\n    najnowszy = max(p.stat().st_mtime for p in pliki)\n    return (time.time() - najnowszy) / 3600\n\n\nfor system, sciezka in {"ERP": "/mnt/backup/erp", "Pliki": "/mnt/backup/pliki"}.items():\n    wiek = wiek_ostatniej_kopii_h(sciezka)\n    if wiek is None:\n        print(f"{system}: BRAK KOPII!")\n    elif wiek &gt; RPO_GODZIN:\n        print(f"{system}: RPO PRZEKROCZONE ({wiek:.1f} h)")\n    else:\n        print(f"{system}: ok ({wiek:.1f} h)")</code></pre>'+
   '<p>Skrypt sprawdza <i>istnienie świeżej kopii</i>, ale nie jej poprawność. Dlatego regularnie wykonuj też test odtworzenia. Wynik wysyłaj do alertów (np. przez n8n).</p>'},
  {t:"Przykład 3: szyfrowane kopie z restic",
   h:'<pre><code>export RESTIC_REPOSITORY=/mnt/backup/restic-repo      # lub s3:..., sftp:...\nexport RESTIC_PASSWORD_FILE=/root/.restic-pass        # hasło repozytorium: zapisz też w sejfie!\n\nrestic init                                            # nowe, szyfrowane repozytorium\nrestic backup /srv/dane --tag codziennie               # kopia przyrostowa z deduplikacją\nrestic snapshots                                       # lista migawek\nrestic check --read-data-subset=10%                    # kontrola integralności\nrestic restore latest --target /tmp/test-odtworzenia   # TEST odtwarzania\nrestic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune   # retencja</code></pre>'+
   '<div class="callout warn"><strong>Utrata hasła = utrata kopii</strong>Hasło repozytorium to klucz do wszystkiego. Przechowuj je w sejfie haseł z kopią awaryjną (escrow). Dla ochrony przed ransomware repozytorium powinno być dopisywalne, ale niemożliwe do usunięcia z hosta produkcyjnego (np. bucket z blokadą obiektów).</div>'},
  {t:"Przykład 4: klasyfikacja i postępowanie",
   h:'<div class="tablewrap"><table><tr><th>Dokument / zbiór</th><th>Klasa</th><th>Zasady</th></tr>'+
   '<tr><td>Cennik publikowany na stronie</td><td>Publiczne</td><td>Kontrola zmian, bez ograniczeń dostępu</td></tr>'+
   '<tr><td>Instrukcja wewnętrzna helpdesku</td><td>Wewnętrzne</td><td>Dostęp tylko dla pracowników</td></tr>'+
   '<tr><td>Baza zamówień z danymi klientów</td><td>Poufne (dane osobowe)</td><td>Szyfrowanie, need-to-know, retencja zgodna z prawem, maskowanie w testach</td></tr>'+
   '<tr><td>Klucze podpisu kodu i hasła root</td><td>Krytyczne</td><td>HSM lub sejf PAM, zatwierdzanie dostępu, rotacja, brak kopii poza escrow</td></tr></table></div>'+
   '<details><summary>Ćwiczenie: ransomware zaszyfrował serwer plików, a replikacja już przekazała zaszyfrowane pliki na serwer zapasowy</summary><ul><li>Replikacja nie pomoże. Szukamy kopii z wcześniejszego punktu w czasie (migawka lub kopia niezmienna/offline).</li><li>Priorytetyzacja według RTO z BIA: najpierw systemy o najkrótszym RTO.</li><li>Odtwarzanie do czystego, odizolowanego środowiska po usunięciu przyczyny (inaczej atak powtórzy się).</li><li>RPO wynika z wieku ostatniej dobrej kopii. Różnica to utracone dane do odtworzenia z innych źródeł.</li><li>Komunikacja z zarządem, prawnikiem i regulatorem (RODO). Wnioski trafiają do poprawy planu.</li></ul></details>'}
  ],
  quiz:[
  {q:"Pełna kopia w poniedziałek, przyrostowe od wtorku do czwartku. W piątek trzeba odtworzyć dane. Ile zestawów kopii jest potrzebnych?",o:["1","2","4","5"],a:2,w:"Przy kopiach przyrostowych potrzebna jest pełna kopia i wszystkie kolejne przyrosty (wt, śr, czw), czyli cztery zestawy."},
  {q:"Przy której strategii odtworzenie wymaga tylko pełnej kopii i ostatniej kopii z tego samego typu?",o:["Przyrostowej","Różnicowej","Replikacji","RAID 5"],a:1,w:"Kopia różnicowa zawiera zmiany od ostatniej pełnej, więc potrzebujesz pełnej i najnowszej różnicowej."},
  {q:"Dlaczego replikacja danych nie zastępuje backupu?",o:["Bo jest zbyt wolna","Bo błędy i zaszyfrowane przez ransomware pliki są natychmiast replikowane do kopii","Bo nie obsługuje szyfrowania","Bo wymaga taśm"],a:1,w:"Replikacja zapewnia dostępność, ale kopiuje także uszkodzenia. Backup powinien przechowywać wersje z różnych punktów w czasie."},
  {q:"Firma toleruje utratę najwyżej 4 godzin danych. Którą wartość to opisuje?",o:["RTO = 4 h","RPO = 4 h","MTTR = 4 h","SLA = 4 h"],a:1,w:"RPO to maksymalny dopuszczalny czas (a więc ilość) utraconych danych. RTO dotyczy czasu przywrócenia usługi."},
